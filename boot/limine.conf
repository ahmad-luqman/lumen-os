# Limine configuration (syntax: Limine 12.x CONFIG.md).
# tools/mkiso.sh replaces @CMDLINE@ per image (e.g. tests add lumen.qemu_exit).
timeout: 0
serial: yes

/Lumen
    protocol: limine
    path: boot():/boot/lumen-kernel
    cmdline: @CMDLINE@
    # Fixed mode so screenshots are comparable across machines.
    resolution: 1280x800
