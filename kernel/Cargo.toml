[package]
name = "lumen-kernel"
description = "The Lumen kernel"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "lumen-kernel"
path = "src/main.rs"
test = false
bench = false

[features]
# Build the in-kernel test runner: instead of the shells, run every
# `ktest!` and report TAP over serial.
ktest = ["lumen-bcache/test-util", "lumen-proc/test-util"]

[dependencies]
ext4plus.workspace = true
limine.workspace = true
linux-raw-sys = { workspace = true, features = ["net"] }
log.workspace = true
lumen-acpi.workspace = true
lumen-app-api.workspace = true
lumen-bcache.workspace = true
lumen-demo.workspace = true
lumen-elf.workspace = true
lumen-epoll.workspace = true
lumen-eventfd.workspace = true
lumen-font.workspace = true
lumen-futex.workspace = true
lumen-gfx.workspace = true
lumen-heap.workspace = true
lumen-input.workspace = true
lumen-mm.workspace = true
lumen-net = { path = "../crates/lumen-net" }
lumen-pci.workspace = true
lumen-perf.workspace = true
lumen-pipe.workspace = true
lumen-png.workspace = true
lumen-proc.workspace = true
lumen-queue.workspace = true
lumen-rand.workspace = true
lumen-shell.workspace = true
lumen-signal.workspace = true
lumen-sockabi.workspace = true
lumen-synth.workspace = true
lumen-term.workspace = true
lumen-time.workspace = true
lumen-trace.workspace = true
lumen-tty.workspace = true
lumen-uart.workspace = true
lumen-ui.workspace = true
lumen-vfs.workspace = true
lumen-vm.workspace = true
lumen-wm.workspace = true
noto-sans-mono-bitmap.workspace = true
pc-keyboard.workspace = true
postcard.workspace = true
rhai.workspace = true
rustc-demangle.workspace = true
serde.workspace = true
smoltcp.workspace = true
virtio-drivers.workspace = true
wasmi.workspace = true
zerocopy.workspace = true

[lints]
workspace = true
