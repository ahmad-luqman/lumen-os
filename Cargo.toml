[workspace]
resolver = "3"
members = ["kernel", "crates/*"]
# `cargo test` / `cargo clippy` with no flags run on the host-testable crates only.
# The kernel is built for x86_64-unknown-none via `make build`.
default-members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/ahmad-luqman/lumen-os"

[workspace.dependencies]
lumen-acpi = { path = "crates/lumen-acpi" }
lumen-elf = { path = "crates/lumen-elf" }
lumen-heap = { path = "crates/lumen-heap" }
lumen-mm = { path = "crates/lumen-mm" }
lumen-queue = { path = "crates/lumen-queue" }
lumen-time = { path = "crates/lumen-time" }
lumen-trace = { path = "crates/lumen-trace" }
# 0.6.x needs nightly (#![feature(ptr_metadata)]); 0.5.0 is the newest stable-compatible release.
limine = "=0.5.0"
log = { version = "0.4", default-features = false }
rustc-demangle = { version = "=0.1.28", default-features = false }
# PS/2 scancode decoding and keyboard layouts (#58).
pc-keyboard = { version = "=0.9.0", default-features = false }
noto-sans-mono-bitmap = { version = "=0.4.0", default-features = false, features = ["regular", "bold", "size_16", "size_32", "unicode-basic-latin"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "allow"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

[profile.dev]
panic = "abort"

# The trace ring's concurrency tests only hit their race windows reliably
# when optimized (measured with mutants in the PR #15 review).
[profile.dev.package.lumen-trace]
opt-level = 3

# The kernel is always built with the release profile: optimized, but with
# symbols, overflow checks and debug assertions kept (safety over speed).
[profile.release]
panic = "abort"
debug = "line-tables-only"
strip = false
overflow-checks = true
debug-assertions = true
