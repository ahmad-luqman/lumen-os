[workspace]
resolver = "3"
members = ["kernel", "crates/*"]
# `cargo test` / `cargo clippy` with no flags run on the host-testable crates only.
# The kernel is built for x86_64-unknown-none via `make build`.
default-members = ["crates/*"]
# The WASM apps are their own workspace (apps/Cargo.toml), built by `make build`.
exclude = ["apps"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/ahmad-luqman/lumen-os"

[workspace.dependencies]
lumen-acpi = { path = "crates/lumen-acpi" }
lumen-app-api = { path = "crates/lumen-app-api" }
lumen-calc = { path = "crates/lumen-calc" }
lumen-clock = { path = "crates/lumen-clock" }
lumen-edit = { path = "crates/lumen-edit" }
lumen-demo = { path = "crates/lumen-demo" }
lumen-elf = { path = "crates/lumen-elf" }
lumen-font = { path = "crates/lumen-font" }
lumen-gfx = { path = "crates/lumen-gfx" }
lumen-heap = { path = "crates/lumen-heap" }
lumen-input = { path = "crates/lumen-input" }
lumen-mm = { path = "crates/lumen-mm" }
lumen-pci = { path = "crates/lumen-pci" }
lumen-perf = { path = "crates/lumen-perf" }
lumen-png = { path = "crates/lumen-png" }
lumen-queue = { path = "crates/lumen-queue" }
lumen-rand = { path = "crates/lumen-rand" }
lumen-shell = { path = "crates/lumen-shell" }
lumen-snake = { path = "crates/lumen-snake" }
lumen-synth = { path = "crates/lumen-synth" }
lumen-term = { path = "crates/lumen-term" }
lumen-time = { path = "crates/lumen-time" }
lumen-trace = { path = "crates/lumen-trace" }
lumen-uart = { path = "crates/lumen-uart" }
lumen-ui = { path = "crates/lumen-ui" }
lumen-view = { path = "crates/lumen-view" }
lumen-wm = { path = "crates/lumen-wm" }
# 0.6.x needs nightly (#![feature(ptr_metadata)]); 0.5.0 is the newest stable-compatible release.
limine = "=0.5.0"
log = { version = "0.4", default-features = false }
rustc-demangle = { version = "=0.1.28", default-features = false }
# PS/2 scancode decoding and keyboard layouts (#58).
pc-keyboard = { version = "=0.9.0", default-features = false }
# Terminal escape parsing and character widths (#59).
vte = { version = "=0.15.0", default-features = false }
unicode-width = { version = "=0.2.3", default-features = false }
# The shell's word splitter is checked against it (lumen-shell dev-dependency, #62).
shlex = { version = "=2.0.1", default-features = false }
# Scripting in the shell (#67): integers only (floats would be soft-float
# library calls on this target: slow, and nothing needs them yet), no
# modules (no files until M6), no time, and closures that can't capture
# (`no_closure`: a capturing closure curries shared values, which nest
# without being counted by the size limits; `curry` itself is disabled in
# the engine).
rhai = { version = "=1.27.0", default-features = false, features = ["no_std", "no_float", "only_i64", "no_module", "no_time", "no_closure"] }
noto-sans-mono-bitmap = { version = "=0.4.0", default-features = false, features = ["regular", "bold", "size_16", "size_32", "unicode-basic-latin"] }
# TrueType rasterizing for the desktop's text (#148, lumen-font). Without
# its default `simd` feature: that one uses SSE intrinsics, and the kernel
# is built without SSE (floats are soft-float library calls). `hashbrown`
# is what makes it `no_std`.
fontdue = { version = "=0.9.5", default-features = false, features = ["hashbrown"] }
# virtio devices over PCI (#95): virtqueues and device protocols; Lumen
# supplies the transport and the `Hal` (kernel/src/virtio.rs). `alloc`
# because input and sound use `Box`/`Vec`; no `embedded-io`.
virtio-drivers = { version = "=0.13.0", default-features = false, features = ["alloc"] }
# `Transport::read_config_space`/`write_config_space` name its traits and
# virtio-drivers doesn't re-export them: pinned to the version Cargo.lock
# already resolves for virtio-drivers (and rhai).
zerocopy = { version = "=0.8.63", default-features = false }
# zlib for the screenshot's PNG (#150). Not zune-png's encoder: 0.5.2 writes
# only stored (uncompressed) deflate blocks. No `simd` (adler32 by SIMD).
miniz_oxide = { version = "=0.9.1", default-features = false, features = ["with-alloc"] }
# PNG decoding for the desktop's wallpaper (#154, lumen_png::decode).
# Without its default features: `std`, and `sse` (SSE intrinsics; the
# kernel is built without SSE).
zune-png = { version = "=0.5.2", default-features = false }
zune-core = { version = "=0.5.3", default-features = false }
# The WASM interpreter for apps (#197; M5). `validate`: `Module::new`
# checks what it compiles. `portable-dispatch`: wasmi's loop dispatch, whose
# native stack depth stays constant however long a module runs (host calls
# aside). This line's `default-features = false` drops `auto-dispatch` (a
# default), and wasmi then dispatches by tail calls whatever the profile: each
# instruction's handler calls the next, relying on LLVM to make those calls
# jumps, which wasmi's build script expects only with debug assertions off.
# The kernel keeps them on (`profile.release`), and in #197 a
# 300k-iteration loop overflowed a 64 KiB thread stack that way (ktest
# app::wasmi_runs_a_long_loop_in_fuel_slices). `auto-dispatch` would pick
# the loop here too, but would switch back to tail calls if the profile
# changed: stack safety should not hang on an optimizer.
wasmi = { version = "=2.0.1", default-features = false, features = ["validate", "portable-dispatch"] }
# The app interface's wire format (ARCHITECTURE section 8, M5): postcard over
# serde-derived types in `lumen-app-api` (#199). postcard's `alloc` gives
# `to_allocvec`, serde's the `Vec`/`String` impls; no `std`, and without
# postcard's default `heapless-cas` (heapless isn't needed).
postcard = { version = "=1.1.3", default-features = false, features = ["alloc"] }
serde = { version = "=1.0.229", default-features = false, features = ["derive", "alloc"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "allow"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

[profile.dev]
panic = "abort"

# The trace ring's concurrency tests only hit their race windows reliably
# when optimized (measured with mutants in the PR #15 review).
[profile.dev.package.lumen-trace]
opt-level = 3

# The kernel is always built with the release profile: optimized, but with
# symbols, overflow checks and debug assertions kept (safety over speed).
[profile.release]
panic = "abort"
debug = "line-tables-only"
strip = false
overflow-checks = true
debug-assertions = true
