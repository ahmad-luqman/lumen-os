[workspace]
resolver = "3"
members = ["kernel", "crates/*"]
# `cargo test` / `cargo clippy` with no flags run on the host-testable crates only.
# The kernel is built for x86_64-unknown-none via `make build`.
default-members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/ahmad-luqman/lumen-os"

[workspace.dependencies]
lumen-acpi = { path = "crates/lumen-acpi" }
lumen-elf = { path = "crates/lumen-elf" }
lumen-heap = { path = "crates/lumen-heap" }
lumen-mm = { path = "crates/lumen-mm" }
lumen-queue = { path = "crates/lumen-queue" }
lumen-shell = { path = "crates/lumen-shell" }
lumen-term = { path = "crates/lumen-term" }
lumen-time = { path = "crates/lumen-time" }
lumen-trace = { path = "crates/lumen-trace" }
lumen-uart = { path = "crates/lumen-uart" }
# 0.6.x needs nightly (#![feature(ptr_metadata)]); 0.5.0 is the newest stable-compatible release.
limine = "=0.5.0"
log = { version = "0.4", default-features = false }
rustc-demangle = { version = "=0.1.28", default-features = false }
# PS/2 scancode decoding and keyboard layouts (#58).
pc-keyboard = { version = "=0.9.0", default-features = false }
# Terminal escape parsing and character widths (#59).
vte = { version = "=0.15.0", default-features = false }
unicode-width = { version = "=0.2.3", default-features = false }
# The shell's word splitter is checked against it (lumen-shell dev-dependency, #62).
shlex = { version = "=2.0.1", default-features = false }
# Scripting in the shell (#67): integers only (floats would be soft-float
# library calls on this target: slow, and nothing needs them yet), no
# modules (no files until M6), no time, and no closures (a closure captures
# by currying shared values, which nest without being counted by the size
# limits; `curry` itself is disabled in the engine).
rhai = { version = "=1.27.0", default-features = false, features = ["no_std", "no_float", "only_i64", "no_module", "no_time", "no_closure"] }
noto-sans-mono-bitmap = { version = "=0.4.0", default-features = false, features = ["regular", "bold", "size_16", "size_32", "unicode-basic-latin"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "allow"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

[profile.dev]
panic = "abort"

# The trace ring's concurrency tests only hit their race windows reliably
# when optimized (measured with mutants in the PR #15 review).
[profile.dev.package.lumen-trace]
opt-level = 3

# The kernel is always built with the release profile: optimized, but with
# symbols, overflow checks and debug assertions kept (safety over speed).
[profile.release]
panic = "abort"
debug = "line-tables-only"
strip = false
overflow-checks = true
debug-assertions = true
