# Pinned toolchain (hard rule 7). Bump deliberately, in its own PR, with CI green.
# Stable only: no nightly features anywhere in the tree.
[toolchain]
channel = "1.99.1"
profile = "minimal"
components = ["rustfmt", "clippy", "llvm-tools"]
# wasm32-unknown-unknown: Lumen's apps (apps/, M5), run by the kernel's wasmi.
targets = ["x86_64-unknown-none", "wasm32-unknown-unknown"]
