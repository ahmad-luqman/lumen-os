# Lumen's apps (M5): WASM modules for `wasm32-unknown-unknown`, to be run by
# the kernel's `wasmi` (#197, #199). Their own workspace, outside the root
# one (which excludes apps/), so the host crates' `cargo test`/`clippy` and
# the kernel's builds never see them. `make build` builds them; the layout
# (where each module goes, the test apps) is ARCHITECTURE section 8's
# "Building and bundling".
[workspace]
resolver = "3"
# Every directory is a crate named after it (the harness checks the names):
# an app (a `cdylib`, which `make apps` copies) or a library the apps share
# (`lumen-app`, the SDK; `testkit`, the runtime tests' raw calls). Not dot directories (.cargo, an
# editor's): cargo's `*` would match them too.
members = ["[!.]*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/ahmad-luqman/lumen-os"

# Crates the apps share with the kernel: path dependencies on crates/.
[workspace.dependencies]
lumen-app-api = { path = "../crates/lumen-app-api" }
lumen-calc = { path = "../crates/lumen-calc" }
lumen-gfx = { path = "../crates/lumen-gfx" }
lumen-heap = { path = "../crates/lumen-heap" }
lumen-ui = { path = "../crates/lumen-ui" }
lumen-app = { path = "lumen-app" }
testkit = { path = "testkit" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

# Apps are always built with the release profile. Interpreted, so fewer
# instructions matter more than size. The target's panic strategy is
# already abort, and the default profile keeps the name section (function
# names, so a trap can name where it happened; the harness checks it).
[profile.release]
lto = true
codegen-units = 1
