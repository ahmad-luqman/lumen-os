[package]
name = "template"
description = "The app to copy (#206; `make app NAME=foo` makes apps/foo from it): opens a window titled with its name, draws a line of text and the keys typed, and ends when its window is closed."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib"]
# A WASM module has no host-side tests: the kernel runs it
# (tests/scenarios/test_apps.py).
test = false
doctest = false
bench = false

[dependencies]
lumen-app.workspace = true

[lints]
workspace = true
