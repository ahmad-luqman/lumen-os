# Cargo inside apps/ (where `make apps`, `make lint` and `make fmt` run it)
# builds for WASM.
[build]
target = "wasm32-unknown-unknown"

# Next to the root workspace's target/, not inside it (CI's cache cleans
# target/ by the root's packages):
# target-apps/wasm32-unknown-unknown/release/<crate>.wasm.
target-dir = "../target-apps"

# Every app's memory is fixed (ARCHITECTURE section 8): its initial size is
# its maximum, 2 MiB (wasm-ld's 1 MiB stack, the data, the heap). The
# default for every module here; an app sets its own in its build.rs
# (apps/template's: a build script's link arguments come after these, and
# wasm-ld takes the last).
[target.wasm32-unknown-unknown]
rustflags = ["-C", "link-arg=--initial-memory=2097152", "-C", "link-arg=--max-memory=2097152"]
