[package]
name = "test-window"
description = "A test app for windows (#206), built on the SDK (lumen-app): opens a window and reads its events until `Close`; with `wait`, blocks in window_wait for good (kill wakes it); with `ignore-close`, spins once given `Close` (the close grace ends it)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib"]
# A WASM module has no host-side tests: the kernel's runtime runs it
# (tests/scenarios/test_apps.py).
test = false
doctest = false
bench = false

[dependencies]
lumen-app.workspace = true

[lints]
workspace = true
