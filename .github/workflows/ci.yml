name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only whatever the repository's default token permissions: the
# checkout and the durable mirror's check only read.
permissions:
  contents: read

jobs:
  ci:
    name: build, audit, test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install QEMU, xorriso, gdb, and e2fsprogs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 xorriso gdb e2fsprogs

      - name: Enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || echo "no KVM; tests fall back to TCG"

      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustc --version

      # setup-uv publishes no floating major tags; pin an exact release.
      - uses: astral-sh/setup-uv@v10.3.2

      - uses: Swatinem/rust-cache@v2
        with:
          # The root workspace, and apps/ (its own workspace, building into
          # target-apps/; the target is relative to the workspace).
          workspaces: |
            . -> target
            apps -> ../target-apps

      # Only tools/fetch-deps.sh's own downloads: the zig and libc-test
      # sources and the developer image's packages have entries of their own
      # (below), so no file sits in two entries. `build/deps/*`, not
      # `build/deps`: the bare directory is one match, archived whole, so an
      # exclusion of a path inside it drops nothing.
      - name: Cache boot and userspace dependencies (Limine, OVMF, busybox, Alpine minirootfs)
        uses: actions/cache@v6
        with:
          path: |
            build/deps/*
            !build/deps/zig
            !build/deps/zig.lock
            !build/deps/zig.tmp.*
            !build/deps/libc-test
            !build/deps/alpine-packages
          key: deps-${{ hashFiles('tools/fetch-deps.sh') }}

      - run: make deps
      - run: make fmt-check
      - run: make lint
      - run: make build
      - name: Flag audit (no SSE/AVX, no red zone, kernel code model)
        run: make audit
      # musl libc-test (#345): the pinned zig and libc-test checkout, keyed on
      # the scripts that pin them (each also checks its own stamp), then the
      # build, which tests/harness/test_libctest.py checks and runs natively.
      # Restore, fetch, save, build: the save follows the fetch alone, so a
      # slow but complete download is kept even if the build or a later step
      # fails (actions/cache's own save runs only at the end of a successful
      # job). Never after a failed fetch: a cache key is written once, and a
      # partial save would keep its key from ever holding a good copy.
      - name: Restore the pinned zig and libc-test sources
        id: libc-test-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            build/deps/zig
            build/deps/libc-test
          key: zig-libc-test-${{ runner.os }}-${{ hashFiles('tools/fetch-zig.sh', 'tools/fetch-libc-test.sh') }}
      - name: Fetch the pinned zig and libc-test sources
        id: libc-test-fetch
        timeout-minutes: 15
        run: make deps-zig && tools/fetch-libc-test.sh
      - name: Save the pinned zig and libc-test sources
        if: steps.libc-test-fetch.outcome == 'success' && steps.libc-test-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            build/deps/zig
            build/deps/libc-test
          key: ${{ steps.libc-test-cache.outputs.cache-primary-key }}
      - name: Build musl libc-test with the pinned zig
        timeout-minutes: 10
        run: make libc-test
      # The Alpine developer image (#344) for M8's gates, in five steps.
      # First the durable mirror's check, which reads the release's asset
      # list and one file's headers (under 10 s): CI fails a lock change
      # until its files are mirrored (tools/mirror-alpine-packages.sh
      # upload). It doesn't stop the job: the last step fails it, so the
      # other results are still there to read. Then the packages
      # (tools/alpine-packages.lock) in the same restore, fetch, save, build
      # steps as above, keyed on the lock (the fetch keeps exactly the lock's
      # files; an older lock's entry restores what the two share); the image
      # itself is rebuilt from them every run (about 5 s), not cached. A cold
      # cache fetches from dl-cdn, and the durable mirror serves any file
      # dl-cdn doesn't give (a dropped build, or dl-cdn down;
      # tools/fetch-alpine-packages.sh), each try capped at 300 s.
      - name: Check the durable mirror holds every locked package
        id: mirror-check
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/mirror-alpine-packages.sh check
      - name: Restore the Alpine developer image's packages
        id: apk-cache
        uses: actions/cache/restore@v6
        with:
          path: build/deps/alpine-packages
          key: alpine-packages-${{ hashFiles('tools/alpine-packages.lock') }}
          restore-keys: alpine-packages-
      - name: Fetch the Alpine developer image's packages
        id: apk-fetch
        timeout-minutes: 15
        env:
          LUMEN_APK_MAX_TIME: 300
        run: make deps-dev
      - name: Save the Alpine developer image's packages
        if: steps.apk-fetch.outcome == 'success' && steps.apk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: build/deps/alpine-packages
          key: ${{ steps.apk-cache.outputs.cache-primary-key }}
      - name: Build the Alpine developer image
        timeout-minutes: 5
        run: make rootfs-dev
      - run: make test-host
      - name: QEMU scenarios (boot, crash reports, in-kernel tests, golden images)
        id: scenarios
        run: make test-scenarios
      # Also after failed scenarios: the gate writes the feature table to the
      # job summary, and that is where a failing run is most useful to read.
      - name: Feature gate (every feature in tests/features/ passes)
        if: ${{ !cancelled() && steps.scenarios.outcome != 'skipped' }}
        run: make status-check

      # KVM is fast but QEMU's `-d int` interrupt trace only works under TCG:
      # re-run the scenarios that failed under TCG so the uploaded artifacts
      # include it. Only after a failed scenarios step: after another step's
      # failure (a harness test, say), --last-failed sees that failure outside
      # tests/scenarios and re-runs every scenario, --lfnf or not. --lfnf=none:
      # if pytest recorded no failure at all (an ISO build error, a killed
      # run), re-run nothing, where the default re-runs everything.
      # A separate artifact root, so the KVM run's evidence survives, and its own
      # junit file, so the upload shows how the re-run went. Its own timeout,
      # so a long re-run fails this step rather than the job (a job timeout
      # would skip the upload below). Every outcome is annotated, none fatal:
      # passed under TCG (0: KVM-only or flaky), failed again (1; flagged if
      # it was setup errors), nothing recorded to re-run (5), or a broken
      # re-run (anything else).
      - name: Re-run failed scenarios under TCG for interrupt traces
        if: ${{ failure() && steps.scenarios.outcome == 'failure' }}
        timeout-minutes: 10
        run: |
          rc=0
          LUMEN_ACCEL=tcg LUMEN_ARTIFACTS_DIR=build/test-artifacts-tcg \
            uv run --frozen pytest tests/scenarios --last-failed --lfnf=none -v \
            --junitxml=build/test-artifacts-tcg/scenarios.xml || rc=$?
          case $rc in
            0) echo "::notice::the scenarios that failed under KVM passed under TCG (KVM-only or flaky; passing tests keep no artifacts)" ;;
            1) if grep -q 'errors="[1-9]' build/test-artifacts-tcg/scenarios.xml 2>/dev/null; then
                 echo "::warning::the TCG re-run had setup errors, not only scenario failures (see its scenarios.xml)"
               fi ;;
            5) echo "::notice::pytest recorded no failure at all (the scenarios step failed outside pytest, or was killed): nothing re-run under TCG" ;;
            *) echo "::warning::TCG re-run broke (pytest exit $rc)" ;;
          esac

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-artifacts
          path: |
            build/test-artifacts
            build/test-artifacts-tcg
            build/test-results
          if-no-files-found: ignore

      # The durable mirror's check (above) runs with continue-on-error so
      # that the steps after it still run; its failure fails the job here,
      # and so does a check cut off by its timeout (outcome `cancelled`).
      - name: Fail if the durable mirror check failed
        if: ${{ !cancelled() && (steps.mirror-check.outcome == 'failure' || steps.mirror-check.outcome == 'cancelled') }}
        run: |
          echo "::error::the durable mirror check failed (a locked package missing, broken or not downloadable): see that step"
          exit 1
