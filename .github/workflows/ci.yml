name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: build, audit, test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install QEMU, xorriso and gdb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 xorriso gdb

      - name: Enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || echo "no KVM; tests fall back to TCG"

      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustc --version

      # setup-uv publishes no floating major tags; pin an exact release.
      - uses: astral-sh/setup-uv@v10.3.2

      - uses: Swatinem/rust-cache@v2

      - name: Cache boot dependencies (Limine, OVMF)
        uses: actions/cache@v6
        with:
          path: build/deps
          key: deps-${{ hashFiles('tools/fetch-deps.sh') }}

      - run: make deps
      - run: make fmt-check
      - run: make lint
      - run: make build
      - name: Flag audit (no SSE/AVX, no red zone, kernel code model)
        run: make audit
      - run: make test-host
      - name: QEMU scenarios (boot, crash reports, in-kernel tests, golden images)
        id: scenarios
        run: make test-scenarios
      # Also after failed scenarios: the gate writes the feature table to the
      # job summary, and that is where a failing run is most useful to read.
      - name: Feature gate (every feature in tests/features/ passes)
        if: ${{ !cancelled() && steps.scenarios.outcome != 'skipped' }}
        run: make status-check

      # TEMPORARY (#61): measure serial before/after under KVM; reverted before merge.
      - name: Measure serial (boot timeline and bench, main vs branch)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: tools/measure_serial.sh

      # KVM is fast but QEMU's `-d int` interrupt trace only works under TCG:
      # re-run the scenarios that failed under TCG so the uploaded artifacts
      # include it. Only after a failed scenarios step: after another step's
      # failure (a harness test, say), --last-failed sees that failure outside
      # tests/scenarios and re-runs every scenario, --lfnf or not. --lfnf=none:
      # if pytest recorded no failure at all (an ISO build error, a killed
      # run), re-run nothing, where the default re-runs everything.
      # A separate artifact root, so the KVM run's evidence survives, and its own
      # junit file, so the upload shows how the re-run went. Its own timeout,
      # so a long re-run fails this step rather than the job (a job timeout
      # would skip the upload below). Every outcome is annotated, none fatal:
      # passed under TCG (0: KVM-only or flaky), failed again (1; flagged if
      # it was setup errors), nothing recorded to re-run (5), or a broken
      # re-run (anything else).
      - name: Re-run failed scenarios under TCG for interrupt traces
        if: ${{ failure() && steps.scenarios.outcome == 'failure' }}
        timeout-minutes: 10
        run: |
          rc=0
          LUMEN_ACCEL=tcg LUMEN_ARTIFACTS_DIR=build/test-artifacts-tcg \
            uv run --frozen pytest tests/scenarios --last-failed --lfnf=none -v \
            --junitxml=build/test-artifacts-tcg/scenarios.xml || rc=$?
          case $rc in
            0) echo "::notice::the scenarios that failed under KVM passed under TCG (KVM-only or flaky; passing tests keep no artifacts)" ;;
            1) if grep -q 'errors="[1-9]' build/test-artifacts-tcg/scenarios.xml 2>/dev/null; then
                 echo "::warning::the TCG re-run had setup errors, not only scenario failures (see its scenarios.xml)"
               fi ;;
            5) echo "::notice::pytest recorded no failure at all (the scenarios step failed outside pytest, or was killed): nothing re-run under TCG" ;;
            *) echo "::warning::TCG re-run broke (pytest exit $rc)" ;;
          esac

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-artifacts
          path: |
            build/test-artifacts
            build/test-artifacts-tcg
            build/test-results
          if-no-files-found: ignore
