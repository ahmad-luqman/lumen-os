name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: build, audit, test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install QEMU and xorriso
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 xorriso

      - name: Enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || echo "no KVM; tests fall back to TCG"

      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustc --version

      - uses: astral-sh/setup-uv@v10

      - uses: Swatinem/rust-cache@v2

      - name: Cache boot dependencies (Limine, OVMF)
        uses: actions/cache@v6
        with:
          path: build/deps
          key: deps-${{ hashFiles('tools/fetch-deps.sh') }}

      - run: make deps
      - run: make fmt-check
      - run: make lint
      - run: make build
      - name: Flag audit (no SSE/AVX, no red zone, kernel code model)
        run: make audit
      - run: make test-host
      - name: QEMU scenarios (boot, crash reports, in-kernel tests, golden images)
        run: make test-scenarios
      - name: docs/STATUS.md matches the test results
        run: make status-check

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-artifacts
          path: |
            build/test-artifacts
            build/test-results
          if-no-files-found: ignore
