# Features: smp. See tests/features/README.md for the format.

[[feature]]
name = "Every CPU Limine reports comes online (up to 8, the rest sent to a halt loop), each with its own TSS, per-CPU record and allocated, guarded stacks"
milestone = "M1"
tests = [
    "scenario:test_smp::test_all_cpus_online",
    "scenario:test_smp::test_one_cpu_boots_alone",
    "scenario:test_smp::test_cpus_past_the_limit_are_halted",
    "scenario:test_smp::test_double_fault_on_ap_runs_on_its_own_ist_stack",
    "scenario:test_smp::test_stack_overflow_on_ap_hits_its_own_guard",
    "scenario:test_smp::test_touching_a_guard_page_on_an_ap_names_its_own_stack",
    "ktest:lumen_kernel::arch::x86_64::percpu::the_boot_cpu_is_cpu_0",
]

[[feature]]
name = "A crash on any CPU is reported by that CPU (cpu, stack it runs on) after it stops the other CPUs with an NMI; the shell runs a fault on a chosen CPU"
milestone = "M1"
tests = [
    "scenario:test_smp::test_crash_on_ap_reports_cpu",
    "scenario:test_smp::test_double_fault_on_ap_runs_on_its_own_ist_stack",
    "scenario:test_smp::test_panic_on_ap_is_reported_by_it",
    "scenario:test_smp::test_crash_on_the_boot_cpu_stops_the_others",
    "scenario:test_smp::test_crash_alone_names_no_other_cpus",
    "scenario:test_smp::test_crash_on_a_cpu_that_isnt_online_is_refused",
]

[[feature]]
name = "W^X binds on every CPU (writing kernel text or running data faults on an AP)"
milestone = "M1"
tests = [
    "scenario:test_smp::test_protection_holds_on_aps[*]",
]

[[feature]]
name = "A CPU whose thread blocks after another CPU's crash began (interrupts off for good) but before that report's stop NMI arrived halts for the report, counted as stopped, instead of crashing on the can't-block check (#106): a thread leaving a critical section, and a thread's first run; a thread that blocks holding a lock then still panics"
milestone = "M3"
tests = [
    "scenario:test_smp::test_a_cpu_blocking_once_a_crash_began_halts_for_its_report",
    "scenario:test_smp::test_a_thread_first_run_once_a_crash_began_halts_for_its_report",
    "scenario:test_smp::test_a_thread_holding_a_lock_once_a_crash_began_still_panics",
]

[[feature]]
name = "Cross-CPU ring-3 TLB shootdowns (#390, C11): pinned readers on every CPU observe SIGSEGV with zero stale reads after single-page and >32-page munmap and narrowing mprotect to PROT_NONE, pinned writers observe SIGSEGV with zero stale stores while reads still succeed after narrowing mprotect to PROT_READ, threaded fork write-protect flushes remote writers so children never see post-fork writes, and CoW splits shoot down sibling readers; concurrent two-CPU CoW splits free the shared frame exactly once and count-1 reuse invalidates the local TLB immediately"
milestone = "M8"
tests = [
    "scenario:test_linux_vm::test_cross_cpu_munmap_and_mprotect_shootdown",
    "ktest:lumen_kernel::mm::user_vm::concurrent_cow_split_frees_old_frame_once",
]

[[feature]]
name = "Cross-CPU userspace synchronization stress (#390, C11): threads pinned across every online CPU contend on a musl pthread_mutex counter and hand turns through pthread_cond_broadcast and pthread_cond_signal with exact totals and zero torn updates, with ps confirming contenders block in the kernel before mutex unlock and cond broadcast"
milestone = "M8"
tests = [
    "scenario:test_linux_proc::test_futex_and_pthread_mutex_stress",
]

[[feature]]
name = "Multithreaded ring-3 workload uses every online CPU (#390, C11): one process pins a thread to each online CPU, confirms placement with getcpu without migration, and completes concurrent progress on all CPUs"
milestone = "M8"
tests = [
    "scenario:test_smp::test_multithreaded_workload_uses_all_cpus",
]
