# Features: time. See tests/features/README.md for the format.

[[feature]]
name = "Calibrated TSC (against the HPET, or the PIT without one or with one whose rate says nothing, or with a better bound than one past the TSC's tolerance): each window's ends are reference readings between two TSC reads (the PIT's counter read at both); a window with a paused reading is taken again after a wait of two windows' TSC ticks, and an HPET window slow to read (each poll slow, not one burst at either end) is taken again longer (up to 16 windows' worth) until the same gaps would be steady; short of steady windows after 20, the ones with the smallest bounds fill in; the shell's clocks lists the windows; the local APIC timer calibrated against the TSC the same way (the timer started, and its count read, each between two TSC reads; retakes 20 ms apart); each boot calibration judged by how far off its median can be (for the TSC, each window's end gap over the rest of it plus a reference tick; for the timer, its gaps' share plus the TSC's bound) against its clock's tolerance (the TSC 1%, the timer 2%): within it at most an INFO line, past it a warning saying how far off, with no bound left a panic (the HPET first giving way to the PIT); a timer past its tolerance only through the TSC's error says so; stalls injected at boot (`lumen.stall_tsc_windows`, `lumen.stall_timer_windows`, said at INFO; over 10 windows' worth warned about and ignored) reach the fill-in, the HPET-or-PIT choice, the warning and the panic in a real boot; the shell's clocks shows each measurement's bound; now_ns and sleep"
milestone = "M1"
tests = [
    "cargo:lumen-time",
    "ktest:lumen_kernel::time::tsc_calibrated_within_tolerance",
    "ktest:lumen_kernel::time::a_cross_check_measures_again_until_it_can_judge",
    "ktest:lumen_kernel::time::a_late_look_at_the_pit_doesnt_stretch_its_window",
    "ktest:lumen_kernel::time::a_late_start_reading_doesnt_shift_a_pit_window",
    "ktest:lumen_kernel::time::a_paused_pit_reading_is_not_steady",
    "ktest:lumen_kernel::time::reading_the_latched_pit_count_is_outside_the_window",
    "ktest:lumen_kernel::time::a_pit_start_read_after_it_ran_out_is_not_steady",
    "ktest:lumen_kernel::time::a_tsc_calibration_short_of_steady_windows_fills_in",
    "ktest:lumen_kernel::time::a_tsc_calibration_waits_between_retakes",
    "ktest:lumen_kernel::time::tsc_spares_are_ranked_by_the_tsc_bound",
    "ktest:lumen_kernel::time::an_hpet_slow_to_read_stretches_its_windows",
    "ktest:lumen_kernel::time::an_unplaceable_window_filling_in_doesnt_fail_the_calibration",
    "ktest:lumen_kernel::time::a_pit_end_read_after_it_could_wrap_is_not_steady",
    "ktest:lumen_kernel::time::a_paused_pit_reading_is_taken_again",
    "ktest:lumen_kernel::time::a_paused_hpet_reading_is_not_steady",
    "ktest:lumen_kernel::time::a_paused_timer_reading_is_not_steady",
    "ktest:lumen_kernel::time::a_timer_calibration_waits_between_retakes",
    "ktest:lumen_kernel::time::a_timer_calibration_short_of_steady_windows_fills_in",
    "ktest:lumen_kernel::time::a_calibration_report_fits_each_outcome",
    "ktest:lumen_kernel::time::the_stalled_boots_seen_on_kvm_report_quietly",
    "ktest:lumen_kernel::time::the_steadier_tsc_calibration_is_kept",
    "ktest:lumen_kernel::time::the_boot_timer_calibration_is_the_timers_rate",
    "ktest:lumen_kernel::time::the_boot_tsc_calibration_is_now_ns_s_rate",
    "ktest:lumen_kernel::time::sleep_10ms_elapses",
    "ktest:lumen_kernel::time::now_ns_follows_the_hpet",
    "ktest:lumen_kernel::time::a_bad_hpet_address_is_an_error",
    "scenario:test_time::test_boot_calibrates_the_tsc_against_the_hpet",
    "scenario:test_time::test_boot_calibration_agrees_with_both_clocks",
    "scenario:test_time::test_clocks_shows_the_windows_behind_each_measurement",
    "scenario:test_acpi::test_no_hpet_is_a_warning",
    "scenario:test_acpi::test_no_madt_boots_without_acpi",
    "scenario:test_time::test_tsc_windows_stalled_past_steady_fill_in",
    "scenario:test_time::test_tsc_windows_stalled_past_tolerance_warn",
    "scenario:test_time::test_tsc_windows_with_no_bound_left_panic",
    "scenario:test_time::test_tsc_windows_stalled_without_an_hpet_fill_in_against_the_pit",
    "scenario:test_time::test_timer_windows_stalled_past_steady_fill_in",
    "scenario:test_time::test_timer_windows_stalled_past_tolerance_warn",
    "scenario:test_time::test_timer_windows_with_no_bound_left_panic",
    "scenario:test_time::test_a_stall_past_ten_windows_is_ignored",
    "scenario:test_time::test_a_timer_off_through_the_tsc_says_so",
    "harness:test_calibration::*",
    "scenario:test_ktest::test_in_kernel_tests_pass",
    "scenario:test_ktest::test_in_kernel_tests_pass_with_calibrations_stalled_within_tolerance[*]",
]

[[feature]]
name = "now_ns checked against the HPET with each HPET reading between two now_ns reads, placed at their midpoint: a reading over 1 ms wide is read again 20 ms later (a burst of stalls is sampled around), one stalled reading at each end still passes, and every reading at one end wide fails; the brackets and retries are reported on every run (the retries matching the readings, only readings over the limit taken again, the kept ones within it), and the timer check measures the timer's input rate over one-shot windows (no reloads to miss, the divider and registers checked as the periodic setup left them) whose ends are timer readings between two HPET reads, placed at their midpoint, with the widths reported"
milestone = "M3"
tests = [
    "cargo:lumen-time",
    "ktest:lumen_kernel::time::now_ns_follows_the_hpet",
    "ktest:lumen_kernel::time::an_hpet_reading_is_placed_at_its_brackets_midpoint",
    "ktest:lumen_kernel::time::a_placement_is_judged_only_on_a_try_that_can_tell",
    "ktest:lumen_kernel::time::a_stalled_hpet_bracket_is_read_again",
    "ktest:lumen_kernel::time::every_stalled_hpet_bracket_is_a_failure",
    "ktest:lumen_kernel::time::a_burst_of_stalls_is_sampled_around",
    "ktest:lumen_kernel::time::one_stalled_reading_at_each_end_still_passes",
    "ktest:lumen_kernel::time::the_timer_is_programmed_for_1_khz",
    "ktest:lumen_kernel::time::a_timer_reading_is_placed_at_its_brackets_midpoint",
    "scenario:test_ktest::test_in_kernel_tests_pass",
    "harness:test_clock_diags::*",
]

