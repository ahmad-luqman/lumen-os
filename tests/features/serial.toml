# Features: serial. See tests/features/README.md for the format.

[[feature]]
name = "Serial output in 15-byte FIFO bursts through the logger's path (one wait for an empty transmit FIFO per burst, newlines as CR LF), byte by byte for the crash reporter's writer; a burst and a lock-free byte after the same check fit the FIFO (model)"
milestone = "M2"
tests = [
    "ktest:lumen_kernel::arch::x86_64::serial::fifo_burst_round_trip",
    "ktest:lumen_kernel::arch::x86_64::serial::leaving_loopback_restores_the_modem_control",
    "cargo:lumen-uart",
]

[[feature]]
name = "Serial port presence probe (scratch or interrupt enable register): no UART means no serial writes or reads, boot goes on and warns on the screen"
milestone = "M2"
tests = [
    "ktest:lumen_kernel::arch::x86_64::serial::presence_detected",
    "ktest:lumen_kernel::arch::x86_64::serial::absent_uart_is_not_detected",
    "ktest:lumen_kernel::arch::x86_64::serial::an_absent_uart_is_neither_written_nor_read",
    "cargo:lumen-uart",
    "scenario:test_serial::test_boots_without_a_uart_and_warns_on_screen_golden",
    "harness:test_qemu::test_machine_without_serial_has_no_serial_port",
]

[[feature]]
name = "Serial input by interrupt (ISA IRQ 4): the UART interrupts when received bytes wait (OUT2 set, the FIFO's trigger level 14 kept, FCR 0xc7: model), the handler moves what the queue has room for and leaves the rest in the UART, and the reader takes the queue then the UART and waits only while neither holds a byte, so bytes a full queue left behind are still read, in order, with no new edge (a model of the worst case, an interrupt that comes only on an edge; either half alone stalls it); the serial shell blocks for a key instead of polling, so the CPU halts while it waits (the idle thread takes 50+ of a second's ticks and more than `main`), and lines typed while it waits wake it by interrupt (`serial`: at least one wait woken by the handler, every counted wait's input brought by an interrupt, none found input at the 100 ms deadline; GSI 4 unmasked and counting up; a line that arrives before the shell blocks again is read without a counted wait); how a wait ended (woken, readied by the deadline just before a late interrupt, input found at the deadline, idle) and when it waits one more period (input in the UART alone at the deadline) are tables tested on the host; with COM1 moved to IRQ 3 the deadline answers every line, GSI 4 stays at 0, one warning (once) says to check IRQ 4's routing, there exactly when `serial`'s count of waits that found input at the deadline has reached 3, and the CPU still idles; how the shell waits (block with the deadline, for good without a UART, or yield where it can't block or has no interrupt) and when it warns (three in a row, reset by an interrupt that brought input, once) are tables tested on the host; a route reports a level-triggered input (ktest on IRQ 9), which serial_in refuses (not tested). Not tested: the polling fallback, blocking for good without a UART, and the queuing of bytes that came before the unmask"
milestone = "M3"
tests = [
    "cargo:lumen-uart",
    "scenario:test_serial::test_the_serial_shell_waits_for_input_by_interrupt",
    "scenario:test_serial::test_the_safety_net_reads_input_when_irq_4_never_comes",
    "harness:test_qemu::test_com1_can_move_to_another_irq",
    "ktest:lumen_kernel::interrupts::routing_takes_the_madt_override_and_refuses_twice",
]

[[feature]]
name = "A serial command's output as the scenarios read it (`lumen_harness.shell.run`): the log's lines (`[seconds.micros] LEVEL tag: message`, `lumen_harness.klog`) taken out and kept wherever one lands, from the prompt before the echo on; checked against the kernel inside the typed line's echo, between two output writes and after the output before the prompt (debug lines made to land there), on handcrafted text for all three positions and between the prompt and the echo, and on #124's recorded output for the position after the output; a WARN or ERROR among them fails the run unless allowed (host-tested); `dmesg`'s read with its live lines dropped and checked (#124)"
milestone = "M3"
tests = [
    "harness:test_shell_run::*",
    "scenario:test_shell::test_a_log_line_inside_a_commands_echo_is_not_output",
    "scenario:test_shell::test_a_log_line_between_output_writes_is_not_output",
    "scenario:test_shell::test_a_log_line_after_the_output_before_the_prompt_is_not_output",
]
