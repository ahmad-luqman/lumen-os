# Features: serial. See tests/features/README.md for the format.

[[feature]]
name = "Serial output in 15-byte FIFO bursts through the logger's path (one wait for an empty transmit FIFO per burst, newlines as CR LF), byte by byte for the crash reporter's writer; a burst and a lock-free byte after the same check fit the FIFO (model)"
milestone = "M2"
tests = [
    "ktest:lumen_kernel::arch::x86_64::serial::fifo_burst_round_trip",
    "ktest:lumen_kernel::arch::x86_64::serial::leaving_loopback_restores_the_modem_control",
    "cargo:lumen-uart",
]

[[feature]]
name = "Serial port presence probe (scratch or interrupt enable register): no UART means no serial writes or reads, boot goes on and warns on the screen"
milestone = "M2"
tests = [
    "ktest:lumen_kernel::arch::x86_64::serial::presence_detected",
    "ktest:lumen_kernel::arch::x86_64::serial::absent_uart_is_not_detected",
    "ktest:lumen_kernel::arch::x86_64::serial::an_absent_uart_is_neither_written_nor_read",
    "cargo:lumen-uart",
    "scenario:test_serial::test_boots_without_a_uart_and_warns_on_screen_golden",
    "harness:test_qemu::test_machine_without_serial_has_no_serial_port",
]

[[feature]]
name = "Serial input by interrupt (ISA IRQ 4): the UART interrupts when received bytes wait (OUT2 set, the FIFO's trigger level 14 kept, FCR 0xc7: model), the handler moves what the queue has room for and leaves the rest in the UART, and the reader takes the queue then the UART and waits only while neither holds a byte, so bytes a full queue left behind are still read, in order, with no new edge (model whose handler runs only on an edge; either half alone stalls it); the serial shell blocks for a key instead of polling, so the CPU halts while it waits (the idle thread takes 50+ of a second's ticks and more than `main`), and lines typed while it waits come by interrupt (GSI 4 unmasked and counting up); a level-triggered route is refused (the route reports it: ktest on IRQ 9). Not tested: the 100 ms safety-net deadline and its warning, the polling fallback, blocking for good without a UART, and the drain of bytes that came before the unmask"
milestone = "M3"
tests = [
    "cargo:lumen-uart",
    "scenario:test_serial::test_the_serial_shell_waits_for_input_by_interrupt",
    "ktest:lumen_kernel::interrupts::routing_takes_the_madt_override_and_refuses_twice",
]
