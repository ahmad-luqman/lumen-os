# Features: gui (the M4 desktop). See tests/features/README.md for the format.

[[feature]]
name = "Pixel core (lumen-gfx): rectangles with a signed origin (intersect, union, contains, clip, subtract into at most 4), a fixed-size damage list that coalesces and never loses coverage (randomized check), xRGB8888 surfaces with a stride (fill, blits clipped at every edge, presenting spans to a target), coverage-mask blending rounded to the nearest (checked for every input) and clipped to a damaged rectangle (redraw equals one full draw)"
milestone = "M4"
tests = ["cargo:lumen-gfx"]

[[feature]]
name = "screenshot: the screen as a PNG over serial (lumen-png: RGB8, zlib from miniz_oxide linked with audit passing, the rows' buffer and the file's first buffer and growth refused rather than aborted when the allocator says no (the compressor's own fixed boxes excepted), the file's end always fitting in the room kept back, a golden file PIL decodes; a base64 frame with its size, length, CRC and line count, log lines skipped by prefix), equal to QEMU's screendump in every pixel (the text console after boot and the colour test pattern); a capture while a command holds the screen (a canvas) is flagged as possibly torn and refused by the harness unless allowed; encoding works from a thread with the default stack (on a bigger stack of its own); every way a frame comes back wrong fails the harness saying why; refused on a screen shell"
milestone = "M4"
tests = [
    "cargo:lumen-png",
    "harness:test_screenshot::*",
    "scenario:test_gui::test_screenshot_matches_screendump",
    "scenario:test_gui::test_screenshot_refuses_a_screen_shell",
    "scenario:test_gui::test_screenshot_says_when_a_canvas_was_drawing",
    "ktest:lumen_kernel::screenshot::encodes_from_a_thread_with_the_default_stack",
    "audit:flags",
]

[[feature]]
name = "Anti-aliased TrueType text (lumen-font, #148): fontdue 0.9.5 without `simd`, linked into both kernels with the flag audit passing; the embedded UI font (Atkinson Hyperlegible, SIL OFL) parses, its bytes unchanged (FNV-1a pinned); one parsed face shared, read-only, with a glyph cache per user; glyphs cached by (glyph, pixel size) within a byte bound (coverage plus a fixed charge per glyph), the least recently used evicted first, agreeing with a model LRU on random lookups; a cache hit never rasterizes (a second render of a line rasterizes nothing), and a glyph bigger than the whole bound is drawn without being cached; a glyph number past the face's end is its missing-glyph box, never a panic; characters the face lacks draw that box and are counted; one-line layout on whole pixels (pen in 64ths, nearest pixel), with kerning from a `kern` table moving only the adjacent pair (checked on a fixture: the embedded font kerns only in GPOS, which fontdue doesn't read, so its own text is unkerned); `measure` (advance width, ascent, descent) agreeing with the layout and rasterizing nothing; a line composited into one mask allocated once from the metrics (each pixel the highest coverage of any glyph; negative x and overlapping glyphs included), refused past a width limit (ink left of the line's start included) with the width it would have had; the sample's mask matches a checked-in golden on the host, and in the booted and ktest kernels its 64-bit hash equals the golden's"
milestone = "M4"
tests = [
    "cargo:lumen-font",
    "audit:flags",
    "ktest:lumen_kernel::font::renders_and_caches",
    "scenario:test_font::test_font_command_renders_the_golden_and_caches",
]

[[feature]]
name = "`font` renders the desktop font's sample twice in the booted kernel: the face's name and glyph count, how long parsing took on first use (the face parsed once and shared after), how long each render took, the glyphs rasterized the first time and none the second, the cache's counters and bytes, and the mask's hash, the host's golden; a later use parses nothing; a mask that isn't the golden and a second render that differs each fail with their own line (both when both)"
milestone = "M4"
tests = [
    "scenario:test_font::test_font_command_renders_the_golden_and_caches",
    "ktest:lumen_kernel::font::renders_and_caches",
    "ktest:lumen_kernel::font::font_reports_each_failure",
]

[[feature]]
name = "Window-manager logic (lumen-wm): frame geometry hit at every edge (title bar, close box, client, borders); a click focuses and raises, closing the focused window focuses the one in front, exactly one focused (the front one) unless none, ids naming open windows only; a left drag from a title bar follows the pointer clamped to keep a strip of the title bar on the screen (opening too, by the whole width), ends at the left release even with another button held (then ignored until up), off the screen or when its window closes; a press starting on the desktop does nothing, one on a border focuses and raises and nothing more, until released; the implicit grab sends a client press (any button) and its moves, other buttons and releases to that window in client coordinates, out of it too, until its last button is up, it loses the focus or input is interrupted; the close box clicks on a left release over it; repainting only the reported damage equals repainting everything, focus included (randomized, with clicks, drags and first presses checked as they happen); press, pause, resume, release (and with a gap or an event after an overrun): the interruption releases the owner's buttons and no window is left holding one; a key gap tells the focused window and ends a grab but not a drag; the first click after a resume or a gap is a click, buttons held at the resume or pressed in an event after an overrun are ignored until up (counted), focus changes while paused wait for the resume; a window's event queue of key, pointer and request entries keeps Lost, focus changes and Close as flags (never dropped, never pushable, delivered in place, a focus loss never folded into a gain), drops presses and moves and refuses requests past 48 of 64, queues a release only after its press, sets Lost for one that doesn't fit, and counts unpaired releases apart (keys; buttons forgotten vs never pressed); deliver routes each delivery to it exactly; the light and dark palettes complete and readable"
milestone = "M4"
tests = ["cargo:lumen-wm"]

[[feature]]
name = "Desktop mode and the compositor (#153): opt-in (`desktop`, tested from the serial shell; the `lumen.desktop` boot flag; `make run DESKTOP=1` passes that flag, by design, not tested; the text console stays the default), refused while a command draws on a canvas (the start undone after its compositor thread began) and keeping commands' canvases out while shown; with no screen the boot flag warns once and the boot goes on; windows open only once the start completed, so window ids are never reused in a boot (a failed start opens none), and a first start never replaces a desktop already there; two demo windows with frames (title bar, border, close box) drawn by the compositor, the front one focused; a click focuses and raises, a title-bar drag moves the frame by exactly the drag and repaints the old place, the close box closes a window and focuses the next; a button held when the desktop first starts is ignored until every button is up, as at a resume; only the damaged rectangles are recomposed and presented (one key typed: the rectangles presented add under a tenth of the screen's pixels), and after a frame edge through another window's title (titles drawn clipped to each damaged rectangle), a drag, a raise, a focus change and a close the back buffer equals a full repaint and the screen the back buffer outside the pointer's box (`desktop check`); the pointer drawn straight onto the screen and taken off its old place; keys go to the focused window and never reach a terminal while the desktop is shown (on two CPUs too), keys typed just before Alt+F1 still reach the window, Alt+F1 leaves it (keys then reach the terminal, never a window) and `desktop` resumes it; `settled` is no while a key isn't acted on or a window never idles, and needs each of its conditions; a window whose owner stops reading drops events past its queue's ration, counted in `windows`' `lost` with one warning per burst, and reads them again once released; a delivery for a closed window counts as a dead push; `desktop check` and `screenshot` share one request slot held until the asker takes its answer (a second request meanwhile refused), and a `desktop check` queued as the desktop pauses is answered `paused` at once (a request given up on while it runs makes later ones fail as stuck); at most 32 windows (a 33rd refused, room again after a close); `windows` and `desktop status` as records (`windows | where focused = yes`)"
milestone = "M4"
tests = [
    "cargo:lumen-gfx",
    "cargo:lumen-wm",
    "cargo:lumen-input",
    "scenario:test_gui::test_two_windows_golden",
    "scenario:test_gui::test_drag_moves_window",
    "scenario:test_gui::test_click_focuses_and_raises",
    "scenario:test_gui::test_a_button_held_at_the_start_is_ignored",
    "scenario:test_gui::test_leaving_and_resuming_the_desktop",
    "scenario:test_gui::test_keys_just_before_alt_f_reach_the_window",
    "scenario:test_gui::test_a_check_queued_as_the_desktop_pauses_is_answered_paused",
    "scenario:test_gui::test_presents_match_a_full_repaint",
    "scenario:test_gui::test_a_window_behind_drops_and_says_busy",
    "scenario:test_gui::test_pointer_moves_over_the_desktop",
    "scenario:test_gui::test_desktop_and_canvas_exclude_each_other",
    "scenario:test_gui::test_boot_flag_starts_the_desktop",
    "scenario:test_gui::test_boot_flag_without_a_screen_warns",
    "ktest:lumen_kernel::desktop::opening_past_the_window_limit_fails",
    "ktest:lumen_kernel::desktop::a_window_opens_only_once_the_start_completed",
    "ktest:lumen_kernel::desktop::a_first_start_over_a_live_desktop_is_refused",
    "ktest:lumen_kernel::desktop::settled_needs_every_one_of_its_conditions",
    "ktest:lumen_kernel::desktop::a_closed_window_s_deliveries_count_as_dead_pushes",
    "ktest:lumen_kernel::desktop::a_button_held_at_the_first_entry_is_ignored_until_released",
    "ktest:lumen_kernel::desktop::a_request_holds_the_slot_until_its_asker_takes_the_answer",
    "ktest:lumen_kernel::desktop::a_second_request_is_refused_while_the_first_waits",
    "ktest:lumen_kernel::desktop::a_request_queued_when_the_desktop_pauses_is_answered_paused",
    "ktest:lumen_kernel::vt::keys_while_the_desktop_is_shown_are_its_own_until_alt_f_leaves_it",
    "ktest:lumen_kernel::shell::sysinfo::every_record_table_fits_its_columns",
]

[[feature]]
name = "The crash screen over the desktop (#153): a deliberate fault from the serial shell while the desktop presents (two CPUs, a window committing every 20 ms whose green is on the screen just before) gives the full symbolized report and the crash code, and the crash screen covers the desktop (its banner, none of the spinner's green left); the compositor stops presenting first: a present stops at the next row once its canvas dies (the real span path, the epoch changed after 3 rows, every later row unchanged)"
milestone = "M4"
tests = [
    "scenario:test_crash::test_crash_report_over_desktop",
    "ktest:lumen_kernel::desktop::a_present_stops_at_the_next_row_once_the_canvas_dies",
]

[[feature]]
name = "`screenshot` while the desktop is shown reads its back buffer (the compositor copies it between passes), so the pointer is never in it: with the pointer over the desktop it equals QEMU's screendump outside the arrow's box and differs inside it; a screenshot queued as the desktop pauses reads the text screen instead"
milestone = "M4"
tests = [
    "scenario:test_gui::test_desktop_screenshot_matches_screendump",
    "scenario:test_gui::test_a_screenshot_queued_as_the_desktop_pauses_reads_the_text_screen",
    "ktest:lumen_kernel::desktop::a_request_queued_when_the_desktop_pauses_is_answered_paused",
]

[[feature]]
name = "Terminal windows (#155): `terminal` opens the M2 terminal and a shell of its own in a desktop window, several at once; keys typed go to the focused one only (its view read by `term text <window>`, the others unchanged), a click focusing either; a command that draws on the screen is refused there with one line; an unfocused window's cursor is hollow and steady; the close box ends its owner and its shell (joined: both gone from `threads`) and its heap comes back (within 16 KiB, against the window's more than 1 MiB); damage-only drawing still equals a full repaint after; the text console renders exactly as before (its goldens unchanged), through the renderer the windows share: only the cells that changed drawn, a scroll moving what was drawn, the cursor solid or hollow and never while scrolled back, drawing in steps equal to a full repaint (randomized); a window's cells pixel for pixel as the console's; its owner's wait ends at a deadline (the blink) or when its shell's output wakes it, idle meanwhile"
milestone = "M4"
tests = [
    "scenario:test_gui::test_terminal_window_runs_shell",
    "scenario:test_gui::test_closing_a_terminal_window_frees_it",
    "scenario:test_term::test_ansi_colours_golden",
    "scenario:test_term::test_scrollback",
    "scenario:test_term::test_virtual_terminals_are_independent",
    "cargo:lumen-term",
    "cargo:lumen-gfx",
    "ktest:lumen_kernel::termwin::a_window_shell_runs_a_line_and_ends_when_closed",
    "ktest:lumen_kernel::termwin::a_terminal_window_s_cells_look_as_the_console_s",
    "ktest:lumen_kernel::desktop::wait_event_until_ends_at_its_deadline_or_a_wake",
    "ktest:lumen_kernel::term::a_terminal_window_s_commands_get_no_canvas",
]
