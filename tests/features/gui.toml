name = "Terminal windows (#155): `terminal` opens the M2 terminal and a shell of its own in a desktop window, several at once (refused while the desktop isn't shown); keys typed go to the focused one only (its view read by `term text <window>` and drawn there, the others unchanged), a click focusing either; more lines than its rows scroll it (its pixels as a full repaint's); a command that draws on the screen is refused there with one line, also at the head of a pipeline; the focused window's cursor blinks, an unfocused one's is hollow and steady; `settled`: an unfocused window idle settles (nothing presented for over a second), a focused one or one running `top` never does (an animating wait never idles; a window busy while its shell runs a command; a wake not yet taken); the close box ends its owner and its shell (joined: both gone from `threads`), also with `rhai`'s REPL waiting in it, `top` running or a script in a loop (a closed console's `Key::Closed`, which every key reader stops on: `Key::interrupts`), and four windows opened and closed bring the heap back within 2 KiB, each having held more than 1 MiB; keys past its queue's room are dropped and counted (the first drop warned about once, the count in the close's log line); a request reaching its owner is answered "no node"; `screenshot` typed in it is refused; a theme switch leaves its cells in the console's colours and its shell answering; damage-only drawing still equals a full repaint after; the text console renders exactly as before (its goldens unchanged, its scrolled pixels as a full redraw's), through the renderer the windows share: only the cells that changed drawn, a scroll moving what was drawn, the cursor solid or hollow and never while scrolled back, drawing in steps equal to a full repaint (randomized); a window's cells pixel for pixel as the console's; its owner's wait ends at a deadline (the blink) or when its shell's output wakes it"
