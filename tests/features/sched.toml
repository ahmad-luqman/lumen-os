# Features: sched. See tests/features/README.md for the format.

[[feature]]
name = "Kernel threads preempted round robin by the timer, in 10-tick slices"
milestone = "M2"
tests = [
    "ktest:lumen_kernel::sched::two_threads_interleave",
    "ktest:lumen_kernel::sched::slices_are_10_ticks",
]

[[feature]]
name = "Each thread keeps its own interrupt state across a switch"
milestone = "M2"
tests = [
    "ktest:lumen_kernel::sched::yielding_with_interrupts_off_keeps_them_off",
]

[[feature]]
name = "Each thread has its own stack with a guard page"
milestone = "M2"
tests = [
    "scenario:test_crash::test_thread_stack_overflow_hits_its_guard",
]

[[feature]]
name = "A scheduler on every online CPU, each AP's timer at the boot CPU's 1 kHz count: threads spawned on a CPU run there, preempted, and only there"
milestone = "M2"
tests = [
    "ktest:lumen_kernel::sched::threads_run_on_every_cpu",
    "ktest:lumen_kernel::sched::ap_timers_are_programmed_for_1_khz",
    "ktest:lumen_kernel::sched::spawning_where_no_scheduler_runs_is_refused",
    "scenario:test_smp::test_all_cpus_online",
]

[[feature]]
name = "sleep blocks the thread until its deadline; where a thread can't block (a lock held, interrupts off, an idle thread) time::sleep busy-waits"
milestone = "M2"
tests = [
    "ktest:lumen_kernel::sched::sleeping_thread_wakes",
    "ktest:lumen_kernel::sched::time_sleep_spins_where_a_thread_cannot_block",
    "ktest:lumen_kernel::time::sleep_10ms_elapses",
]

[[feature]]
name = "Wait queues: a blocked thread wakes when its condition holds, on its own CPU or from another (the wakeup IPI), with no lost wakeup; wake_one in FIFO order, wake_all wakes every waiter"
milestone = "M2"
tests = [
    "ktest:lumen_kernel::sched::wait_queue_wakes_a_blocked_thread",
    "ktest:lumen_kernel::sched::wait_queue_ping_pong_across_cpus_loses_no_wakeup",
    "ktest:lumen_kernel::sched::wake_one_is_fifo_and_wake_all_wakes_every_waiter",
    "ktest:lumen_kernel::sched::a_remote_wake_sends_its_cpu_the_wakeup_ipi",
]

[[feature]]
name = "join returns only after the thread has finished and its CPU is done with it (its stack and joiners' list freed, its reference dropped): nothing that CPU frees for it lands after join returns"
milestone = "M2"
tests = [
    "ktest:lumen_kernel::sched::join_blocks_until_the_thread_is_reaped",
    "ktest:lumen_kernel::sched::a_joined_thread_is_released_before_join_returns",
    "ktest:lumen_kernel::sched::a_dead_threads_stack_is_freed",
    "ktest:lumen_kernel::sched::a_thread_dying_into_a_fresh_one_is_reaped",
]

[[feature]]
name = "The timer interrupt never allocates: every thread homed on a CPU has room in its queues"
milestone = "M2"
tests = [
    "ktest:lumen_kernel::sched::every_homed_thread_has_room_in_its_queues",
]

[[feature]]
name = "Thread switches are traced"
milestone = "M2"
tests = [
    "ktest:lumen_kernel::sched::switches_are_traced",
    "ktest:lumen_kernel::sched::every_state_round_trips",
]

[[feature]]
name = "The crash report names the running thread, and a thread's backtrace ends at its start"
milestone = "M2"
tests = [
    "scenario:test_crash::test_report_names_the_thread",
    "scenario:test_crash::test_fault_produces_symbolized_report[*]",
    "scenario:test_smp::test_crash_on_ap_reports_cpu",
]

[[feature]]
name = "A wait on a queue with a deadline (`WaitQueue::wait_until_or_deadline`): false at the deadline when nothing makes it ready (not before it), true when a waker on another CPU wakes it first; a waker and the deadline racing (200 rounds, started 0 to 0.8 ms after a tick so the deadline falls at five points between ticks, against five waker delays): no panic, early return, lost thread or entry left on the queue or the CPU's sleepers, each side winning sometimes (the waker's mark sometimes before the deadline), each queue deadline on the waiting CPU firing at the first tick after it (not earlier, not later), and the thread blocking again at once on another queue until its own deadline; a plain wait woken by a stale wake blocks again on its queue once, not twice; `wake_one` passes over a thread that isn't blocked and wakes the one behind it"
milestone = "M3"
tests = [
    "ktest:lumen_kernel::sched::a_wait_with_a_deadline_ends_at_it_or_when_woken",
    "ktest:lumen_kernel::sched::a_stale_wake_leaves_a_plain_wait_on_its_queue_once",
    "ktest:lumen_kernel::sched::wake_one_skips_a_thread_that_isnt_blocked",
    "scenario:test_ktest::test_in_kernel_tests_pass",
]

[[feature]]
name = "Queue waits on one CPU whose deadlines pass on the same tick all fire on that tick: none a tick late, none before its deadline, each wait returning false no earlier than it and ended by its deadline once (a waiter blocked again by an early firing would count more)"
milestone = "M3"
tests = [
    "ktest:lumen_kernel::sched::queue_deadlines_due_on_one_tick_all_fire_on_it",
    "scenario:test_ktest::test_in_kernel_tests_pass",
]

[[feature]]
name = "A wait where the thread can't block panics with a crash report: `wait_until` with a lock held, `wait_until_or_deadline` with interrupts off, `wait_until` after its own CPU turned interrupts off for good (alone, or after another CPU did too)"
milestone = "M3"
tests = [
    "scenario:test_crash::test_blocking_where_a_thread_cant_panics[*]",
    "scenario:test_smp::test_a_cpu_that_turned_interrupts_off_itself_still_panics_when_it_blocks",
]

[[feature]]
name = "A queue wait the timer ends at its deadline is counted for its thread (`sched::deadline_wakes_in`, the ktests' proof that a wake, not the deadline, ended a wait that returned ready): a lost wake (the condition made true with no wake) returns ready at the deadline and counts one; a sleep counts none"
milestone = "M4"
tests = [
    "ktest:lumen_kernel::sched::a_lost_wake_is_ended_by_the_timer_and_counted",
    "scenario:test_ktest::test_in_kernel_tests_pass",
]
