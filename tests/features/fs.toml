# Features: storage, writable ext4, and POSIX VFS (M7+). See tests/features/README.md for the format.

[[feature]]
name = "ext4plus 0.1.0-rc.2 (MIT elected, sync + multi-threaded) pinned and linked into both kernels (#248) with the flag audit passing and in-memory ext4 read/write/truncate/symlink/hardlink/mkdir/rmdir/unlink smoke check"
milestone = "M7"
tests = [
    "ktest:lumen_kernel::vfs::tests::ext4_crate_smoke",
    "audit:flags",
]

[[feature]]
name = "POSIX VFS core traits, path/symlink resolver, mount table, caches, 1024-FD table, and advisory locks"
milestone = "M7"
tests = [
    "cargo:lumen-vfs",
]

[[feature]]
name = "Unified 4 KiB frame-backed PageCache with write-back, soft 32 MiB reclaim and a 64 MiB hard cap for ext4, quota accounting, and truncate tail zeroing"
milestone = "M7"
tests = [
    "ktest:lumen_kernel::vfs::tests::ext4_adapter_pagecache_quirks_and_open_unlinked",
    "ktest:lumen_kernel::vfs::tests::page_cache_global_reclaim_writes_back_and_evicts",
    "ktest:lumen_kernel::vfs::page_cache::*",
    "ktest:lumen_kernel::vfs::tests::ext4_flush_and_reclaim_preserve_dirty_on_io_error",
    "ktest:lumen_kernel::vfs::tests::ext4_truncate_and_open_unlink_preserve_state_on_io_error",
    "ktest:lumen_kernel::vfs::tests::ext4_partial_phase2_io_error_recovery",
    "ktest:lumen_kernel::vfs::tests::tmpfs_truncate_returns_quota",
    "scenario:test_fs::test_ext4_read_write_persists_across_reboot",
]

[[feature]]
name = "Writable ext4 rootfs VFS adapter over BlockCache with Gate 6 open-unlinked detach, symlinks, rmdir/rename, write-error undo, and reboot persistence"
milestone = "M7"
tests = [
    "ktest:lumen_kernel::vfs::tests::ext4_adapter_pagecache_quirks_and_open_unlinked",
    "ktest:lumen_kernel::vfs::tests::ext4_flush_and_reclaim_preserve_dirty_on_io_error",
    "ktest:lumen_kernel::vfs::tests::ext4_truncate_and_open_unlink_preserve_state_on_io_error",
    "ktest:lumen_kernel::vfs::tests::ext4_partial_phase2_io_error_recovery",
    "ktest:lumen_kernel::vfs::ext4::*",
    "scenario:test_fs::test_ext4_read_write_persists_across_reboot",
    "scenario:test_fs::test_ext4_deletions_and_renames_fsck_clean",
    "scenario:test_fs::test_ext4_readonly_device_mounts_ro",
]

[[feature]]
name = "open_inode_guarded + OpenFile::from_opened against an unlink placed at each step of the reference check (host model) and after the open (ext4, tmpfs): the data stays readable, the open fails with ENOENT, or O_CREAT opens a new file; never a descriptor on a freed inode (#262)"
milestone = "M7"
tests = [
    "cargo:lumen-vfs",
    "ktest:lumen_kernel::vfs::ext4::ext4_open_racing_unlink_keeps_the_data_or_fails_cleanly",
    "ktest:lumen_kernel::vfs::tmpfs::tmpfs_open_racing_unlink_keeps_the_data_or_fails_cleanly",
]

[[feature]]
name = "Pseudo-filesystems (/tmp tmpfs, /dev devfs, /proc procfs), boot mount with a tmpfs fallback (quiet for a disk without ext4, a warning for an ext4 disk that won't mount), and mount/sync shell commands"
milestone = "M7"
tests = [
    "ktest:lumen_kernel::vfs::tests::vfs_boot_mounts_tmp_dev_proc_work",
    "ktest:lumen_kernel::vfs::tests::vfs_tmpfs_quota_rmdir_maps_heap_and_procfs_parsing",
    "ktest:lumen_kernel::vfs::tests::vfs_proc_checks_unregister_their_process_on_failure",
    "ktest:lumen_kernel::vfs::tests::vfs_read_all_refuses_a_file_past_its_cap",
    "ktest:lumen_kernel::vfs::tests::vfs_sync_continues_past_a_failing_inode",
    "ktest:lumen_kernel::vfs::procfs::procfs_root_listing_keeps_its_inodes_and_agrees_with_lookup",
    "cargo:lumen-vm",
    "cargo:lumen-vfs",
    "scenario:test_fs::test_dev_tmp_proc_filesystems",
    "scenario:test_fs::test_dev_urandom_refuses_when_unseeded",
    "scenario:test_fs::test_unmountable_ext4_disk_warns_and_falls_back",
    "scenario:test_fs::test_ext4_read_write_persists_across_reboot",
    "scenario:test_fs::test_ext4_readonly_device_mounts_ro",
    "scenario:test_blk::test_read_write_sectors",
]

[[feature]]
name = "procfs's per-process nodes (/proc/<pid> and everything under it, /proc/self) are never cached: /proc/<pid> is ENOENT once its process ends, /proc/<pid>/fd/N once its fd closes, and the dentry and inode caches stay flat over many short processes"
milestone = "M7"
tests = [
    "ktest:lumen_kernel::vfs::procfs::procfs_per_process_nodes_are_never_cached",
    "cargo:lumen-vfs",
]

[[feature]]
name = "Page-cache pages for mmap (#255): vfs::mmap_page hands out an ext4 or tmpfs file's own cached page (read from disk, a hole in a linked ext4 file as zeros, a failed read Io and logged once per streak; a zero page for a hole in a tmpfs or detached ext4 file, from its quota, NoSpc once that is used up; the same page again; NoSpc for a new page of a linked ext4 file at the hard limit, which detached files are exempt from; Range past EOF, NoEnt for an unlinked ext4 file nobody has open, NoDev for directories, symlinks and other filesystems), MappedPage::copy_to_frame for copy-on-write, under the owning inode's page-cache lock, and the last writable unmap leaving the page dirty so its stores reach the disk, including with an unmap between is_dirty's two loads (a test hook) (#266)"
milestone = "M7"
tests = [
    "ktest:lumen_kernel::vfs::ext4::ext4_mmap_page_hands_out_the_cached_page_filled_from_disk",
    "ktest:lumen_kernel::vfs::ext4::ext4_mmap_page_maps_holes_in_linked_and_detached_files",
    "ktest:lumen_kernel::vfs::ext4::ext4_shared_mapping_stores_reach_the_disk_after_the_last_unmap",
    "ktest:lumen_kernel::vfs::ext4::ext4_mmap_page_refuses_an_unlinked_file_nobody_has_open",
    "ktest:lumen_kernel::vfs::ext4::ext4_mmap_page_reports_a_failed_disk_read",
    "ktest:lumen_kernel::vfs::page_cache::is_dirty_sees_an_unmap_landing_between_its_loads",
    "ktest:lumen_kernel::vfs::tmpfs::tmpfs_mmap_page_hands_out_the_cached_page",
    "ktest:lumen_kernel::vfs::page_cache::mmap_page_refuses_inodes_of_other_filesystems",
    "ktest:lumen_kernel::vfs::page_cache::mapped_page_copies_to_a_frame_under_the_cache_lock",
]

[[feature]]
name = "ext4 device nodes report their st_rdev, decoded from i_block in Linux's old and new encodings and kept while an unlinked node is held, and other inodes report 0:0 (#292); ext4 times from 1901 to 2446 stored as Linux encodes them (a signed 32-bit second, two epoch bits, nanoseconds), clamped outside that range, whole 32-bit seconds for a time whose extra field the inode's i_extra_isize leaves out (tested at 0, 8, 12 and 16; 0 read as ext4plus does, as no extra fields), files, directories and symlinks made past 2038 keeping their atime, mtime and ctime, and stat agreeing with the disk across a remount after utimensat, chmod and chown (written at once) and after truncate, link, a write and create/rename/unlink/mkdir/rmdir/symlink in a directory (through the metadata flush), each at its own time (#294)"
milestone = "M7"
tests = [
    "cargo:lumen-vfs",
    "ktest:lumen_kernel::vfs::ext4::ext4_device_nodes_report_their_device_numbers",
    "ktest:lumen_kernel::vfs::ext4::ext4_times_before_1970_and_past_2038_survive_a_remount",
    "ktest:lumen_kernel::vfs::ext4::ext4_times_follow_the_extra_fields_an_inode_has",
    "ktest:lumen_kernel::vfs::ext4::ext4_each_operation_that_sets_a_time_puts_it_on_disk",
    "ktest:lumen_kernel::vfs::ext4::ext4_files_made_past_2038_keep_their_times",
]

[[feature]]
name = "msync(MS_SYNC) puts a ring-3 MAP_SHARED mapping's stores on the disk (#255): the shell exiting without a sync after it, the ext4 image passes the host's e2fsck -fn and the next boot reads the stores back"
milestone = "M7"
tests = [
    "scenario:test_linux_user::test_dynamic_musl_binary_and_dlopen",
]

[[feature]]
name = "Unmodified Alpine minirootfs coreutils on the writable ext4 root (#255): dynamic /bin/busybox ls, cat, cp, mv of a file and of a tree across mounts both ways (/tmp to / and back, the source gone and cmp equal), grep, sed (-n with p, -i over an ext4 file), awk, uncompressed tar -cf onto tmpfs and -xf onto ext4 (the files equal), each run leaking exactly the pages of the files it creates, less those it frees; then sync and exit, the mutated image passes the host's e2fsck -fn, and the host's debugfs finds the changes on the disk (the sed -i edit, the extracted files equal to the host's, / holding exactly the image's names and the test's new ones, nothing under /tmp)"
milestone = "M7"
tests = [
    "scenario:test_alpine::test_alpine_minirootfs_coreutils",
]

[[feature]]
name = "Read-only mounts exempt every special file (character and block devices, FIFOs, sockets) from -EROFS, as Linux's special_file(): access(W_OK) and a write open (O_WRONLY, O_RDWR, O_TRUNC) agree, while a regular file, directory or symlink gets EROFS from access (#291)"
milestone = "M7"
tests = ["cargo:lumen-vfs"]

[[feature]]
name = "chmod, chown and utimensat on devfs nodes (/dev/null) kept in memory and shown by stat, as Linux's devtmpfs, by path and by descriptor; set-id and sticky bits kept; /dev itself (its setters refusing, whoever calls them), and a special file on a read-only mount, stay -EROFS; the nodes start at their Linux boot modes, and vfstest dev-tmp-proc passes after a chmod (#293)"
milestone = "M7"
tests = [
    "ktest:lumen_kernel::linux::syscall::meta::tests::meta_chmod_on_dev_null_is_kept_as_devtmpfs_does",
    "ktest:lumen_kernel::linux::syscall::meta::tests::meta_chown_on_dev_null_is_kept_as_devtmpfs_does",
    "ktest:lumen_kernel::linux::syscall::meta::tests::meta_utimensat_on_dev_null_is_kept_as_devtmpfs_does",
    "ktest:lumen_kernel::linux::syscall::meta::tests::meta_a_special_file_on_another_read_only_mount_stays_erofs",
    "ktest:lumen_kernel::vfs::devfs::devfs_nodes_start_with_their_boot_metadata",
    "ktest:lumen_kernel::vfs::tests::vfs_dev_checks_pass_after_a_chmod_of_a_dev_node",
]

[[feature]]
name = "devfs is a writable mount, as Linux's devtmpfs (#301): /dev shows rw in mount and /proc/mounts, a second devfs instance's nodes take chmod, chown and utimensat through the syscalls, access(\"/dev\", W_OK) passes for root, and lumen-vfs's own namespace checks answer first (unlinking or renaming a missing name -ENOENT, rmdir of a node -ENOTDIR, RENAME_NOREPLACE over a node -EEXIST, a link from another mount -EXDEV, a rename onto itself 0), then devfs refuses every change that reaches it with -EROFS, mkdir and symlink onto a name in use too"
milestone = "M7"
tests = [
    "ktest:lumen_kernel::linux::syscall::meta::tests::meta_a_second_devfs_mount_takes_chmod_chown_and_utimensat",
    "ktest:lumen_kernel::linux::syscall::stat::tests::stat_access_modes_follow_the_root_rules",
    "ktest:lumen_kernel::vfs::tests::vfs_boot_mounts_tmp_dev_proc_work",
    "ktest:lumen_kernel::vfs::tests::vfs_dev_answers_namespace_changes_after_lumen_vfs_checks",
    "scenario:test_fs::test_dev_tmp_proc_filesystems",
]

[[feature]]
name = "ext4 rootfs fsck-clean after Linux programs' file syscalls (#254): with nothing left once the programs remove what they made (unlink and rmdir while open, renames over open files, record locks), and with a tree they leave (a hard link, a short and a long symlink, two files' mode, owner and times, one written by a sync and one set on a clean inode after it, a file and a directory exchanged, a directory moved to another parent with its ..), all of it read back from the disk on a second boot"
milestone = "M7"
tests = [
    "scenario:test_fs::test_posix_vfs_semantics",
    "scenario:test_fs::test_flock_and_atomic_rename",
]

[[feature]]
name = "Byte-string names through the VFS (#268): a name that is not UTF-8 (on ext4 and tmpfs) is created, listed by readdir and getdents64, looked up (the dentry cache telling names apart by their bytes), renamed, hard-linked, unlinked and its directory removed once empty, kept on an ext4 disk through e2fsck and read back cold on the next boot; getcwd under it and /proc/<pid>/fd give its bytes; a symlink target that is not UTF-8 is stored as given; /proc/<pid>/maps names a mapped file by its path's bytes (each newline as \\012); vfstest ls and an exec error's interpreter path show such a name escaped, never lossily (lumen_vfs::Escaped). Not on an ext4 volume with unsigned directory hashes (#308)."
milestone = "M7"
tests = [
    "cargo:lumen-vfs",
    "cargo:lumen-vm",
    "ktest:lumen_kernel::vfs::ext4::ext4_names_that_are_not_utf8_are_listed_looked_up_renamed_and_removed",
    "ktest:lumen_kernel::linux::syscall::dir::dir_getdents64_lists_names_that_are_not_utf8",
    "ktest:lumen_kernel::linux::syscall::at::at_start_operations_take_names_that_are_not_utf8",
    "ktest:lumen_kernel::linux::syscall::at::at_user_path_rules",
    "ktest:lumen_kernel::mm::user_vm::file_vm_maps_names_a_mapped_file_by_its_path_bytes",
    "ktest:lumen_kernel::linux::exec::missing_interpreter_is_enoent",
    "scenario:test_fs::test_posix_vfs_semantics",
]

[[feature]]
name = "`..` from a removed directory is the directory it was removed from (#318), as Linux's d_parent of a deleted dentry: from a removed cwd, chdir(\"..\") succeeds and getcwd then names the parent, open(\"..\", O_DIRECTORY) opens the parent and open(\"..\", O_CREAT) is -EISDIR, on ext4 and on tmpfs; in lumen-vfs's host tests also from a removed directory held open (detached) or freed, in a mounted filesystem's root (../.. crossing up to /), from a directory a rename replaced, through a parent removed in turn, with a failed rmdir or rename keeping no record (one that removed the directory all the same keeping it) and dead records pruned"
milestone = "M7"
tests = [
    "cargo:lumen-vfs",
    "scenario:test_fs::test_posix_vfs_semantics",
]
