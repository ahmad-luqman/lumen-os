# Features: storage, writable ext4, and POSIX VFS (M7+). See tests/features/README.md for the format.

[[feature]]
name = "ext4plus 0.1.0-rc.2 (MIT elected, sync + multi-threaded) pinned and linked into both kernels (#248) with the flag audit passing and in-memory ext4 read/write/truncate/symlink/hardlink/mkdir/rmdir/unlink smoke check"
milestone = "M7"
tests = [
    "ktest:lumen_kernel::vfs::ext4_crate_smoke",
    "audit:flags",
]

[[feature]]
name = "POSIX VFS core traits, path/symlink resolver, mount table, caches, 1024-FD table, and advisory locks"
milestone = "M7"
tests = [
    "cargo:lumen-vfs",
]

[[feature]]
name = "Unified 4 KiB frame-backed PageCache with write-back, global soft 32 MiB reclaim, and truncate tail zeroing"
milestone = "M7"
tests = [
    "ktest:lumen_kernel::vfs::ext4_adapter_pagecache_quirks_and_open_unlinked",
    "ktest:lumen_kernel::vfs::page_cache_global_reclaim_writes_back_and_evicts",
    "ktest:lumen_kernel::vfs::ext4_flush_and_reclaim_preserve_dirty_on_io_error",
    "ktest:lumen_kernel::vfs::ext4_truncate_and_open_unlink_preserve_state_on_io_error",
    "ktest:lumen_kernel::vfs::ext4_partial_phase2_io_error_recovery",
    "audit:flags",
]

[[feature]]
name = "Writable ext4 rootfs VFS adapter over BlockCache with Gate 6 open-unlinked detach, symlinks, rmdir/rename, and reboot persistence"
milestone = "M7"
tests = [
    "ktest:lumen_kernel::vfs::ext4_adapter_pagecache_quirks_and_open_unlinked",
    "ktest:lumen_kernel::vfs::ext4_flush_and_reclaim_preserve_dirty_on_io_error",
    "ktest:lumen_kernel::vfs::ext4_truncate_and_open_unlink_preserve_state_on_io_error",
    "ktest:lumen_kernel::vfs::ext4_partial_phase2_io_error_recovery",
    "scenario:test_fs::test_ext4_read_write_persists_across_reboot",
    "scenario:test_fs::test_ext4_readonly_device_mounts_ro",
]

[[feature]]
name = "Pseudo-filesystems (/tmp tmpfs, /dev devfs, /proc procfs), boot mount with silent tmpfs fallback, and mount/sync shell commands"
milestone = "M7"
tests = [
    "ktest:lumen_kernel::vfs::vfs_boot_mounts_tmp_dev_proc_work",
    "scenario:test_fs::test_dev_tmp_proc_filesystems",
    "scenario:test_fs::test_dev_urandom_refuses_when_unseeded",
]
