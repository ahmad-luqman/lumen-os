[[feature]]
name = "ext4 device nodes report their st_rdev, decoded from i_block in Linux's old and new encodings and kept while an unlinked node is held, and other inodes report 0:0 (#292); ext4 times from 1901 to 2446 stored as Linux encodes them (a signed 32-bit second, two epoch bits, nanoseconds), clamped outside that range, whole 32-bit seconds for a time whose extra field the inode's i_extra_isize leaves out (tested at 0, 8, 12 and 16; 0 read as ext4plus does, as no extra fields), files, directories and symlinks made past 2038 keeping their atime, mtime and ctime, and stat agreeing with the disk across a remount after utimensat, chmod and chown (written at once) and after truncate, link, a write and create/rename/unlink/mkdir/rmdir/symlink in a directory (through the metadata flush), each at its own time (#294), and the operation's time as the ctime of a file or directory moved to another parent or renamed in its own, of both sides of an exchange of a file and a directory between parents, and of an inode an unlink or a rename over it leaves with a link, in memory and across a remount, the parents' link counts then what their directories call for, on disk and in memory; utimensat's UTIME_OMIT keeping and UTIME_NOW stamping each ext4 stamp alone, in memory and on disk (#302)"
milestone = "M7"
tests = [
    "cargo:lumen-vfs",
    "ktest:lumen_kernel::vfs::ext4::ext4_device_nodes_report_their_device_numbers",
    "ktest:lumen_kernel::vfs::ext4::ext4_times_before_1970_and_past_2038_survive_a_remount",
    "ktest:lumen_kernel::vfs::ext4::ext4_times_follow_the_extra_fields_an_inode_has",
    "ktest:lumen_kernel::vfs::ext4::ext4_set_times_omits_and_nows_each_stamp_alone",
    "ktest:lumen_kernel::vfs::ext4::ext4_each_operation_that_sets_a_time_puts_it_on_disk",
    "ktest:lumen_kernel::vfs::ext4::ext4_namespace_operations_set_their_childrens_ctime",
    "ktest:lumen_kernel::vfs::ext4::ext4_files_made_past_2038_keep_their_times",
]

[[feature]]
name = "Files, directories and symlinks (inline and in a block) made on ext4 get i_crtime and i_crtime_extra set to their creation time, epoch and nanoseconds included, kept by later writes (of a file and a directory), flushes and a remount (#303)"
milestone = "M7"
tests = [
    "ktest:lumen_kernel::vfs::ext4::ext4_new_inodes_get_a_creation_time_that_survives_a_remount",
]

[[feature]]
name = "A failed ext4 rename whose undo can't read its entries back (every read, or every read past the inode table, failing after each write in turn, and for a move without a target also after the second of two failed writes, the second within three of the first, which reaches the undo of the link unable to read back; a move, an exchange and a rename over a target, of files and of directories) reports an error if it didn't complete, moves no time then and leaves a target it would have replaced with its count, not freed, keeps each name's data, leaves an inode it couldn't put back allocated for e2fsck, keeps no count in memory below the entries on disk (a move's source left at both names, by either undo, included: its count and a directory's new parent's are those with both names, #322) and, once the rename completed, each parent's count exactly what its entries call for, and the volume then refuses every write (errors=remount-ro, #349; a create checked); each kind and mode has at least one fault whose undo couldn't read back (a nameless inode, or a move's source left at both names), and a move without a target, every read failing, at least one pair whose undo of the link couldn't; a stale pin below a count raised for both names goes whether the raise lands or not (host-tested); a rename over a target whose put-back fails too (two failed writes, the second within six of the first, or every write from one on) leaves the target nameless but allocated with its data and count, frees nothing, and reports an error; a count kept in memory while the disk holds another goes on disk before the next unlink of the inode changes it"
milestone = "M7"
tests = [
    "ktest:lumen_kernel::vfs::ext4::ext4_failed_rename_that_cant_read_back_keeps_every_entry",
    "ktest:lumen_kernel::vfs::ext4::ext4_a_kept_link_count_is_written_before_the_next_unlink",
    "ktest:lumen_kernel::vfs::ext4::ext4_failed_rename_over_whose_put_back_fails_leaves_the_target_allocated",
    "cargo:lumen-vfs",
]

[[feature]]
name = "ext4 undo leftovers (#323, #325): a directory move (to another directory, over an empty directory there, or within one) with each write in turn landing but reporting an error, and with two such writes (the second within three of the first, which reach the parents' fix-ups failing after the unlink failed past the entry, logged), wherever it committed, error or not, leaves the source's .. naming its new parent and each parent's count on disk and in memory what its entries call for; an exchange of files or of directories with three writes failing (each within four of the one before) or every write from one on, with reads intact and with every read failing from the third failed write on, never leaves an inode with no name and a count of 0, on disk or in memory, never keeps a count in memory below the names on disk (a file left at both names keeps a count for both, on disk with its bounds too), and each name left holds its inode's data, the volume then read-only (errors=remount-ro, #349: no name comes off afterwards), at least one fault leaving a file at both names with reads failing; an rmdir with each read of its parent's inode failing in turn, and with each write failing in turn and the parent's inode unreadable after zero to three more reads of it, never keeps a directory whose entry went live (none of these faults leaves one so; one zeroed on disk has 0 links in memory), and with no read of the parent passing after the failed write, wherever the entry went, one whose blocks were being freed, not yet zeroed, is forgotten too, logged, at least one run doing so (#330), and after a failed write the volume refuses every write (errors=remount-ro, #349): a mkdir and a create in the removed directory are refused, and where the entry went, leaves the parent's count in memory what its entries call for (pinned while the disk keeps another) and stamps its times, also when the parent couldn't be read back to lower its count, after the unlink or after an unlink that failed past the entry, and where it stayed, fails and leaves the parent as it was; an unlink of an open file, each write failing in turn and its directory's inode unreadable after it, wherever the entry went, leaves the volume refusing every write (errors=remount-ro, #349: no file is made afterwards, and writes through a still-linked open file are refused), for a file of one extent (each write also paired with the next), of five extents (a depth-1 tree) and with a block map on 1 KiB blocks whose first data block is under its single indirect block (a file whose blocks were being freed, not yet zeroed, is forgotten and detached, its writes reading back through it, logged, at least once in each; one kept live still owns its blocks, at least once among the pairs); with the block bitmap unreadable too, such a file, or an rmdir's directory, is never judged freed and is kept live only when that can't be told, logged with the cause, at least once each; an unlink of a file with a second name, its inode reading back corrupt after each write fails, keeps it (a link that isn't the last is never freed), logged, its other name still holding its data; a superblock whose groups have more blocks than a bitmap block has bits refuses the mount, logged naming the field and value, while a bigalloc one (bounded by its clusters per group) still mounts read-only; parsing i_block for the first block in the order ext4plus 0.1.0-rc.2's delete_file frees them (the order read from its source), and a block's bitmap bit from a superblock's checked geometry (bigalloc's included, each refusal's reason named), host-tested"
milestone = "M7"
tests = [
    "ktest:lumen_kernel::vfs::ext4::ext4_directory_move_that_commits_before_failing_fixes_its_parents",
    "ktest:lumen_kernel::vfs::ext4::ext4_failed_exchange_never_writes_a_zero_count_onto_a_nameless_inode",
    "ktest:lumen_kernel::vfs::ext4::ext4_rmdir_whose_parent_cant_be_read_back_still_lowers_its_count_and_stamps_it",
    "ktest:lumen_kernel::vfs::ext4::ext4_unlink_whose_directory_cant_be_read_back_never_writes_into_freed_blocks",
    "ktest:lumen_kernel::vfs::ext4::ext4_unlink_of_a_linked_file_whose_inode_reads_corrupt_keeps_it",
    "ktest:lumen_kernel::vfs::ext4::ext4_a_bad_group_geometry_refuses_the_mount_and_bigalloc_still_mounts_read_only",
    "cargo:lumen-vfs",
    "scenario:test_ktest::test_in_kernel_tests_pass",
]

