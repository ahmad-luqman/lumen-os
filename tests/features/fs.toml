[[feature]]
name = "ext4's errors=remount-ro (#349): the first failed device write or flush of a volume (the block cache's first failure, wherever a block is written back: an ext4plus or adapter write's eviction, a writeback, a sync, a read's eviction; a flush's failure setting it host-tested, ext4 reacting to a failing cache sync tested; whatever ext4plus returns, ENOSPC or Ok included; a write the cache refuses with no device write failing doesn't count) makes it read-only at once: nothing more reaches the device from that write on (the block cache stops writing back inside the call that met it), syncs and writebacks stop there (the rest stays dirty in memory), the write-type operations running then finish against the cache (the failing one's undo included) and return EIO, even one whose own calls all worked (a link or unlink whose read met the failed eviction, served), and when the last ends the cache is frozen and one ERROR line names the device, the operation whose write failed (or a read's eviction) and the error; every later write-type operation is EROFS (create, mkdir, symlink, link, unlink, rmdir, rename, opens for writing or truncating, write, a write whose own reclaim met the failure included, and one whose partial page's read met it refused with nothing of it in that page, or short when that page is its last, truncate, chmod, chown, utimensat, a new shared writable mmap), a shared mapping made before gets no new writable PTE (a store fault or promotion is a bus error; a PTE already writable keeps taking stores into the page cache, never the disk) and mprotect can't make it writable, fsync, fdatasync, msync and the filesystem's sync write nothing and return EIO (sync(2) still returns 0), reclaim drops only clean pages, and reads keep working (a miss with every slot dirty is read straight from the device, uncached); NoSpc with no failed write leaves the volume writable; mount shows ro,errors and /proc/mounts ro,errors=remount-ro; a read error leaves the volume writable; the fault sweeps check each failed operation's own outcome and then that the volume went read-only"
milestone = "M7"
tests = [
    "ktest:lumen_kernel::vfs::ext4::ext4_a_write_error_makes_the_volume_read_only",
    "ktest:lumen_kernel::vfs::ext4::ext4_a_failed_device_write_makes_the_volume_read_only",
    "ktest:lumen_kernel::vfs::ext4::ext4_nothing_reaches_the_device_after_the_first_failed_write",
    "ktest:lumen_kernel::vfs::ext4::ext4_the_latch_settles_when_the_last_write_type_operation_ends",
    "ktest:lumen_kernel::vfs::ext4::ext4_unlink_whose_failed_write_ext4plus_retried_returns_eio",
    "ktest:lumen_kernel::vfs::ext4::ext4_a_failed_page_writeback_errors_the_volume_as_enospc",
    "ktest:lumen_kernel::vfs::ext4::ext4_sync_stops_at_the_first_failed_write",
    "ktest:lumen_kernel::vfs::ext4::ext4_a_write_refused_by_the_cache_alone_leaves_the_volume_writable",
    "ktest:lumen_kernel::vfs::ext4::ext4_a_write_whose_reclaim_meets_a_failed_write_is_refused",
    "ktest:lumen_kernel::vfs::ext4::ext4_create_in_a_full_directory_on_a_full_disk_leaks_nothing",
    "ktest:lumen_kernel::vfs::tests::vfs_sync_stops_at_a_failed_write_and_reports_it",
    "ktest:lumen_kernel::mm::user_vm::file_vm_a_volume_gone_read_only_takes_no_store_through_an_older_mapping",
    "ktest:lumen_kernel::vfs::tests::ext4_partial_phase2_io_error_recovery",
    "ktest:lumen_kernel::vfs::tests::ext4_truncate_and_open_unlink_preserve_state_on_io_error",
    "ktest:lumen_kernel::linux::syscall::io::io_fsync_writes_an_ext4_file_back_and_reports_eio",
