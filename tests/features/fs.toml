# Features: storage, writable ext4, and POSIX VFS (M7+). See tests/features/README.md for the format.

[[feature]]
name = "ext4plus 0.1.0-rc.2 (MIT elected, sync + multi-threaded) pinned and linked into both kernels (#248) with the flag audit passing and in-memory ext4 read/write/truncate/symlink/hardlink/mkdir/rmdir/unlink smoke check"
milestone = "M7"
tests = [
    "ktest:lumen_kernel::vfs::tests::ext4_crate_smoke",
    "audit:flags",
]

[[feature]]
name = "POSIX VFS core traits, path/symlink resolver, mount table, caches, 1024-FD table, and advisory locks"
milestone = "M7"
tests = [
    "cargo:lumen-vfs",
]

[[feature]]
name = "Unified 4 KiB frame-backed PageCache with write-back, soft 32 MiB reclaim and a 64 MiB hard cap for ext4 (one check for a page reclaim can't drop: PageCache::insert_new refusing a page dirty when inserted at the cap and letting a clean or tmpfs page in; write_from and map_page (a mapped page) asking before they make a page and again after, an error after a write's first page returning a short count), quota accounting, truncate tail zeroing, and writeback of a page's bytes below the size alone; tmpfs and ext4 share its page I/O (read_into, write_from, resize, map_page): an overwrite inside a page keeping the rest of it, a write past the end zeroing what a mapping stored past the old end, a shrink dropping the pages past the new end so a later write reads zeros there, a page a read loads staying cached, and a detached ext4 file's holes, writes and truncates never reading the disk; its page spans, a page's bytes below the size and the tail-zero rule lumen-vfs host-tests against byte-by-byte models (#264, #265)"
milestone = "M7"
tests = [
    "cargo:lumen-vfs",
    "ktest:lumen_kernel::vfs::tests::ext4_adapter_pagecache_quirks_and_open_unlinked",
    "ktest:lumen_kernel::vfs::tests::page_cache_global_reclaim_writes_back_and_evicts",
    "ktest:lumen_kernel::vfs::tests::page_cache_global_reclaim_reaches_inodes_the_vfs_caches_never_held",
    "ktest:lumen_kernel::vfs::page_cache::*",
    "ktest:lumen_kernel::vfs::tests::ext4_flush_and_reclaim_preserve_dirty_on_io_error",
    "ktest:lumen_kernel::vfs::tests::ext4_truncate_and_open_unlink_preserve_state_on_io_error",
    "ktest:lumen_kernel::vfs::tests::ext4_partial_phase2_io_error_recovery",
    "ktest:lumen_kernel::vfs::tests::tmpfs_truncate_returns_quota",
    "scenario:test_fs::test_ext4_read_write_persists_across_reboot",
]

[[feature]]
name = "Page-cache I/O errors (#321): a read stops at its first page that fails, returning the bytes of the pages before it (a short count, as Linux's filemap_read; lumen-vfs's page::short_count host-tested for each page of each edge-case range failing) and the next read at the failing page returns EIO, a later cached page never read past the gap; a write's partial-page fill whose disk read fails is logged as a read's is (one warning per streak, its errno set, a fill that reads ending the streak), past the write's first page as a short count, on it as EIO; a write past the end refused outright leaves a clean ext4 tail page clean (its past-the-end bytes still zeroed), a short or whole write marking it dirty and a tmpfs one never, so fdatasync after a write refused at the hard limit succeeds with every block write failing (while the block cache's own sync works)"
milestone = "M7"
tests = [
    "cargo:lumen-vfs",
    "ktest:lumen_kernel::vfs::page_cache::page_cache_a_read_failing_past_its_first_page_returns_the_bytes_before_it",
    "ktest:lumen_kernel::vfs::page_cache::page_cache_a_read_stops_at_its_first_failing_page",
    "ktest:lumen_kernel::vfs::ext4::ext4_a_write_whose_fill_read_fails_logs_it_as_a_read_does",
    "ktest:lumen_kernel::vfs::page_cache::page_cache_a_refused_write_past_the_end_leaves_its_tail_page_clean",
    "ktest:lumen_kernel::vfs::page_cache::page_cache_ext4_fdatasync_after_a_refused_write_past_the_end_succeeds",
    "scenario:test_ktest::test_in_kernel_tests_pass",
]

