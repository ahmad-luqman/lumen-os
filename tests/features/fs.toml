[[feature]]
name = "tmpfs's quota charges for inodes, directory entries and symlink targets are at least what they take from the kernel heap (#267), measured: one directory of hundreds of long names, the same after removing every other one, many directories of one entry each, and one directory whose leaves sit at the B-tree's minimum fill"
milestone = "M7"
tests = [
    "ktest:lumen_kernel::vfs::tmpfs::tmpfs_quota_charges_cover_what_the_heap_gives",
]

[[feature]]
name = "tmpfs files created through the kernel's VFS tables until ENOSPC and unlinked by unlink_at give all their quota back, so as many can be created again (#267)"
milestone = "M7"
tests = [
    "ktest:lumen_kernel::vfs::tmpfs::tmpfs_unlinking_through_the_vfs_gives_the_room_back",
]

[[feature]]
name = "The shell's mount shows each tmpfs mount's quota, its bytes in use and its limit (- for ext4, devfs and procfs; /proc/mounts keeping Linux's six fields), and the count follows a file's charges as it comes and goes; a directory with a copy of busybox, a hard link to it, a symlink, an empty file and a subdirectory made on /tmp by ring-3 busybox raise /tmp's count by at least the file's pages, and rm -r brings it back to exactly where it was (#324)"
milestone = "M7"
tests = [
    "ktest:lumen_kernel::vfs::tmpfs::tmpfs_quota_use_reads_the_mount_s_count_and_limit",
    "scenario:test_fs::test_tmpfs_quota_returns_after_ring3_files",
    "scenario:test_fs::test_dev_tmp_proc_filesystems",
    "scenario:test_fs::test_ext4_read_write_persists_across_reboot",
]

[[feature]]
name = "ext4 volumes whose directory hashes are or may be unsigned (#308: s_flags EXT2_FLAGS_UNSIGNED_HASH, or neither hash flag with dir_index; ext4plus hashes signed) mount read-only with one warning naming the flag or its absence (and a journal needing recovery outranks it, its warning showing no s_flags); every name an htree directory lists, those with bytes of 0x80 or above too, is looked up to the inode listed (only a non-ASCII hash miss in an htree directory walks it; a read error in the walk or in the hash lookup is EIO), a missing name is ENOENT, and unlink, rmdir and create are EROFS; the same volume with its flag set to signed, or with neither flag and no dir_index, mounts writable (the signed one gets no walk); tools/ext4-signed-hash.sh sets an ext4 image's s_flags to signed (from unsigned, or neither flag), changing nothing else (keeping s_flags' other bits), refuses a missing file or one without ext4's magic, and fails unless the image then says signed; tools/mkrootfs.sh runs it, so an image its mke2fs made unsigned comes out signed (mke2fs -d indexing no directory), passing an ASCII-only directory indexed by the unsigned hash and failing on one holding names with bytes of 0x80 or above"
milestone = "M7"
tests = [
    "ktest:lumen_kernel::vfs::ext4::ext4_an_unsigned_hash_volume_mounts_read_only_and_looks_up_every_listed_name",
    "ktest:lumen_kernel::vfs::ext4::ext4_unwritable_ro_compat_features_force_read_only",
    "scenario:test_ktest::test_in_kernel_tests_pass",
    "harness:test_rootfs::test_signed_hash_switches_only_the_flag",
    "harness:test_rootfs::test_signed_hash_fails_when_the_flag_stays_unsigned",
    "harness:test_rootfs::test_signed_hash_refuses_a_file_without_an_ext4_superblock",
    "harness:test_rootfs::test_mkrootfs_makes_an_unsigned_image_signed",
    "harness:test_rootfs::test_mkrootfs_passes_an_ascii_directory_indexed_by_the_unsigned_hash",
    "harness:test_rootfs::test_mkrootfs_fails_on_a_directory_indexed_by_the_unsigned_hash",
]

[[feature]]
name = "`..` from a removed directory is the directory it was removed from (#318), as Linux's d_parent of a deleted dentry: from a removed cwd, chdir(\"..\") succeeds and getcwd then names the parent, open(\"..\", O_DIRECTORY) opens the parent and open(\"..\", O_CREAT) is -EISDIR, on ext4 and on tmpfs; in lumen-vfs's host tests also from a removed directory held open (detached) or freed, in a mounted filesystem's root (../.. crossing up to /), from a directory a rename replaced, through a parent removed in turn while held open (one freed by its removal -ENOENT, never the inode reusing its number), with only ENOENT from the filesystem's .. taking the record, a record found by the directory's Arc and not its reused number, a failed rmdir or rename keeping no record (one that removed the directory all the same keeping it), dead records pruned (their parents dropped outside Lock 9) and unmounting dropping only its filesystem's records; getcwd of a cwd removed during its walk, its number taken by a new entry, -ENOENT, and of a live cwd whose old ancestor was removed during the walk (its number taken) where the cwd is now"
milestone = "M7"
tests = [
    "cargo:lumen-vfs",
    "scenario:test_fs::test_posix_vfs_semantics",
]

[[feature]]
name = "The VFS's Lock-9 tables never drop an inode or filesystem Arc they let go of while holding a table (#320): umount drops the mountpoint it unmounts after releasing them, a refused mount (no root mounted, a mountpoint that isn't a directory, a filesystem or a mountpoint already mounted) or mount_root drops the Arcs it was handed after them, mount asks its mountpoint's type before taking them, and an inode a get_or_insert path unifies with the cached one (mount's and mount_root's seeded root too), an inode inode_get_or_insert_if_mounted refuses, or a stale (detached) entry a probe evicts, drops after them, through every VfsCacheOps method that can; a second Arc for one Released panics rather than drop the first (lumen-vfs's host tests, on a filesystem handing out a fresh Arc per lookup)"
milestone = "M7"
tests = [
    "cargo:lumen-vfs",
]

[[feature]]
name = "ext4's errors=remount-ro (#349): the first failed device write of a volume (counted by the block cache, wherever it is written back: an ext4plus or adapter write's eviction, a writeback, a sync, a read's eviction; whatever errno the operation returns, ENOSPC or Ok included) makes it read-only at once and freezes its block cache when the operation that hit it ends (a read's at once, the read then served): that operation returns its error with its undo run, every later write-type operation is EROFS (create, mkdir, symlink, link, unlink, rmdir, rename, opens for writing or truncating, write, truncate, chmod, chown, utimensat, a new shared writable mmap), fsync, fdatasync, msync and sync write nothing and return EIO, reclaim drops only clean pages, reads keep working, and nothing more reaches the device (the block cache frozen: no write, sync or eviction writeback); one ERROR line names the device, the operation and the error; NoSpc with no failed write leaves the volume writable; mount shows ro,errors and /proc/mounts ro,errors=remount-ro; a read error leaves the volume writable; the fault sweeps check each failed operation's own outcome and then that the volume went read-only"
milestone = "M7"
tests = [
    "ktest:lumen_kernel::vfs::ext4::ext4_a_write_error_makes_the_volume_read_only",
    "ktest:lumen_kernel::vfs::ext4::ext4_a_failed_device_write_makes_the_volume_read_only",
    "ktest:lumen_kernel::vfs::ext4::ext4_unlink_can_return_ok_after_a_failed_write_that_ext4plus_retried",
    "ktest:lumen_kernel::vfs::ext4::ext4_writeback_continues_past_a_failing_page",
    "ktest:lumen_kernel::vfs::ext4::ext4_sync_flushes_the_rest_past_a_failing_inode",
    "ktest:lumen_kernel::vfs::tests::ext4_partial_phase2_io_error_recovery",
    "ktest:lumen_kernel::vfs::tests::ext4_truncate_and_open_unlink_preserve_state_on_io_error",
    "ktest:lumen_kernel::linux::syscall::io::io_fsync_writes_an_ext4_file_back_and_reports_eio",
    "ktest:lumen_kernel::linux::syscall::mem::tests::mem_msync_returns_a_writeback_error_before_enomem",
    "scenario:test_ktest::test_in_kernel_tests_pass",
    "cargo:lumen-bcache",
    "cargo:lumen-vfs",
]

[[feature]]
name = "ext4plus 0.1.0-rc.2's range-free retry pinned (#331): a write failing inside freeing a file's block range is retried block by block, so the unlink returns Ok though the failed write was reported, the file gone and its blocks free in the bitmap, and a failed descriptor or superblock write leaves that free count raised twice; an ext4plus bump that changes it fails the pin"
milestone = "M7"
tests = [
    "ktest:lumen_kernel::vfs::ext4::ext4_unlink_can_return_ok_after_a_failed_write_that_ext4plus_retried",
]
