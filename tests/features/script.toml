# Features: script. See tests/features/README.md for the format.

[[feature]]
name = "rhai linked into the kernel with the code-generation audit passing: integers only, no modules, closures that can't capture, curry disabled"
milestone = "M2"
tests = [
    "audit:flags",
    "scenario:test_script::test_rhai_eval",
    "ktest:lumen_kernel::script::errors_are_one_line_and_name_the_limit",
]

[[feature]]
name = "Scripts in the shell: `rhai -e <expr>` (cpus(), mem(), uptime(), trace(n), sleep(ms) that waits, print, debug), a REPL keeping variables and going on after an error or Ctrl-C, built-in demos; a value printed, an error in one line (also from inside a function), values whose formatting allocates printed on either console"
milestone = "M2"
tests = [
    "scenario:test_script::test_rhai_eval",
    "scenario:test_script::test_rhai_repl",
    "ktest:lumen_kernel::script::lumen_functions_answer",
    "ktest:lumen_kernel::script::errors_are_one_line_and_name_the_limit",
    "ktest:lumen_kernel::script::the_repl_keeps_going",
    "ktest:lumen_kernel::shell::the_screen_console_formats_then_draws_each_write_whole",
    "scenario:test_script::test_screen_shell_scripts",
]

[[feature]]
name = "Scripts draw on the screen (draw_pixel, draw_rect, draw_text, clear) and keep it until a key, shown on a strip at the bottom, then the terminal is back; after an error it is back at once; the screen's size without taking it"
milestone = "M2"
tests = [
    "scenario:test_script::test_script_draws_golden",
    "scenario:test_script::test_screen_shell_scripts",
    "ktest:lumen_kernel::script::a_script_that_drew_waits_for_a_key",
]

[[feature]]
name = "A runaway script is stopped, with an error rather than a crash: Ctrl-C on serial or the keyboard (also in closures, functions, sleep and drawing loops); caps on operations, call depth, expression depth, variables, value sizes (which bound how deeply values nest), text made from a value, and heap growth over a session (a REPL's too); recursion and the deepest values fit in half the 1 MiB script stack"
milestone = "M2"
tests = [
    "scenario:test_script::test_runaway_script_is_stopped",
    "ktest:lumen_kernel::script::ctrl_c_stops_a_script",
    "ktest:lumen_kernel::script::limits_are_set",
    "ktest:lumen_kernel::script::the_heap_budget_stops_a_script",
    "ktest:lumen_kernel::script::the_repl_heap_budget_lasts_the_session",
    "ktest:lumen_kernel::script::text_made_from_a_value_is_bounded",
    "ktest:lumen_kernel::script::deep_recursion_is_an_error_not_a_crash",
    "ktest:lumen_kernel::script::nested_values_are_an_error_not_a_crash",
]
