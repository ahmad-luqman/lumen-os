[[feature]]
name = "mmap of a file descriptor and msync (#255): MAP_SHARED stores reaching the file, and the disk's own bytes through msync(MS_SYNC), a hole's page too, and two files in one range (MS_ASYNC and MS_INVALIDATE accepted, writing nothing), on ext4 and tmpfs; a writeback error returned (EIO) before ENOMEM, the stores written once the disk works again; nothing written back for a shared mapping made through a read-only descriptor (as Linux, without VM_SHARED); MAP_PRIVATE copy-on-write through a read-only descriptor leaving the file alone; a mapping outliving close and unlink; open(O_TRUNC) unmapping the caller's pages of the file (a touch then EFAULT), where a plain reopen and O_PATH|O_TRUNC, which truncate nothing, unmap nothing; mmap and msync dispatched from their registers; Linux's errnos (EBADF for a bad or O_PATH descriptor; EINVAL for an unaligned offset, no length, MAP_HUGETLB, MAP_GROWSDOWN or a bad map type; ENOMEM for a length whose page rounding overflows; EOVERFLOW for an end in a regular file past i64::MAX; EOPNOTSUPP for MAP_SHARED_VALIDATE with unknown flags, MAP_SYNC or MAP_FIXED_NOREPLACE; EACCES for a descriptor not open for reading and for shared PROT_WRITE, mmap or mprotect, without O_RDWR; ENODEV for a directory, the console and /dev/null; EEXIST for MAP_FIXED_NOREPLACE over a mapping); /dev/zero as anonymous memory, placed as asked, at an offset past i64::MAX; msync's EINVAL and ENOMEM (overflow, unmapped parts) and 0 for empty, wrapped and anonymous ranges; the anonymous path unchanged"
