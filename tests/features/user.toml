# Features: Linux x86-64 user space and syscall ABI (M6+). See tests/features/README.md for the format.

[[feature]]
name = "linux-raw-sys 0.12.1 (MIT elected, zero transitive deps) pinned and linked into both kernels (#232) with the flag audit passing: all 30 M6 Linux x86-64 syscall numbers, core errno constants, terminal ioctl requests, arch_prctl FS codes, CLOCK_* IDs, and ABI struct sizes (`new_utsname`, `timespec`, `iovec`, `stat`, `termios`, `winsize`, `rlimit64`, `sigaction`) match ARCHITECTURE section 8"
milestone = "M6"
tests = [
    "ktest:lumen_kernel::linux::abi_constants_match_spec",
    "audit:flags",
]

[[feature]]
name = "Ring-3 entry/exit (`iretq` and `syscall`/`sysretq`), writable `PerCpu` + `TSS.rsp0`, conditional `SWAPGS` + guarded `IST_DEBUG = 4` (CVE-2018-8897 deferred `#DB` at `LSTAR` handoff), non-fatal ring-3 exceptions, canonical RIP and sanitized RFLAGS return validation, and `.lumen_fixup` fault-safe user copies (`copy_from_user`, `copy_to_user`, `copy_cstr_from_user`) with runtime-gated SMEP/SMAP (#236)"
milestone = "M6"
tests = [
    "ktest:lumen_kernel::arch::x86_64::syscall::syscall_msrs_are_programmed_on_all_cpus",
    "ktest:lumen_kernel::user::bad_user_pointer_returns_efault",
    "scenario:test_linux_user::test_ring3_entry_and_exit",
    "scenario:test_linux_user::test_user_fault_kills_process_not_kernel",
    "scenario:test_linux_user::test_non_canonical_sysret_does_not_crash_kernel",
    "audit:flags",
]

[[feature]]
name = "Per-thread user context switching (CR3, TSS.rsp0, PerCpu, IA32_FS_BASE TLS, and FXSAVE/XSAVE FPU state) preserving xmm0-xmm7 and %fs across concurrent same-CPU timer preemption (#237)"
milestone = "M6"
tests = [
    "ktest:lumen_kernel::mm::user_vm::lazy_zero_fill_and_unmap",
    "scenario:test_linux_user::test_bad_elf_rejected",
    "scenario:test_linux_user::test_mmap_and_brk",
    "scenario:test_linux_user::test_sse_and_tls_preserved_across_preemption",
    "audit:flags",
]

[[feature]]
name = "30-syscall Linux x86-64 ABI dispatcher, Limine boot-module loader (`linux` shell command), unmodified static `musl` `hello`, and unmodified Alpine static `musl` `busybox ash -s` built-ins with `-EFAULT` / `-ENOSYS` / `-EBADF` verification and zero frame leaks (#238)"
milestone = "M6"
tests = [
    "scenario:test_linux_user::test_syscall_bad_pointers_return_efault",
    "scenario:test_linux_user::test_static_musl_hello",
    "scenario:test_linux_user::test_static_busybox_ash",
    "audit:flags",
]

[[feature]]
name = "VFS-backed 1024-slot per-process FD table (console fds 0/1/2 on /dev/console, lowest free slot, -EMFILE, FD_CLOEXEC from O_CLOEXEC and FIOCLEX/FIONCLEX, FIONBIO), close releasing flock on the last slot and POSIX locks on any, open/openat with one dirfd resolution (#254)"
milestone = "M7"
tests = [
    "ktest:lumen_kernel::linux::process::process_starts_with_console_fds_and_root_cwd",
    "ktest:lumen_kernel::linux::process::process_close_releases_flock_on_last_slot_and_posix_locks_on_any",
    "ktest:lumen_kernel::linux::syscall::fd::fd_openat_takes_the_lowest_free_slot_and_refuses_past_1024",
    "ktest:lumen_kernel::linux::syscall::fd::fd_cloexec_follows_o_cloexec_and_fioclex",
    "ktest:lumen_kernel::linux::syscall::fd::fd_handlers_take_their_registers_in_order",
    "ktest:lumen_kernel::linux::syscall::at::at_start_dir_resolves_dirfd_with_its_traps",
    "ktest:lumen_kernel::linux::syscall::at::at_start_operations_run_from_their_start",
    "ktest:lumen_kernel::linux::syscall::fd::fd_open_relative_to_a_cwd_other_than_root",
    "ktest:lumen_kernel::vfs::procfs::procfs_fd_listing_and_targets_follow_the_fd_table",
    "scenario:test_linux_user::test_busybox_file_syscalls",
]

[[feature]]
name = "read/write/readv/writev/fstat/poll/ioctl/lseek on VFS files through the FD table (offsets across 4 KiB chunks, a fault mid-transfer returning what moved, O_APPEND through VfsInode::append, EOF, -EISDIR, -EBADF directions, -ENOTTY off terminals, -ESPIPE on them) and getcwd from the cwd inode (-ENOENT once unlinked), with M6 console stdio unchanged (#254)"
milestone = "M7"
tests = [
    "ktest:lumen_kernel::linux::syscall::fd::fd_read_write_readv_writev_and_fstat_on_a_file",
    "ktest:lumen_kernel::linux::syscall::fd::fd_transfers_span_chunks_and_stop_at_a_fault",
    "ktest:lumen_kernel::linux::syscall::fd::fd_cloexec_follows_o_cloexec_and_fioclex",
    "ktest:lumen_kernel::vfs::tests::vfs_append_writes_at_the_end_in_one_inode_lock_hold",
    "ktest:lumen_kernel::linux::syscall::fd::fd_o_append_from_every_cpu_through_two_open_files",
    "ktest:lumen_kernel::linux::syscall::fd::fd_offset_lock_is_held_across_reads_but_not_on_procfs",
    "cargo:lumen-vfs",
    "ktest:lumen_kernel::linux::syscall::fd::fd_poll_reports_files_ready_terminals_by_direction_and_the_rest_invalid",
    "ktest:lumen_kernel::linux::syscall::fd::fd_lseek_edges",
    "ktest:lumen_kernel::linux::syscall::dir::dir_getcwd_follows_the_cwd_inode_and_fails_once_unlinked",
    "scenario:test_linux_user::test_busybox_file_syscalls",
    "scenario:test_linux_user::test_static_busybox_ash",
    "scenario:test_linux_user::test_syscall_bad_pointers_return_efault",
]

[[feature]]
name = "fcntl (F_DUPFD/F_DUPFD_CLOEXEC lowest free at or above the minimum, F_GETFD/F_SETFD, F_GETFL/F_SETFL changing only O_APPEND and O_NONBLOCK, F_GETLK/F_SETLK/F_SETLKW POSIX record locks: conflicts with the owner's pid, -EAGAIN, range splitting, SEEK_CUR/SEEK_END and negative lengths, -EINVAL and -EOVERFLOW before the access-mode -EBADF, a blocked F_SETLKW woken by unlock, by a downgrade, by the holder closing any fd of the file, or by its exit, a release between its try and its wait not lost; -EDEADLK for a cycle of waiters and never from a view older than the last release) and flock (per open file description, shared by dups, LOCK_NB -EWOULDBLOCK, the operation checked before the fd and LOCK_MAND ignored, a blocked LOCK_EX woken by LOCK_UN, the last close, or exit, a blocked LOCK_SH by a downgrade; a blocking upgrade giving up its shared lock first), O_PATH refused (#254)"
milestone = "M7"
tests = [
    "ktest:lumen_kernel::linux::syscall::lock::lock_fcntl_dupfd_fd_flags_and_status_flags",
    "ktest:lumen_kernel::linux::syscall::lock::lock_fcntl_record_locks_check_modes_and_arguments",
    "ktest:lumen_kernel::linux::syscall::lock::lock_flock_belongs_to_the_open_file_description",
    "ktest:lumen_kernel::linux::syscall::lock::lock_fcntl_setlkw_blocks_until_unlock_close_or_exit",
    "ktest:lumen_kernel::linux::syscall::lock::lock_flock_blocks_until_unlock_last_close_or_exit",
    "ktest:lumen_kernel::linux::syscall::lock::lock_fcntl_getlk_sees_split_ranges_and_offsets_from_seek_cur_and_end",
    "ktest:lumen_kernel::linux::syscall::lock::lock_fcntl_setlkw_refuses_a_deadlock",
    "ktest:lumen_kernel::linux::syscall::lock::lock_flock_blocking_upgrade_gives_up_the_shared_lock_first",
    "ktest:lumen_kernel::linux::syscall::lock::lock_fcntl_setlkw_reader_woken_by_a_downgrade",
    "ktest:lumen_kernel::linux::syscall::lock::lock_flock_shared_waiter_woken_by_a_downgrade",
    "ktest:lumen_kernel::linux::syscall::lock::lock_fcntl_setlkw_sees_a_release_between_its_try_and_its_wait",
    "ktest:lumen_kernel::linux::syscall::lock::lock_fcntl_setlkw_retries_on_a_stale_view",
    "ktest:lumen_kernel::linux::process::process_close_releases_flock_on_last_slot_and_posix_locks_on_any",
    "cargo:lumen-vfs",
]

[[feature]]
name = "pread64/pwrite64 at a given offset without moving the fd's (across a page and over 4 KiB, a hole past EOF reading as zeros, O_APPEND appending whatever the offset, also across chunks, a fault mid-transfer returning what moved, a disk read error as -EIO, a full tmpfs as a short write then -ENOSPC; in Linux's errno order: -EINVAL negative offsets, -EBADF, -ESPIPE on terminals, -EBADF directions, -EFAULT outside user space, -EINVAL past i64::MAX, -EISDIR), fsync/fdatasync writing an ext4 file through the block cache to the device (-EIO when writes or the cache's sync fail, the data written by the next sync; 0 on an open unlinked file; -EINVAL on terminals, devices and procfs; -EBADF on O_PATH), sync flushing every mounted filesystem and returning 0 though one fails, a filesystem over-reporting a chunk taken as -EIO, and their dispatch registers (#254)"
milestone = "M7"
tests = [
    "ktest:lumen_kernel::linux::syscall::io::io_pread_pwrite_at_offsets_leave_the_offset_alone",
    "ktest:lumen_kernel::linux::syscall::io::io_pwrite_appends_on_o_append_and_positional_errnos",
    "ktest:lumen_kernel::linux::syscall::io::io_pread_pwrite_report_filesystem_errors",
    "ktest:lumen_kernel::linux::syscall::io::io_fsync_writes_an_ext4_file_back_and_reports_eio",
    "ktest:lumen_kernel::linux::syscall::io::io_fsync_refuses_terminals_devices_and_procfs",
    "ktest:lumen_kernel::linux::syscall::io::io_sync_flushes_every_mounted_filesystem",
    "ktest:lumen_kernel::linux::syscall::io::io_a_filesystem_reporting_more_than_its_chunk_is_eio",
]

[[feature]]
name = "stat/lstat/newfstatat/statx and access/faccessat/faccessat2 through one dirfd resolution (AT_SYMLINK_NOFOLLOW, AT_EMPTY_PATH naming the dirfd's file and a NULL path with it read as an empty one by newfstatat and statx, AT_NO_AUTOMOUNT and the statx sync bits ignored, statx's basic fields in stx_mask whatever was asked (-EINVAL for STATX__RESERVED or both sync bits), root's access rules with -EROFS for W_OK on a read-only mount, -EINVAL for bad flags or modes before the path, -ENOENT/-ENOTDIR/-ELOOP/-EFAULT/-EBADF/-ENAMETOOLONG) (#254)"
milestone = "M7"
tests = [
    "ktest:lumen_kernel::linux::syscall::stat::tests::stat_lstat_and_newfstatat_on_a_file_a_directory_and_a_symlink",
    "ktest:lumen_kernel::linux::syscall::stat::tests::stat_statx_mask_and_fields_agree_with_stat",
    "ktest:lumen_kernel::linux::syscall::stat::tests::stat_access_modes_follow_the_root_rules",
    "ktest:lumen_kernel::linux::syscall::stat::tests::stat_family_errnos",
    "ktest:lumen_kernel::linux::syscall::stat::tests::stat_handlers_take_their_registers_in_order",
    "scenario:test_linux_user::test_busybox_file_syscalls",
]
