# Features: Linux x86-64 user space and syscall ABI (M6+). See tests/features/README.md for the format.

[[feature]]
name = "linux-raw-sys 0.12.1 (MIT elected, zero transitive deps) pinned and linked into both kernels (#232) with the flag audit passing: all 30 M6 Linux x86-64 syscall numbers, core errno constants, terminal ioctl requests, arch_prctl FS codes, CLOCK_* IDs, and ABI struct sizes (`new_utsname`, `timespec`, `iovec`, `stat`, `termios`, `winsize`, `rlimit64`, `sigaction`) match ARCHITECTURE section 8"
milestone = "M6"
tests = [
    "ktest:lumen_kernel::linux::abi_constants_match_spec",
    "audit:flags",
]

[[feature]]
name = "Ring-3 entry/exit (`iretq` and `syscall`/`sysretq`), writable `PerCpu` + `TSS.rsp0`, conditional `SWAPGS` + guarded `IST_DEBUG = 4` (CVE-2018-8897 deferred `#DB` at `LSTAR` handoff), non-fatal ring-3 exceptions, canonical RIP and sanitized RFLAGS return validation, and `.lumen_fixup` fault-safe user copies (`copy_from_user`, `copy_to_user`, `copy_cstr_from_user`) with runtime-gated SMEP/SMAP (#236)"
milestone = "M6"
tests = [
    "ktest:lumen_kernel::arch::x86_64::syscall::syscall_msrs_are_programmed_on_all_cpus",
    "ktest:lumen_kernel::user::bad_user_pointer_returns_efault",
    "scenario:test_linux_user::test_ring3_entry_and_exit",
    "scenario:test_linux_user::test_user_fault_kills_process_not_kernel",
    "scenario:test_linux_user::test_non_canonical_sysret_does_not_crash_kernel",
    "audit:flags",
]

[[feature]]
name = "Per-thread user context switching (CR3, TSS.rsp0, PerCpu, IA32_FS_BASE TLS, and FXSAVE/XSAVE FPU state) preserving xmm0-xmm7 and %fs across concurrent same-CPU timer preemption (#237)"
milestone = "M6"
tests = [
    "ktest:lumen_kernel::mm::user_vm::lazy_zero_fill_and_unmap",
    "scenario:test_linux_user::test_bad_elf_rejected",
    "scenario:test_linux_user::test_mmap_and_brk",
    "scenario:test_linux_user::test_sse_and_tls_preserved_across_preemption",
    "audit:flags",
]

[[feature]]
name = "30-syscall Linux x86-64 ABI dispatcher, Limine boot-module loader (`linux` shell command), unmodified static `musl` `hello`, and unmodified Alpine static `musl` `busybox ash -s` built-ins with `-EFAULT` / `-ENOSYS` / `-EBADF` verification and zero frame leaks (#238)"
milestone = "M6"
tests = [
    "scenario:test_linux_user::test_syscall_bad_pointers_return_efault",
    "scenario:test_linux_user::test_static_musl_hello",
    "scenario:test_linux_user::test_static_busybox_ash",
    "audit:flags",
]

[[feature]]
name = "VFS-backed 1024-slot per-process FD table (console fds 0/1/2 on /dev/console, lowest free slot, -EMFILE, FD_CLOEXEC from O_CLOEXEC and FIOCLEX/FIONCLEX, FIONBIO), close releasing flock on the last slot and POSIX locks on any, open/openat with one dirfd resolution (#254)"
milestone = "M7"
tests = [
    "ktest:lumen_kernel::linux::process::process_starts_with_console_fds_and_root_cwd",
    "ktest:lumen_kernel::linux::process::process_close_releases_flock_on_last_slot_and_posix_locks_on_any",
    "ktest:lumen_kernel::linux::syscall::fd::fd_openat_takes_the_lowest_free_slot_and_refuses_past_1024",
    "ktest:lumen_kernel::linux::syscall::fd::fd_cloexec_follows_o_cloexec_and_fioclex",
    "ktest:lumen_kernel::linux::syscall::fd::fd_handlers_take_their_registers_in_order",
    "ktest:lumen_kernel::linux::syscall::at::at_start_dir_resolves_dirfd_with_its_traps",
    "ktest:lumen_kernel::linux::syscall::at::at_start_operations_run_from_their_start",
    "ktest:lumen_kernel::linux::syscall::fd::fd_open_relative_to_a_cwd_other_than_root",
    "ktest:lumen_kernel::vfs::procfs::procfs_fd_listing_and_targets_follow_the_fd_table",
    "scenario:test_linux_user::test_busybox_file_syscalls",
]

[[feature]]
name = "read/write/readv/writev/fstat/poll/ioctl/lseek on VFS files through the FD table (offsets across 4 KiB chunks, a fault mid-transfer returning what moved, O_APPEND through VfsInode::append, EOF, -EISDIR, -EBADF directions, -ENOTTY off terminals, -ESPIPE on them) and getcwd from the cwd inode (-ENOENT once unlinked), with M6 console stdio unchanged (#254)"
milestone = "M7"
tests = [
    "ktest:lumen_kernel::linux::syscall::fd::fd_read_write_readv_writev_and_fstat_on_a_file",
    "ktest:lumen_kernel::linux::syscall::fd::fd_transfers_span_chunks_and_stop_at_a_fault",
    "ktest:lumen_kernel::linux::syscall::fd::fd_cloexec_follows_o_cloexec_and_fioclex",
    "ktest:lumen_kernel::vfs::tests::vfs_append_writes_at_the_end_in_one_inode_lock_hold",
    "ktest:lumen_kernel::linux::syscall::fd::fd_o_append_from_every_cpu_through_two_open_files",
    "ktest:lumen_kernel::linux::syscall::fd::fd_offset_lock_is_held_across_reads_but_not_on_procfs",
    "cargo:lumen-vfs",
    "ktest:lumen_kernel::linux::syscall::fd::fd_poll_reports_files_ready_terminals_by_direction_and_the_rest_invalid",
    "ktest:lumen_kernel::linux::syscall::fd::fd_lseek_edges",
    "ktest:lumen_kernel::linux::syscall::dir::dir_getcwd_follows_the_cwd_inode_and_fails_once_unlinked",
    "scenario:test_linux_user::test_busybox_file_syscalls",
    "scenario:test_linux_user::test_static_busybox_ash",
    "scenario:test_linux_user::test_syscall_bad_pointers_return_efault",
]

[[feature]]
name = "getdents64, chdir and fchdir (#254): linux_dirent64 records (8-byte aligned, d_type from the inode type, . and ..) resuming at the open file's dir_cursor across small buffers with each entry once, d_off for seekdir, lseek rewinding, a partial fill stopping before the entry that doesn't fit, -EINVAL for a buffer too small for one, -EFAULT keeping the position, -EBADF/-ENOTDIR, ending while entries come and go; on tmpfs, ext4, /proc and /dev; chdir and fchdir (O_PATH, O_DIRECTORY) moving relative paths and getcwd"
milestone = "M7"
tests = [
    "ktest:lumen_kernel::linux::syscall::dir::dir_getdents64_lists_a_tmpfs_directory_exactly_once_across_small_buffers",
    "ktest:lumen_kernel::linux::syscall::dir::dir_getdents64_types_on_proc_dev_and_ext4",
    "ktest:lumen_kernel::linux::syscall::dir::dir_getdents64_refuses_bad_fds_buffers_and_small_counts",
    "ktest:lumen_kernel::linux::syscall::dir::dir_getdents64_ends_while_entries_come_and_go",
    "ktest:lumen_kernel::linux::syscall::dir::dir_chdir_then_a_relative_open_and_getcwd",
    "ktest:lumen_kernel::linux::syscall::dir::dir_fchdir_takes_plain_o_directory_and_o_path_fds",
    "ktest:lumen_kernel::linux::syscall::dir::dir_handlers_take_their_registers_in_order",
]
