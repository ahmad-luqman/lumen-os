# Features: WASM apps (M5). See tests/features/README.md for the format.

[[feature]]
name = "Apps build for wasm32-unknown-unknown with the pinned toolchain (`make build`: build/apps/<name>.wasm, the runtime's test apps build/apps/tests/<name>.wasm), as WASM modules using only rustc's default WASM features, importing only `lumen` functions, exporting a fixed `memory` and `lumen_main`, with a manifest"
milestone = "M5"
tests = [
    "harness:test_wasm_module::*",
]

[[feature]]
name = "wasmi 2.0.1 linked into both kernels (#197) with the flag audit passing: a 300k-iteration loop runs in fuel slices on a 64 KiB thread stack (out of fuel, suspended and resumed until it finishes, with the right result, resumed as many times as its fuel per iteration gives, with 100k- and 1000-fuel slices), wasmi's portable loop dispatch keeping the native stack's depth constant; a slice is topped up to what the next instruction needs (a bulk `memory.fill` costing more than a slice finishes after exactly one resume); functions are compiled with the module, so a body costing more than a slice to compile lazily still runs; recursion past wasmi's call depth traps (stack overflow, and nothing else), also after resumes, instead of overflowing the kernel stack; malformed modules (empty, cut short, bad magic or version, an unknown opcode, an ill-typed body) are refused, and a module importing a function fails to load (nothing defines one yet); float operations give the bits the host's hardware floats give under the kernel's soft-float (rounding, subnormals, infinities, signed zeros, round-half-even, u64 to f64, f64 to f32, comparisons with NaN, saturating truncation), the canonical NaN where wasm requires it and a quiet NaN from a signalling one, each operation checked on its own; the shell's `wasm` runs the loop and float checks in the booted kernel"
milestone = "M5"
tests = [
    "ktest:lumen_kernel::app::wasmi_runs_a_long_loop_in_fuel_slices",
    "ktest:lumen_kernel::app::a_slice_too_small_for_one_instruction_is_topped_up",
    "ktest:lumen_kernel::app::a_function_bigger_than_a_slice_compiles_and_runs",
    "ktest:lumen_kernel::app::malformed_modules_are_refused",
    "ktest:lumen_kernel::app::a_module_importing_a_function_fails_to_load",
    "ktest:lumen_kernel::app::wasm_floats_match",
    "scenario:test_wasm::test_wasm_command_runs_a_loop_in_fuel_slices",
    "audit:flags",
]

[[feature]]
name = "postcard 1.1.3 and serde 1.0.229, the app interface's wire format (section 8), in the ktest kernel with the flag audit's binary checks passing: a derived struct and enums encode to exactly the bytes postcard specifies (integers wider than a byte as varints, signed ones zigzagged, a u8 as its one byte, length-prefixed strings, an enum's declaration position, never its repr discriminant) and decode back with nothing left over; trailing bytes are left over for the caller, every cut of an encoding is DeserializeUnexpectedEnd, and a variant past the last is serde's refusal"
milestone = "M5"
tests = [
    "ktest:lumen_kernel::app::wire::postcard_round_trips_derived_types",
    "audit:flags",
]

[[feature]]
name = "WASM apps load and run within fixed limits (#199): `lumen-app-api`'s types (error codes, kinds and grants, the manifest parser, the limits with each app's worst case checked against the budget at compile time, the handle table, range checks, log text, end reasons); a module is refused at load, naming why, for an import beyond the `lumen` functions or with another signature, an imported memory, table or global, a second memory or table, a start section, a missing or mistyped `memory` or `lumen_main`, a memory that isn't fixed or is past its limit, a table past its limit, no manifest or two, a module too big, or invalid wasm, the heap left as it was; compiled code within its charge and a fixed memory allocated once, by the heap's high-water mark; `run` starts an app on its own thread in fuel slices, `apps` lists it with its slices growing, the shell answers meanwhile, and `run` refuses past the slots and never reuses an id"
milestone = "M5"
tests = [
    "cargo:lumen-app-api",
    "ktest:lumen_kernel::app::tests::load_refuses_bad_modules",
    "ktest:lumen_kernel::app::tests::compiled_code_fits_its_charge",
    "ktest:lumen_kernel::app::tests::a_fixed_memory_is_allocated_once",
    "scenario:test_apps::test_hello_wasm",
    "scenario:test_apps::test_busy_app_is_preempted",
    "scenario:test_apps::test_run_refuses_past_max_apps",
]

[[feature]]
name = "Host calls without a window and capability handles (#199): every call checks the kill flag, the handle and its kind, then its ranges, then its content, and writes nothing when it refuses; a grant `run --without` withholds is `NotGranted`, a made-up or closed handle `BadHandle`, a handle of another kind `WrongKind`, handles never reused; text past its cap, bad UTF-8, bad levels and negative sleeps are `BadArgument`; `trace_read` refuses bad streams, CPUs and sequence numbers and copies at most its cap, its header agreeing with what it copied; a log line is cut at 256 bytes on a char boundary and can't forge another line"
milestone = "M5"
tests = [
    "cargo:lumen-app-api",
    "ktest:lumen_kernel::app::tests::trace_read_edges",
    "scenario:test_apps::test_app_without_capability_is_not_granted",
    "scenario:test_apps::test_handles_refuse_wrong_kind_and_closed",
    "scenario:test_apps::test_host_calls_refuse_bad_arguments",
    "scenario:test_apps::test_app_log_is_cut_and_sanitised",
]

[[feature]]
name = "WASM apps end cleanly (#199): one end reason, the first recorded, and one end line; a trap, a panic (its message unable to forge a line), memory past its fixed limit and recursion past the call depth each end only the app with one WARN, the shell working and the heap given back; `kill` wakes an app blocked in `time_sleep`, ends it and its thread is joined; a reaper whose spawn failed is started by a later `run`, which joins the apps that ended meanwhile"
milestone = "M5"
tests = [
    "cargo:lumen-app-api",
    "ktest:lumen_kernel::app::tests::a_reaper_that_failed_to_start_is_started_by_a_later_run",
    "scenario:test_apps::test_app_trap_kills_app_not_kernel",
    "scenario:test_apps::test_kill_wakes_a_waiting_app",
]
