[[feature]]
name = "lumen-ui inside apps (#207): an app's toolkit (the SDK's, the kernel's own lumen-ui with the host's text) publishes its automation tree, which `ui tree` shows with global ids (two copies of one app never share one; a closed app's ids name nothing); `ui invoke` reaches an app's widgets as a click does, answered from the published tree after the effect is published, one request per window (a second refused busy while one is queued or running), a root action or a node not in the tree answered without the app, a window the action closed gone before the answer, an app ending mid-request answering `OwnerEnded`; the deepest tree allowed is published; trees and answers are checked wire types (every variant pinned, the tree's rules, sizes before decoding, capped sequences with a bounded heap peak, exact malformed-value errors, no panic on any cut or flipped byte) and cost fuel by the byte and the node (a refused tree's nodes too), within a measured heap charge"
milestone = "M5"
tests = [
    "cargo:lumen-app-api",
    "cargo:lumen-gfx",
    "ktest:lumen_kernel::app::window::one_request_per_window_is_refused_busy_until_answered",
    "ktest:lumen_kernel::app::window::an_app_ending_answers_owner_ended",
