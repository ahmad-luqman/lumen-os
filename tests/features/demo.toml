# Features: demo. See tests/features/README.md for the format.

[[feature]]
name = "Demo logic (lumen-demo, in the kernel with audit passing): the Mandelbrot set in fixed-point integers (agreeing with floating point but for boundary points; no overflow for any point, extreme screens' every pixel and i64's extremes included) and its colours; rows dealt to CPUs in bands, each once; Conway's Game of Life on a grid with a dead edge (the B3/S23 rules for every neighbour count, gliders and spaceships move, the glider gun fires every 30 generations, agreeing with an endless plane away from the edge) and its seed patterns (matching their published RLE, placed where they have room)"
milestone = "M2"
tests = [
    "cargo:lumen-demo",
    "audit:flags",
]

[[feature]]
name = "`mandelbrot` draws the set on the screen with the boot CPU alone, then with every CPU at once (row bands dealt round-robin to threads pinned to each CPU, each CPU drawing some, the same pixels, every thread joined before the screen is given back), prints both times and each CPU's rows, and gives the screen back on a key"
milestone = "M2"
tests = [
    "scenario:test_demo::test_mandelbrot_golden",
    "ktest:lumen_kernel::demo::every_cpu_rendered_rows",
]

[[feature]]
name = "`life [pattern] [generations]` runs Conway's Game of Life on the screen (glider, glider gun, lightweight spaceship, R-pentomino, acorn; default gun) with a status line: with a count, that many generations (a key ends it early) then held until a key; without, at most 20 a second until a key; each pattern's population matches an endless plane; a bad argument is named"
milestone = "M2"
tests = [
    "scenario:test_demo::test_life_glider_golden",
    "scenario:test_demo::test_life_runs_until_a_key",
    "scenario:test_demo::test_life_usage_names_the_bad_argument",
    "scenario:test_demo::test_every_pattern_runs_as_on_a_plane",
]
