# Features: ELF loading. See tests/features/README.md for the format.

[[feature]]
name = "Static ELF64 loader (ET_EXEC / PIE ET_DYN, W^X, RELRO shared 4 KiB boundary pages, AT_PHDR) and System V / musl initial user stack builder (16-byte alignment, auxv)"
milestone = "M6"
tests = [
    "cargo:lumen-elf",
]

[[feature]]
name = "Dynamic ELF64 PT_INTERP parser (optional single PT_INTERP, PATH_MAX/NUL/bounds/AT_PHDR validation, lifetime-free interp_path), ET_DYN interpreter validation (NestedInterp, min_vaddr load_bias), and dynamic AuxvInfo (AT_BASE) (#251)"
milestone = "M7"
tests = [
    "cargo:lumen-elf",
    "scenario:test_linux_user::test_bad_elf_rejected",
]

[[feature]]
name = "Dynamic ELF64 loader (#255): `linux /path` loads a binary from the VFS (symlinks followed; EACCES for a file without an execute bit, ENOMEM when the heap cannot hold it) and records the path for `/proc/<pid>/exe`, and one with `PT_INTERP` maps its interpreter, read through the VFS (ENOENT when absent, EACCES when not a regular file with an execute bit, ELIBBAD when not an ET_DYN or nested), at INTERP_BASE with AT_BASE its load bias, AT_PHDR/AT_ENTRY and brk the main binary's (brk stopping below the stack's guard page), and the interpreter's entry as the first instruction, refusing images that overlap each other, a binary reaching the stack or its guard page, or an interpreter not below that guard page, with no frames taken; Alpine's dynamic `/bin/busybox echo` runs off the ext4 rootfs through `/lib/ld-musl-x86_64.so.1`, and a static binary by path, with zero leaked frames"
milestone = "M7"
tests = [
    "ktest:lumen_kernel::linux::exec::dynamic_elf_maps_interp_and_sets_auxv",
    "ktest:lumen_kernel::linux::exec::dynamic_elf_layout_rejected",
    "ktest:lumen_kernel::linux::exec::missing_interpreter_is_enoent",
    "ktest:lumen_kernel::linux::exec::a_binary_the_heap_cannot_hold_is_enomem",
    "ktest:lumen_kernel::linux::linux_path_route_records_exe_path",
    "ktest:lumen_kernel::user::exe_path_reaches_the_process",
    "scenario:test_linux_user::test_dynamic_busybox_from_rootfs",
]

[[feature]]
name = "Dynamic musl program with a shared library loaded at run time (#255): `m7_test` runs off the ext4 rootfs through `/lib/ld-musl-x86_64.so.1`, which maps `libm7.so` from its descriptor for `dlopen`, `dlsym` finding its functions, `dlclose` returning 0, with zero leaked frames"
milestone = "M7"
tests = [
    "scenario:test_linux_user::test_dynamic_musl_binary_and_dlopen",
]
