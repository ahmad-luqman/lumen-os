# Features: ELF loading. See tests/features/README.md for the format.

[[feature]]
name = "Static ELF64 loader (ET_EXEC / PIE ET_DYN, W^X, RELRO shared 4 KiB boundary pages, AT_PHDR) and System V / musl initial user stack builder (16-byte alignment, auxv)"
milestone = "M6"
tests = [
    "cargo:lumen-elf",
]

[[feature]]
name = "Dynamic ELF64 PT_INTERP parser (optional single PT_INTERP, PATH_MAX/NUL/bounds/AT_PHDR validation, lifetime-free interp_path), ET_DYN interpreter validation (NestedInterp, min_vaddr load_bias), and dynamic AuxvInfo (AT_BASE) (#251)"
milestone = "M7"
tests = [
    "cargo:lumen-elf",
    "scenario:test_linux_user::test_bad_elf_rejected",
]

[[feature]]
name = "Dynamic ELF64 loader (#255): `linux /path` loads a binary from the VFS (symlinks followed), and one with `PT_INTERP` maps its interpreter, read through the VFS (ENOENT when absent, EACCES when not a regular file with an execute bit, ELIBBAD when not an ET_DYN or nested), at INTERP_BASE with AT_BASE its load bias, AT_PHDR/AT_ENTRY and brk the main binary's, and the interpreter's entry as the first instruction, refusing images that overlap each other or reach the stack's guard page with no frames taken; Alpine's dynamic `/bin/busybox echo` runs off the ext4 rootfs through `/lib/ld-musl-x86_64.so.1`, and a static binary by path, with zero leaked frames"
milestone = "M7"
tests = [
    "ktest:lumen_kernel::linux::dynamic_elf_maps_interp_and_sets_auxv",
    "ktest:lumen_kernel::linux::dynamic_elf_layout_rejected",
    "ktest:lumen_kernel::linux::missing_interpreter_is_enoent",
    "scenario:test_linux_user::test_dynamic_busybox_from_rootfs",
]
