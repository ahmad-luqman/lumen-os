# Features: kernel tracing. See tests/features/README.md for the format.

[[feature]]
name = "Lock-free trace ring buffer: boot phases, exceptions and log lines recorded"
milestone = "M1"
tests = [
    "cargo:lumen-trace",
    "ktest:lumen_kernel::trace::events_recorded_in_order",
    "ktest:lumen_kernel::trace::boot_phases_recorded_in_order",
    "ktest:lumen_kernel::trace::exceptions_and_logs_are_traced",
    "ktest:lumen_kernel::trace::trace_overhead_is_small",
    "scenario:test_trace::test_trace_command_shows_every_event_since_boot",
    "scenario:test_trace::test_trace_defaults_and_usage",
    "scenario:test_trace::test_exception_appears_in_trace",
    "scenario:test_crash::test_report_shows_the_trace_events_leading_up_to_it",
    "scenario:test_crash::test_panic_report_trace_ends_with_the_panic",
    "ktest:lumen_kernel::trace::describe_prints_unknown_values_raw",
]

[[feature]]
name = "X-ray's events in their own per-CPU trace rings: run-queue changes, device interrupts handled, locks that waited; either ring of an online CPU read since a sequence number with the gap counted; the main rings left alone"
milestone = "M5"
tests = [
    "cargo:lumen-trace",
    "ktest:lumen_kernel::trace::run_queue_changes_are_traced_in_order",
    "ktest:lumen_kernel::trace::a_contended_lock_is_traced",
    "ktest:lumen_kernel::trace::xray_events_leave_the_main_ring_alone",
    "ktest:lumen_kernel::trace::yielding_alone_records_no_run_queue_change",
    "ktest:lumen_kernel::trace::read_refuses_an_offline_cpu_and_a_since_ahead",
    "scenario:test_xray::test_run_queue_matches_trace",
    "scenario:test_xray::test_device_interrupts_are_traced",
]
