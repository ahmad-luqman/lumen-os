[[feature]]
name = "Mouse: QEMU's virtio tablet bound by class (input/other, so the virtio keyboard sharing its PCI id is never offered to it; another device of that class without absolute X and Y, QEMU's multitouch panel, is declined before the crate posts buffers), only the first tablet used (a second declined); its name and axis ranges read from its configuration and logged; moved and clicked through QMP, `mouse` reports the pixel aimed at (also the screen's corners), the buttons held and released, and the events and frames read (none ignored), as records too; before the first report it shows dashes; without a tablet it says so; evdev frames published whole at SYN_REPORT (each with its sequence number), SYN_DROPPED discarding its whole frame up to the next SYN_REPORT, wheels counting clicks both ways (also through QEMU), each button's presses counted so a click between two looks still shows, other events counted and ignored, axes scaled with rounding so every pixel the harness aims at comes back on any screen up to 32768 pixels (host-tested)"
milestone = "M3"
tests = [
    "cargo:lumen-input",
    "scenario:test_input::test_mouse_moves_pointer",
    "scenario:test_input::test_tablet_is_bound_and_the_keyboard_is_not",
    "scenario:test_input::test_mouse_without_a_tablet",
    "scenario:test_input::test_an_input_device_without_absolute_axes_is_declined",
]

[[feature]]
name = "The mouse pointer: an outlined arrow drawn with a save-under (golden), not drawn until the tablet reports, clipped at the screen's edges; the terminal's drawing (cells, scrolls of the screen and of a region, clears, full redraws, the header's boxes, the screen's bottom corner) takes it off where it would overlap and puts it back, so it survives redraws and leaves no trail (host-tested against a model screen with random drawing; a ktest compares the pixels with drawing everything afresh; a scenario moves it across text, the header and its boxes, types below it and compares screendumps with a fresh redraw); hidden while a command draws on the screen, back when it ends"
milestone = "M3"
tests = [
    "cargo:lumen-input",
    "ktest:lumen_kernel::term::the_pointer_survives_redraws_and_leaves_no_trail",
    "scenario:test_input::test_mouse_moves_pointer",
    "scenario:test_input::test_cursor_leaves_no_trail",
]

[[feature]]
name = "Mouse overruns and failure: with the `mouse` thread held (`mouse hold`, shown in `mouse`'s header and gone after `mouse release`, reading nothing until then; a hold needs a working tablet, one no thread answers is taken back (`NotParked`, logged once as an ERROR) or ends as soon as the tablet fails meanwhile (`Failed`), and a release and a hold back to back read nothing between (ktests on a made-up tablet); the header says `, held`, `, holding` until the thread parks, or nothing (ktest); hold and release are logged at INFO; `mouse` takes only `hold` or `release`), a burst of moves, or of 7-event frames (4 buttons and a move), fills the 32-buffer ring: QEMU keeps the frames that fit (10 moves, 4 with buttons) and drops each later one, traced at its send (no SYN_DROPPED), and released, the thread reads exactly the frames that fit in one batch, every event used, none ignored or dropped, and `mouse` counts one overrun, the warning naming that batch's events and the hold (a second held overflow counts a second, not warned: once per boot), the state stale until a later clean frame; frames hold one event per code the device advertises and the sync (12 on QEMU's tablet, as the boot line says), so a batch of 21 or more of 32 counts, which the 7-event frames tell from moves' 3; the bound from EV_BITS (frame types only), a bound of the ring's size or more (every non-empty batch counts, an empty one never), and what counting guarantees (lumen_input::may_have_lost_frames, checked by a model of QEMU's ring with its preconditions) are host-tested; a failed tablet's `mouse` header gives every count and why, its row the last position with no pointer, stale and the reason (ktest on a built state: QEMU can't make the device fail)"
milestone = "M3"
tests = [
    "cargo:lumen-input",
    "scenario:test_input::test_a_burst_of_moves_counts_overruns[*]",
    "scenario:test_input::test_mouse_hold_needs_a_tablet_and_takes_one_word",
    "ktest:lumen_kernel::mouse::a_hold_needs_a_working_tablet",
    "ktest:lumen_kernel::mouse::a_hold_that_no_thread_answers_is_taken_back",
    "ktest:lumen_kernel::mouse::a_release_and_a_hold_back_to_back_read_nothing_between",
    "ktest:lumen_kernel::shell::sysinfo::mouse_shows_a_failed_tablet_and_its_counts",
    "scenario:test_ktest::test_in_kernel_tests_pass",
]

[[feature]]
name = "MSI vectors handed out by an allocator (lowest free first, each with its handler, in a table of its own beside the I/O APIC's): a claimed vector arriving through the local APIC runs its handler and is EOI'd, not counted as unexpected; the next claim gets the next vector"
milestone = "M3"
tests = [
    "ktest:lumen_kernel::interrupts::a_claimed_msi_vector_runs_its_handler",
    "scenario:test_ktest::test_in_kernel_tests_pass",
]

[[feature]]
name = "MSI-X for PCI devices (lumen-pci): the capability's table and pending-bit-array locations (BAR indicator in the low 3 bits, the rest the offset), table size (1 to 2048 entries) and entry offsets; a reserved BAR indicator (6, 7) refused; Message Control enabled with Function Mask cleared, the rest kept, written into the capability's first dword with its id and next pointer as read; an entry's message for fixed delivery of a vector to one local APIC (0xfee00000 with the APIC id in bits 12-19, the vector as data, edge triggered), its mask bit, and its writes in order (masked first, then the message); entries deliver only with Enable set and Function Mask clear; only an MSI-X capability (its id read in configuration space) is read as one; the pending bit array's length (a bit per entry, in 64-bit words); NO_VECTOR is 0xffff; a virtio structure overlapping the MSI-X table or pending bit array is refused (`caps::check`)"
milestone = "M3"
tests = [
    "cargo:lumen-pci",
]

[[feature]]
name = "MSI-X for a claimed function (`DeviceResources::msix`): an IDT vector claimed with the handler, table entry 0 programmed masked with a message to the boot CPU's local APIC, MSI-X Enable set with Function Mask clear, INTx-disable set; once per function (a second call is AlreadyAllocated, and a decline after it is recorded as failed); its `MsiVector` unmasks (read back) and masks the entry (listings get a read-only record)"
milestone = "M3"
tests = [
    "ktest:lumen_kernel::pci::msix::msix_is_programmed_masked_once_per_function",
    "scenario:test_ktest::test_in_kernel_tests_pass",
]

[[feature]]
name = "Interrupts for virtio devices through MSI-X: the transport gets the function's vector at the first queue set up (a device declined after its transport but before any queue has none), maps configuration changes and each queue to its table entry (read back for `msix_config` and queue 0's `queue_msix_vector`: 0) and unmasks it; it hides RING_EVENT_IDX, which QEMU offers, so no driver negotiates it; virtio-rng's vector fires and its handler runs when a request comes back (MSI-X on, INTx off), the tablet's when a QMP move comes in, and sound's periods come back by it with no underrun, none of them reported missed; a device without an MSI-X capability fails its probe (`virtio-rng: failed: MSI-X: no MSI-X capability`, a warning naming the device), and one that refuses its entry (NO_VECTOR read back, for configuration changes or a queue) fails it saying which (`lspci`), no polling fallback; a probe that fails another way after a refusal keeps it in its reason (`... (after MSI-X: ...)`); `irqs` lists each vector as `msix <pci address> #0` with a count that goes up with each request, and no MSI vector shows unclaimed"
milestone = "M3"
tests = [
    "ktest:lumen_kernel::interrupts::msix_vector_delivered",
    "ktest:lumen_kernel::drivers::a_refused_vector_fails_the_probe",
    "ktest:lumen_kernel::drivers::a_probe_failing_otherwise_keeps_the_vector_problem_in_its_reason",
    "ktest:lumen_kernel::drivers::ring_event_idx_is_hidden_from_the_crate",
    "ktest:lumen_kernel::drivers::probing_records_each_outcome",
    "scenario:test_ktest::test_in_kernel_tests_pass",
    "scenario:test_dev::test_a_virtio_rng_without_msix_fails_its_probe",
    "scenario:test_shell::test_irqs_lists_msix",
    "scenario:test_input::test_a_pointer_move_raises_the_tablets_interrupt",
    "scenario:test_sound::test_tone_is_captured",
    "scenario:test_sound::test_a_long_tone_plays_without_underrun",
    "scenario:test_dev::test_random_with_only_virtio_rng",
]

[[feature]]
name = "A missed MSI-X interrupt is noticed: a wait that blocked to its deadline with no ring, after which the device had answered with the ring count unchanged, counts a miss (`MissedRule`, one rule for `wait_for` and the tablet's loop); a ring after the silent deadline, or a block a ring ended, isn't one, and an answer counts once; a ring during a wait's first look ends it at once with no miss (the ring count is read before looking); the first miss warns, naming the device (`<addr>: the device answered but its MSI-X interrupt never came (said once)`), every miss counts"
milestone = "M3"
tests = [
    "ktest:lumen_kernel::virtio::a_missed_interrupt_is_an_answer_after_a_silent_deadline_with_no_ring",
    "ktest:lumen_kernel::virtio::transport_brings_up_a_virtio_device_through_the_hal",
    "scenario:test_ktest::test_in_kernel_tests_pass",
]
