# Features: devices (PCI, drivers). See tests/features/README.md for the format.

[[feature]]
name = "PCI configuration space through ECAM: each MCFG entry judged on its own (a base that is 0 or not 1 MiB aligned, buses backwards, a range not ending below 2^64, buses overlapping an accepted entry, or past the first 256: refused with its reason, the others kept; a partial entry at the end refuses the whole table), q35's one region for segment 0's 256 buses found at boot where the pinned OVMF puts it (0xe0000000), mapped once uncached, reading back what enumeration found, an absent function reading as all ones; ECAM offsets counted from a region's first bus"
milestone = "M3"
tests = [
    "cargo:lumen-acpi",
    "cargo:lumen-pci",
    "ktest:lumen_kernel::acpi::info_copies_what_q35_describes",
    "ktest:lumen_kernel::pci::ecam_is_mapped_uncached_and_reads_what_enumeration_found",
]

[[feature]]
name = "PCI decoding and enumeration (lumen-pci): header fields, BARs sized with I/O and memory decoding off and the command register, the status register left alone (its write-one-to-clear bits written as 0) and every BAR restored (a host bridge's decoding left on; ISA and PCI-to-PCI bridges' turned off), 32- and 64-bit memory BARs (also 8 GiB above 4 GiB), 16- and 32-bit I/O BARs; unimplemented BARs left out, unassigned ones (at 0, 32- or 64-bit) kept with their size, malformed ones (reserved type, 64-bit in the last slot, I/O past port 0xffff, ending at 2^64) marked; a bridge's 2 BARs, its bus numbers and no subsystem; a CardBus bridge's BARs and capability pointer not decoded; an unknown header type's capabilities not read and not probeable; the capability list in order (reserved pointer bits masked), a looping chain or a pointer into the header cut off and marked, the longest clean list complete; a brute-force scan of every bus in the range, functions 1-7 only behind a multi-function function 0 (decoded like a single-function one); each problem (incomplete capability list, unassigned or malformed BAR, a bridge with no secondary bus, bus numbers that don't fit its bus or run backwards, or buses outside ECAM) named in a host-tested warning; a BAR slot says why it is empty (out of range, not implemented, a 64-bit BAR's upper half); q35's chipset found at boot in address order with no problems"
milestone = "M3"
tests = [
    "cargo:lumen-pci",
    "ktest:lumen_kernel::pci::q35s_chipset_is_found",
]

[[feature]]
name = "The BAR registry records every memory BAR found at boot (one slot per function, in address order), nothing mapped for a function nobody claimed, and maps one only when asked: once (the same mapping again, one more BAR mapped), uncached, to its physical address, looked up without mapping before and after; a BAR that can't be mapped is refused naming the function, the BAR and why (out of range, no such function, I/O, not implemented)"
milestone = "M3"
tests = [
    "ktest:lumen_kernel::pci::the_registry_records_every_memory_bar_and_maps_each_once",
]

[[feature]]
name = "`lspci` lists exactly the PCI functions QEMU reports (address, vendor and device ids in four hex digits) with class and device names, every virtio device the harness attaches by name (modern and transitional ids), devices behind a PCIe root port too, the boot log counting them and QEMU's memory BARs and logging each at debug level; its records filter and select (`lspci | where vendor = 0x1af4 | count`, hex values only); without ACPI there is no MCFG, so no PCI devices, with a warning and the reason in `lspci`'s header (and, in a pipeline, a note line before the result)"
milestone = "M3"
tests = [
    "scenario:test_pci::test_lspci_lists_virtio_devices",
    "scenario:test_pci::test_lspci_records_filter",
    "scenario:test_pci::test_lspci_sees_devices_behind_a_bridge",
    "scenario:test_pci::test_each_function_is_logged_at_debug_level",
    "scenario:test_pci::test_no_acpi_means_no_pci_devices",
    "ktest:lumen_kernel::pci::the_status_says_why_there_are_no_devices",
    "ktest:lumen_kernel::shell::sysinfo::every_record_table_fits_its_columns",
    "ktest:lumen_kernel::shell::sysinfo::system_commands_print_a_header_and_rows",
    "cargo:lumen-shell",
]

[[feature]]
name = "Claiming a PCI function for a driver: a function enumeration didn't find is refused; once per claim (a second claim is refused, saying who has it, and leaves that as it was), every memory BAR mapped, then memory space and bus master on and I/O space off in the command register (from a device left decoding I/O only); a function whose BAR can't be mapped (QEMU's VGA, whose framebuffer the HHDM maps) is refused naming the BAR, the range and the error, and recorded as not probed by that driver (`lspci`: `<driver>: not probed: <reason>`); `probe_all`'s loop offers each function to the matching driver rows in order, logs `probing <driver> on <addr>`, and records the outcome: a row that declines frees the function with its command register restored (`lspci`: `no driver (<driver> declined it)`) and the next row is offered it; a probe that declines but kept its resources is recorded as failed; a failed probe is a warning and `<driver>: failed: <reason>` with bus mastering turned off; a probe that brought up a transport whose device isn't ready (FEATURES_OK clear) is failed even though it returned Ok; one that keeps a running device is bound; DMA runs a failed or declined probe left are reported per probe attempt (a declined row's not charged to the next row, runs outside a probe not charged at all); a claimed function isn't offered again; a summary counts bound, failed, declined and refused; how `lspci` shows each binding"
milestone = "M3"
tests = [
    "ktest:lumen_kernel::virtio::a_claimed_device_has_memory_space_and_bus_master_on_and_io_off",
    "ktest:lumen_kernel::virtio::a_claim_that_cant_map_a_bar_is_refused_and_recorded",
    "ktest:lumen_kernel::drivers::probing_records_each_outcome",
    "scenario:test_ktest::test_in_kernel_tests_pass",
]

[[feature]]
name = "virtio DMA owned by the frame allocator (virtio-drivers' Hal): `dma_alloc` gives zeroed (also after the frames were dirtied), contiguous frames the allocator handed out (not reserved), recorded in the table of outstanding runs, nothing for 0 pages, and `dma_dealloc` frees exactly that run (a wrong length, an address inside the run where no run starts, a wrong virtual address or a second free refused, freeing nothing, each logged with why); a run comes back only as what it was handed out as (a DMA run of its pages, or a bounce run of its length), and runs handed out during a probe attempt are counted as that attempt's and its function's; shared buffers are bounced through fresh runs: a heap buffer straddling a page boundary reaches the device as one contiguous copy (and isn't copied back), a buffer from the device starts zeroed and is copied back, a page takes one frame, a page and a byte two, two pages and a byte three, an empty buffer one, and every bounce run is freed"
milestone = "M3"
tests = [
    "ktest:lumen_kernel::virtio::dma_frames_are_owned_and_freed",
    "ktest:lumen_kernel::virtio::a_run_comes_back_only_as_what_it_was_handed_out_as",
    "ktest:lumen_kernel::virtio::share_bounces_a_buffer_across_pages",
    "scenario:test_ktest::test_in_kernel_tests_pass",
]

[[feature]]
name = "The virtio adapter: a claimed virtio PCI device (QEMU's virtio-blk) is brought up through `PciTransport` on the function's own configuration space and the Hal's BAR lookups, after checking that the first virtio capability of each type 1-4 (common, notify, ISR, device; length field 16, notify 20) lies inside a mapped memory BAR, is as long as what the crate maps there, and that the capabilities the crate reads fit the 256-byte header, and then that each queue's notify register is inside the notify structure (host-tested: QEMU's layout accepted; an unmapped or out-of-range BAR, a structure past its BAR's end or 4 GiB, one too short, a capability near the header's end, a notify register past the structure, odd lengths included, refused, the message naming the queue, its notify offset and multiplier; skipped and duplicate capabilities ignored as the crate does; writes inside the MSI and MSI-X capabilities found); its device status handle reads what the transport does; `check_ready` wants FEATURES_OK and DRIVER_OK without DEVICE_NEEDS_RESET or FAILED, its message naming what is missing; a bounded wait returns when ready (re-polling, and once more at the deadline), after at least its timeout (with the time and status), or when the status shows DEVICE_NEEDS_RESET or FAILED; dropping the transport of a running device resets it (no reset failure logged)"
milestone = "M3"
tests = [
    "cargo:lumen-pci",
    "ktest:lumen_kernel::virtio::transport_brings_up_a_virtio_device_through_the_hal",
    "scenario:test_ktest::test_in_kernel_tests_pass",
]

[[feature]]
name = "`lspci`'s driver column: with every virtio device attached, only virtio-rng shows a driver (`virtio-rng: bound`), every other function `no driver`, and boot reports one device bound and none failed, declined or refused; the column filters like the others"
milestone = "M3"
tests = [
    "scenario:test_pci::test_lspci_shows_no_driver",
]

[[feature]]
name = "Randomness pool (lumen-rand): ChaCha20's block function matches RFC 8439 (section 2.3.2 and appendix A.1), its keystream comes out in block order whatever the pieces it is read in (the block number carrying into the nonce past 2^32), handed-out bytes aren't kept; the pool hands out nothing until 32 bytes are mixed in, every input byte, its order and a short last chunk change the output, the same input gives the same output, each stream differs from the next and from the pool's key (fast key erasure), mixing after a stream changes the next one, and 1 MiB of output is balanced (byte chi-square, bit count)"
milestone = "M3"
tests = [
    "cargo:lumen-rand",
]

[[feature]]
name = "Randomness from RDRAND and virtio-rng: each source alone (the default CPU with virtio-rng, `cpu=max` without it) and both give `random` output that differs call to call, boot to boot, and across a 4096-byte run; boot logs the sources; with neither, boot says so (info, not a warning) and `random` (and rhai's `random()`) refuse saying why; `random`'s usage (1 to 4096 bytes); the virtio-rng device shows `virtio-rng: bound` in `lspci` and boot reports it bound; in-kernel: a request over a page (two chunks, both written) leaves the DMA run table as it was, each `fill` asks virtio-rng unless another caller has it (then skipped and counted, the probe-seeded pool still answering), `rng::below` stays below its bound and reaches every value"
milestone = "M3"
tests = [
    "scenario:test_dev::*",
    "ktest:lumen_kernel::rng::*",
]
