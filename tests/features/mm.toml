[[feature]]
name = "File-backed VM core, in-kernel API (#255): AddressSpace::mmap_file (lazy; PROT_WRITE on a MAP_SHARED mapping without VM_MAYWRITE EACCES; non-mappable files ENODEV); MAP_SHARED faults mapping the page cache's own frame, coherent both ways with read_at/write_at, read-only until a store, then counted by a WritableMap guard whose count alone carries stores through syncs while mapped; MAP_PRIVATE copy-on-write isolated from the file and other mappings, zero past EOF in a partial last page; a store after a truncate mapping or copying the file's current page; a bus error past EOF or on a failed disk read (UserExit::BusError for ring 3, -EFAULT for a kernel user copy); a mapping outliving close and unlink (detached inode); shared stores reaching the disk after unmap and reclaim; invalidate_file_from unmapping exactly the pages past a new end; private copies freed by invalidate_file_from, teardown and Drop, cache frames never freed by munmap, teardown or Drop; writable_maps back to 0 after mprotect (which keeps the pins, PROT_NONE included), munmap, MAP_FIXED, brk, teardown and Drop, and pins dropped after all but mprotect; mapped files' references dropped after the last VMA; each page's clear, flush and release recorded in that order for mprotect, munmap and invalidate_file_from; a page the tmpfs quota refuses a bus error, warned once per streak for ring 3 and never for a kernel copy. Run on tmpfs and ext4, except the sync and persistence tests and the disk-read error (ext4 only) and the release-order, ring-3 and quota tests (tmpfs only)"
milestone = "M7"
tests = [
    "ktest:lumen_kernel::mm::user_vm::file_vm_shared_mapping_is_coherent_both_ways",
    "ktest:lumen_kernel::mm::user_vm::file_vm_private_mapping_copies_on_write",
    "ktest:lumen_kernel::mm::user_vm::file_vm_refuses_writes_without_may_write_and_unmappable_files",
    "ktest:lumen_kernel::mm::user_vm::file_vm_fault_past_eof_is_a_bus_error",
    "ktest:lumen_kernel::mm::user_vm::file_vm_disk_read_error_is_a_bus_error",
    "ktest:lumen_kernel::mm::user_vm::file_vm_shared_stores_persist_through_unmap_reclaim_and_remount",
    "ktest:lumen_kernel::mm::user_vm::file_vm_shared_stores_reach_the_disk_through_syncs_while_mapped",
    "ktest:lumen_kernel::mm::user_vm::file_vm_invalidate_file_from_unmaps_exactly_the_pages_past_the_new_end",
    "ktest:lumen_kernel::mm::user_vm::file_vm_writable_maps_balance_through_mprotect_unmap_and_teardown",
    "ktest:lumen_kernel::mm::user_vm::file_vm_ring3_bus_error_ends_the_process",
    "ktest:lumen_kernel::mm::user_vm::file_vm_mapping_outlives_close_and_unlink",
    "ktest:lumen_kernel::mm::user_vm::file_vm_private_copy_of_the_last_page_stops_at_eof",
    "ktest:lumen_kernel::mm::user_vm::file_vm_store_after_a_truncate_maps_the_files_current_page",
    "ktest:lumen_kernel::mm::user_vm::file_vm_unmap_releases_after_clearing_and_flushing",
    "ktest:lumen_kernel::mm::user_vm::file_vm_refused_page_is_a_bus_error_warned_once_per_streak",
    "ktest:lumen_kernel::vfs::page_cache::mapped_page_copies_to_a_frame_under_the_cache_lock",
]

[[feature]]
name = "File-backed mmap from ring 3 (#255): a dynamic musl program's MAP_SHARED mapping agrees with pread and pwrite both ways; MAP_PRIVATE stores stay the mapping's (the file and a shared mapping unchanged, a later pwrite not reaching the copied page); an O_RDONLY descriptor's MAP_SHARED mapping refused PROT_WRITE (mmap and mprotect EACCES) where a private one may become writable; ftruncate shrinking a mapped file unmaps the page past the new end (regrown, it reads zeroes through the mapping), and touching a mapped page truncated away is a bus error (exit 135, cr2 that page, its frame freed); every other run leaks zero frames"
milestone = "M7"
tests = [
    "scenario:test_linux_user::test_dynamic_musl_binary_and_dlopen",
]
