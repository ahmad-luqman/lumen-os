# Features: memory management. See tests/features/README.md for the format.

[[feature]]
name = "Physical frame allocator from the Limine map, never returns reserved frames"
milestone = "M1"
tests = [
    "cargo:lumen-mm",
    "ktest:lumen_kernel::mm::frame::never_returns_reserved",
    "ktest:lumen_kernel::mm::frame::live_memory_oracle_detects_a_leak",
    "ktest:lumen_kernel::mm::frame::bad_frame_detects_reserved_frames",
    "ktest:lumen_kernel::mm::frame::named_reservations_are_complete",
    "ktest:lumen_kernel::mm::frame::translate_agrees_with_the_hhdm",
    "ktest:lumen_kernel::mm::frame::alloc_free_reuse",
    "scenario:test_mm::test_frame_allocator_summary_logged",
]

[[feature]]
name = "Kernel page tables: W^X kernel image (per page and per frame), HHDM, map/unmap, uncached MMIO; #PF reports show the page walk"
milestone = "M1"
tests = [
    "cargo:lumen-mm",
    "ktest:lumen_kernel::mm::paging::map_unmap_roundtrip",
    "ktest:lumen_kernel::mm::paging::map_and_unmap_refuse_what_they_dont_own",
    "ktest:lumen_kernel::mm::paging::kernel_text_not_writable",
    "ktest:lumen_kernel::mm::paging::no_page_is_writable_and_executable",
    "ktest:lumen_kernel::mm::paging::hhdm_maps_exactly_the_hhdm_types",
    "ktest:lumen_kernel::mm::paging::tables_are_ours_and_allocated",
    "ktest:lumen_kernel::mm::paging::pat_holds_the_memory_types_we_use",
    "ktest:lumen_kernel::mm::paging::framebuffer_is_write_combining",
    "ktest:lumen_kernel::mm::paging::mmio_maps_the_rsdp_uncached",
    "ktest:lumen_kernel::mm::paging::walk_reports_each_level",
    "ktest:lumen_kernel::mm::paging::crash_walk_stops_at_unreadable_tables_without_locks",
    "ktest:lumen_kernel::mm::paging::preflight_detects_each_kind_of_mismatch",
    "scenario:test_mm::test_kernel_page_tables_active",
    "scenario:test_mm::test_write_to_text_crashes_cleanly",
    "scenario:test_mm::test_nx_data_crashes_cleanly",
    "scenario:test_crash::test_page_fault_report_names_address_and_cause",
]

[[feature]]
name = "Kernel heap with working free (GlobalAlloc): reuse, coalescing, growth in the heap window with rollback; OOM, a double free and a corrupt free list end in a crash report showing the heap"
milestone = "M1"
tests = [
    "cargo:lumen-heap",
    "ktest:lumen_kernel::mm::heap::reuse_after_free",
    "ktest:lumen_kernel::mm::heap::fragmentation_stress",
    "ktest:lumen_kernel::mm::heap::vec_and_box_work",
    "ktest:lumen_kernel::mm::heap::growth_failure_rolls_back",
    "ktest:lumen_kernel::mm::heap::crash_stats_never_block",
    "ktest:lumen_kernel::mm::heap::growth_errors_are_classified",
    "ktest:lumen_kernel::mm::heap::growth_is_geometric",
    "ktest:lumen_kernel::mm::heap::small_growth_when_frames_are_scarce",
    "ktest:lumen_kernel::mm::paging::hhdm_maps_exactly_the_hhdm_types",
    "scenario:test_mm::test_kmon_heap_reports_usage",
    "scenario:test_mm::test_out_of_memory_report_shows_the_heap",
    "scenario:test_mm::test_double_free_is_refused",
    "scenario:test_mm::test_corrupt_free_list_is_a_crash_not_a_hang",
    "scenario:test_crash::test_page_fault_report_names_address_and_cause",
]

[[feature]]
name = "Kernel stacks from the allocator with guard pages (main and IST stacks, no static stacks); an overflow is reported as one"
milestone = "M1"
tests = [
    "cargo:lumen-mm",
    "ktest:lumen_kernel::mm::stack::guard_page_unmapped",
    "ktest:lumen_kernel::mm::stack::ist_stacks_are_guarded",
    "ktest:lumen_kernel::mm::stack::kernel_runs_on_a_guarded_main_stack",
    "ktest:lumen_kernel::mm::paging::hhdm_maps_exactly_the_hhdm_types",
    "ktest:lumen_kernel::mm::frame::live_memory_oracle_detects_a_leak",
    "scenario:test_mm::test_stack_overflow_hits_guard",
    "scenario:test_mm::test_touching_a_guard_page_is_named",
    "ktest:lumen_kernel::mm::stack::a_full_registry_leaves_nothing_behind",
    "scenario:test_crash::test_fault_produces_symbolized_report[*]",
]
