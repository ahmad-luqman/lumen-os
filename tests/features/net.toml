# Features: networking, the socket ABI and AF_UNIX sockets. See tests/features/README.md for the format.

[[feature]]
name = "Socket ABI: sockaddr, cmsg and option values (logic)"
milestone = "M9"
tests = ["cargo:lumen-sockabi"]

[[feature]]
name = "AF_UNIX stream and datagram queues (logic)"
milestone = "M9"
tests = ["cargo:lumen-unix"]

[[feature]]
name = "smoltcp linked into both kernels (binary checks on both ELFs; IR checks on the kernel crate and the smoltcp generics it instantiates); TCP handshake and tagged reply over IPv4/IPv6 loopback; make rejects SMOLTCP_* overrides"
milestone = "M9"
tests = [
    "audit:flags",
    "ktest:lumen_kernel::ktest::smoltcp_links_and_echoes_over_loopback",
    "harness:test_audit::test_smoltcp_requires_a_defined_elf_symbol",
    "harness:test_audit::test_smoltcp_requires_an_ir_definition",
    "harness:test_audit::test_audit_requires_smoltcp_in_each_elf_and_kernel_ir[*]",
    "harness:test_audit::test_make_rejects_smoltcp_environment_overrides[*]",
    "harness:test_audit::test_emit_kernel_ir_rejects_smoltcp_environment_overrides[*]",
    "harness:test_audit::test_cargo_config_has_no_smoltcp_overrides",
]

[[feature]]
name = "Socket file object, sockfs (0:8), and generic SockOps syscall dispatch (test SockOps)"
milestone = "M9"
tests = [
    "ktest:lumen_kernel::net::sock::socket_and_socketpair_dispatch_by_family",
    "ktest:lumen_kernel::net::sock::socket_io_and_poll_reach_sockops",
    "ktest:lumen_kernel::net::sock::socket_names_accept_and_options",
    "ktest:lumen_kernel::net::sock::socket_sendmsg_rights_and_flock",
    "ktest:lumen_kernel::net::sock::socket_recvmsg_control_and_block_on",
]

[[feature]]
name = "TCP and UDP socket semantics over smoltcp (logic)"
milestone = "M9"
tests = ["cargo:lumen-net"]

[[feature]]
name = "virtio-net: fixed DMA frame buffers, ARP to slirp, RX repost and TX reclamation"
milestone = "M9"
tests = [
    "scenario:test_net::test_virtio_net_frames",
    "ktest:lumen_kernel::net::virtio_net::virtio_net_fills_and_reclaims_all_slots_without_dma_allocation",
    "ktest:lumen_kernel::virtio::dma_subranges_share_without_bouncing_or_freeing_the_owner",
]

[[feature]]
name = "virtio-net failed status: counted drops, one warning per outage, link recovery after successful transmit (status seam)"
milestone = "M9"
tests = ["ktest:lumen_kernel::net::virtio_net::virtio_net_failure_counts_drops_and_recovers_on_transmit"]

[[feature]]
name = "virtio-net caller errors preserve health; malformed RX completions drop, repost and continue to a maximum-length frame (completed-buffer seam)"
milestone = "M9"
tests = [
    "ktest:lumen_kernel::net::virtio_net::virtio_net_oversized_transmit_preserves_health",
    "ktest:lumen_kernel::net::virtio_net::virtio_net_receive_skips_bad_completions_and_reposts",
]

[[feature]]
name = "virtio-net RX skip budget requests another poll; empty completion source does not (completed-buffer metadata seam)"
milestone = "M9"
tests = ["ktest:lumen_kernel::net::virtio_net::virtio_net_receive_budget_rings_for_another_poll"]

[[feature]]
name = "Network stack worker: IPv4/IPv6 loopback TCP, readiness after unlocking, listener refill and socket limits"
milestone = "M9"
tests = [
    "cargo:lumen-net",
    "ktest:lumen_kernel::net::stack::loopback_tcp_echo_through_the_net_thread",
    "ktest:lumen_kernel::net::stack::readiness_notifies_after_the_stack_lock",
    "ktest:lumen_kernel::net::stack::listen_pool_refills_between_polls",
    "ktest:lumen_kernel::net::stack::socket_limits_give_enobufs",
    "ktest:lumen_kernel::linux::syscall::poll::poll_masks_of_each_file_kind",
    "scenario:test_net::test_virtio_net_frames",
    "scenario:test_net::test_net_without_entropy_keeps_raw_diagnostics",
]

[[feature]]
name = "Stack review regressions: deadlines survive failed Ethernet, refill failures recover by episode, stale registrations cannot replace live sockets, and selftest keeps failure reasons"
milestone = "M9"
tests = [
    "cargo:lumen-net",
    "ktest:lumen_kernel::net::stack::loopback_time_wait_expires_with_unusable_ethernet",
    "ktest:lumen_kernel::net::stack::refill_failures_warn_once_per_episode_and_recover",
    "ktest:lumen_kernel::net::stack::recycled_socket_registration_preserves_the_new_generation",
    "ktest:lumen_kernel::net::virtio_net::stack_selftest_preserves_failure_reasons",
    "scenario:test_net::test_virtio_net_frames",
    "scenario:test_net::test_net_without_entropy_keeps_raw_diagnostics",
]

[[feature]]
name = "Network idle wait bounds a silent device without delaying earlier timers (made-up deadlines)"
milestone = "M9"
tests = ["ktest:lumen_kernel::net::stack::idle_wait_preserves_earlier_timers_and_bounds_silent_devices"]
