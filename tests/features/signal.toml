[[feature]]
name = "POSIX signal logic (sets, actions, x86-64 frames, sigreturn checks)"
milestone = "M8"
tests = ["cargo:lumen-signal"]

[[feature]]
name = "Signal delivery, alternate stacks, sigreturn and faults as signals"
milestone = "M8"
tests = ["scenario:test_linux_proc::test_signals_and_sigaltstack[*]", "ktest:lumen_kernel::linux::signal::frame::signal_frames_restore_registers_masks_and_restart_once", "ktest:lumen_kernel::linux::signal::frame::stack_and_simd_exceptions_map_to_signals", "ktest:lumen_kernel::linux::process::signal::signal_send_refuses_unlinked_tid_and_discards_ignored_pending", "ktest:lumen_kernel::linux::process::signal::fatal_signal_precedes_handlers_and_keeps_first_status"]

[[feature]]
name = "Forked children receive fault signals and fatal wakeups"
milestone = "M8"
tests = ["ktest:lumen_kernel::linux::process::fork_child_fault_is_delivered_and_reaped", "ktest:lumen_kernel::linux::process::kill_wakes_fork_child_and_wins_over_exit"]

[[feature]]
name = "Signal exit ordering and fork entry delivery"
milestone = "M8"
tests = ["ktest:lumen_kernel::linux::process::recorded_exit_wins_over_later_signals", "ktest:lumen_kernel::linux::process::fork_pending_signal_precedes_first_user_instruction", "ktest:lumen_kernel::linux::process::signal::forcing_without_a_fault_preserves_another_signal_diagnostic"]

[[feature]]
name = "Deferred debug traps preserve the original address across interrupt delivery"
milestone = "M8"
tests = ["ktest:lumen_kernel::linux::signal::frame::deferred_debug_trap_keeps_original_address"]

[[feature]]
name = "Deferred debug origins preserve syscall results and restart decisions"
milestone = "M8"
tests = ["ktest:lumen_kernel::linux::signal::frame::deferred_user_debug_trap_keeps_syscall_result", "ktest:lumen_kernel::linux::signal::frame::deferred_user_debug_trap_keeps_syscall_restart", "ktest:lumen_kernel::linux::signal::frame::deferred_lstar_debug_trap_reexecutes_syscall"]

[[feature]]
name = "Signal waits, syscall restarts, SIGCHLD and stop/continue"
milestone = "M8"
tests = ["scenario:test_linux_proc::test_sigchld_and_sigint_interrupt_wait", "ktest:lumen_kernel::linux::syscall::signal::signal_waits_validate_and_consume_pending", "ktest:lumen_kernel::linux::syscall::signal::temporary_masks_survive_until_handler_and_sigreturn", "ktest:lumen_kernel::linux::process::signal::stop_generations_count_once_and_continue_cancels_dequeue"]

[[feature]]
name = "A continue followed by a new stop cannot strand the previous park"
milestone = "M8"
tests = ["ktest:lumen_kernel::linux::process::signal::continue_then_stop_releases_the_previous_park"]

[[feature]]
name = "Thread-directed fatal signals remain pending during a group stop"
milestone = "M8"
tests = ["ktest:lumen_kernel::linux::process::signal::directed_fatal_signal_stays_pending_while_stopped", "scenario:test_linux_proc::test_sigchld_and_sigint_interrupt_wait"]

[[feature]]
name = "Continue preserves unpublished stop events and serial reads honor signal restarts"
milestone = "M8"
tests = ["ktest:lumen_kernel::linux::process::signal::continue_preserves_unpublished_stop_notifications", "ktest:lumen_kernel::linux::process::serial_read_interrupts_and_restarts_after_sigreturn"]

[[feature]]
name = "Interval and POSIX timers, notification identity, overruns and retirement"
milestone = "M8"
tests = ["cargo:lumen-signal", "scenario:test_linux_proc::test_interval_and_posix_timers", "ktest:lumen_kernel::linux::process::timer::timer_instances_queues_and_overruns", "ktest:lumen_kernel::linux::process::timer::timer_dead_identity_exec_and_exit_cleanup"]

[[feature]]
name = "Timer sends preserve stop/continue semantics and isolate reused creation ids"
milestone = "M8"
tests = ["ktest:lumen_kernel::linux::process::timer::timer_send_effects_and_creation_rollback"]

[[feature]]
name = "Timer provenance, delivery-time overruns, and disarm ABI"
milestone = "M8"
tests = ["cargo:lumen-signal", "ktest:lumen_kernel::linux::process::timer::user_si_timer_cannot_suppress_or_account_kernel_timer", "ktest:lumen_kernel::linux::process::timer::timer_delivery_forwards_before_worker_and_accounts_handlers", "ktest:lumen_kernel::linux::syscall::timer::timer_disarm_and_null_settime_abi"]

[[feature]]
name = "Pending timer remainder, refused one-shots, sleeping delivery and private exec cleanup"
milestone = "M8"
tests = ["cargo:lumen-signal", "ktest:lumen_kernel::linux::process::timer::pending_timer_remainder_preserves_delivery_accounting", "ktest:lumen_kernel::linux::process::timer::refused_oneshot_expiry_reports_loss", "ktest:lumen_kernel::linux::process::timer::sleeping_timer_waiter_accounts_overruns_on_resume", "ktest:lumen_kernel::linux::process::timer::exec_discards_private_timer_and_retains_user_siginfo"]
