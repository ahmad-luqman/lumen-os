# Features: sound. See tests/features/README.md for the format.

[[feature]]
name = "Sound synthesis (lumen-synth, integer-only): square, triangle and sine oscillators at their frequency within 1% (interpolated zero crossings over a second), the square high half the time, the sine from a fixed-point quarter-wave table within 2 LSB of floating point; binary LFSR noise (period 65535, one new bit per cycle); 0 Hz is silence on every waveform; ADSR envelopes (linear attack to full in its time, decay to sustain, release from the current level, retriggering without a jump, a release forced to end within a given number of samples, using all of them); mixing saturates instead of wrapping; volume is a clamped percent that scales the output"
milestone = "M3"
tests = [
    "cargo:lumen-synth",
]

[[feature]]
name = "Tones and melodies as PCM sources: `beep` lasts exactly its length, starts quietly, fades out linearly over its release and ends on a 0 sample (also 1-10 ms and 1-sample beeps and 1/32 notes at tempo 999), at its frequency within 1%; a frequency or melody note at or above half the sample rate is refused (the melody's by its position, frequency and the rate); a melody plays its notes in order at tempo 120 unless told otherwise, for exactly its duration, honouring tempo and waveform changes where they are (also mid-melody), each note fading out, repeated short notes separated by silence; `stop` fades a tone or melody out within the release time and ends (a rest at once, never later than the sound would have), also through a boxed `dyn Source`; sources are fused; fill writes interleaved frames, pads with silence after the end, reports frames and the end, matches sample-by-sample output when filled in periods, and refuses a buffer shorter than a frame; an owned melody plays on another thread exactly as on this one; a melody text that changes after parsing ends it without panicking"
milestone = "M3"
tests = [
    "cargo:lumen-synth",
]

[[feature]]
name = "Melody notation for `play`: notes A-G in either case with `#` or lowercase `b`, octaves 0-8 (default 4), lengths /1 to /32 and dotted, rests, `t=` tempo (20-999) and `w=` waveform; plain numbers only (no sign or leading zeros); equal-tempered frequencies (A4 = 440 Hz, accidentals crossing octaves, every constructible pitch without overflow); canonical text round trips; every bad word is refused with its kind and byte position before anything plays; 100,000 generated words never panic, every error points at a char boundary, and accepted text round trips"
milestone = "M3"
tests = [
    "cargo:lumen-synth",
]

[[feature]]
name = "Harness: wav files laid out as QEMU's wav audiodev writes them (handcrafted) are read with the header's sizes left 0, 0xFFFFFFFF or past the file's end (to the end of the file, partial frames and a stray sample dropped) or set (a chunk after the data is not read as samples; odd-sized chunks before it are skipped with their pad byte), every channel exposed, WAVE_FORMAT_EXTENSIBLE only with the PCM subformat, and a capture without samples refused; a single tone's pitch is measured within 1% (zero crossings of the mean with hysteresis, through a DC offset larger than the tone and noise; square waves up to 7 kHz at 44.1 and 48 kHz; per window for melodies, refusing input shorter than a window; a chord gives its fundamental), while two notes one after the other in a window (down to a semitone apart), a gap between notes, fewer than 8 periods, noise (also low-pitched noise in 50 ms windows) and silence have none; silence is checked from zero (DC and noise are not silent, no samples is refused); a Goertzel amplitude at a given frequency; rates must be positive"
milestone = "M3"
tests = [
    "harness:test_audio::*",
]

[[feature]]
name = "virtio-sound driver: binds QEMU's sound device (`lspci` shows `sound: bound`) and picks its first output stream's format (signed 16-bit, stereo else mono, 44.1 kHz else 48 kHz else a lower then a higher rate), refusing a stream without 16-bit samples, without 1 or 2 channels or without a rate it plays, saying which (`unusable device: its first output stream lacks ...`); `sound` shows the device, its format and its record (state, sounds played and replaced, frames, underruns, volume), which `where` filters in a pipeline; a second sound device is declined (`no driver (sound declined it)`: the player is one), and a beep still plays on the first. With a made-up device (ktest): a failed device refuses sounds with its reason (also in `sound`'s state); a thread playing with no answer for over 5 s is given up for good by the next look (`stuck in a control request`, or the status when it shows DEVICE_NEEDS_RESET); a device whose status shows it broken while idle refuses the next sound at once; a failure counts what the sound played and fails the sound waiting; a sound waiting when the device is given up fails with the reason, whether the idle device shows itself broken (given up by `play`, `sound` or `format`) or the thread is stuck, and afterwards `play` is refused without leaving a sound waiting; the stuck reason stays when the thread later fails with another; the thread settles a sound found waiting on a given-up player (a hand-built state no give-up leaves); a `Settle` dropped unsettled fails its sound without overwriting a settled outcome; a sound waiting is dropped by a newer one (counted as replaced) or kept from starting by `stop`; a source at another rate is refused; periods returned in under half a sound's length (1 s or more) are caught"
milestone = "M3"
tests = [
    "scenario:test_sound::test_lspci_shows_sound_bound",
    "scenario:test_sound::test_a_second_sound_device_is_declined",
    "ktest:lumen_kernel::sound::formats_are_chosen_from_what_the_stream_supports",
    "ktest:lumen_kernel::sound::the_record_fits_its_columns",
    "ktest:lumen_kernel::sound::a_failed_or_stuck_device_refuses_sounds",
    "ktest:lumen_kernel::sound::an_idle_device_given_up_settles_the_sound_waiting",
    "ktest:lumen_kernel::sound::a_stuck_thread_given_up_settles_the_sound_waiting_behind_it",
    "ktest:lumen_kernel::sound::the_thread_settles_a_sound_left_waiting_on_a_given_up_player",
    "ktest:lumen_kernel::sound::a_settle_dropped_unsettled_fails_its_sound",
    "ktest:lumen_kernel::sound::the_pace_check_catches_periods_returned_unplayed",
]

[[feature]]
name = "`beep 440 500` plays a 440 Hz tone (within 1%) lasting 500 ms (within 10%) into QEMU's wav audiodev, and returns while it plays (`sound` says `playing` right after: from the moment `beep` hands the sound over, so the scenario no longer shows that the thread took it; that the thread plays it is the recording's and the frame counts' to show, and `playing` before it takes it is a ktest with a made-up device); the frames handed to the device are exactly the tone's (a last period's padding not counted: 510 ms), with no underrun reported, also over a 10 s tone (500 periods)"
milestone = "M3"
tests = [
    "scenario:test_sound::test_tone_is_captured",
    "scenario:test_sound::test_beep_returns_while_it_plays",
    "ktest:lumen_kernel::sound::a_sound_handed_over_shows_playing_before_the_thread_takes_it",
    "scenario:test_sound::test_a_padded_last_period_counts_only_the_sound",
    "scenario:test_sound::test_a_long_tone_plays_without_underrun",
]

[[feature]]
name = "`play` plays a melody's notes in order at their pitch (within 1%) and tempo (four quarter notes at 120 in 2 s, within 5%), returning once it has played (`sound` idle with it counted); `q` or Ctrl-C after 1 s stops a 16 s melody with under 3 s of it played (`play: stopped`); a newer sound cuts the playing one off (440 Hz then 660 Hz in the recording; counted as replaced) and a `play` cut off says `play: interrupted by a newer sound`, while a sound that has made all its samples plays out (two short rhai beeps 30 ms apart both play); a melody that doesn't parse, or a `beep` the sample rate can't carry, is refused with the reason and nothing plays"
milestone = "M3"
tests = [
    "scenario:test_sound::test_melody_notes_in_order",
    "scenario:test_sound::test_play_stops_on_a_key[*]",
    "scenario:test_sound::test_a_newer_sound_replaces_the_one_playing",
    "scenario:test_sound::test_play_says_when_a_newer_sound_cut_it_off",
    "scenario:test_sound::test_a_sound_that_has_made_its_samples_plays_out",
    "scenario:test_sound::test_bad_sounds_are_refused[*]",
]

[[feature]]
name = "`volume` shows and sets the volume new sounds get (0-100, with or without `%`; more refused): a beep, or a melody's note, at 25% is about a quarter as loud as at 100%; rhai's `beep(hz, ms)` plays, `beep()` is 440 Hz for 200 ms, and out-of-range arguments are refused; `beep` with more than two arguments or a non-number is a usage error"
milestone = "M3"
tests = [
    "scenario:test_sound::test_volume_and_beep_from_rhai",
    "scenario:test_sound::test_play_honours_the_volume",
    "scenario:test_sound::test_rhai_beep_defaults_and_ranges",
]

[[feature]]
name = "Without a sound device, `beep`, `play`, `sound` (also as records: none, with a note) and rhai's `beep` say `no sound device`; usage errors are refused first"
milestone = "M3"
tests = [
    "scenario:test_sound::test_no_sound_device_message",
]
