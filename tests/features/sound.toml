# Features: sound. See tests/features/README.md for the format.

[[feature]]
name = "Sound synthesis (lumen-synth, integer-only): square, triangle and sine oscillators at their frequency within 1% (interpolated zero crossings over a second), the square high half the time, the sine from a fixed-point quarter-wave table within 2 LSB of floating point; binary LFSR noise (period 65535, one new bit per cycle); 0 Hz is silence on every waveform; ADSR envelopes (linear attack to full in its time, decay to sustain, release from the current level, retriggering without a jump, a release forced to end within a given number of samples); mixing saturates instead of wrapping; volume is a clamped percent that scales the output"
milestone = "M3"
tests = [
    "cargo:lumen-synth",
]

[[feature]]
name = "Tones and melodies as PCM sources: `beep` lasts exactly its length, starts quietly and ends on a 0 sample (also 1-10 ms beeps and 1/32 notes at tempo 999), at its frequency within 1%; a frequency or melody note at or above half the sample rate is refused (the melody's by its position); a melody plays its notes in order for exactly its duration, honouring tempo and waveform changes where they are, repeated short notes separated by silence; `stop` fades out within the release time and ends; sources are fused; fill writes interleaved frames, pads with silence after the end, reports frames and the end, matches sample-by-sample output when filled in periods, and refuses a buffer shorter than a frame; an owned melody plays on another thread"
milestone = "M3"
tests = [
    "cargo:lumen-synth",
]

[[feature]]
name = "Melody notation for `play`: notes A-G in either case with `#` or lowercase `b`, octaves 0-8 (default 4), lengths /1 to /32 and dotted, rests, `t=` tempo (20-999) and `w=` waveform; plain numbers only (no sign or leading zeros); equal-tempered frequencies (A4 = 440 Hz, accidentals crossing octaves, every constructible pitch without overflow); canonical text round trips; every bad word is refused with its kind and byte position (a char boundary) before anything plays, also for 100,000 generated words"
milestone = "M3"
tests = [
    "cargo:lumen-synth",
]

[[feature]]
name = "Harness: wav files laid out as QEMU's wav audiodev writes them (handcrafted) are read with the header's sizes left 0 (to the end of the file, partial frames dropped) or set (a chunk after the data is not read as samples), every channel exposed, WAVE_FORMAT_EXTENSIBLE only with the PCM subformat; a single tone's pitch is measured within 1% (zero crossings of the mean with hysteresis, through a DC offset larger than the tone and noise; per window for melodies; a chord gives its fundamental), and two notes in one window, a gap between notes, noise or silence have none; a Goertzel amplitude at a given frequency"
milestone = "M3"
tests = [
    "harness:test_audio::*",
]
