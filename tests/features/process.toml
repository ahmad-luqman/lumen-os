# Features: process. See tests/features/README.md for the format.

[[feature]]
name = "Process tree rules: wait, reparenting, groups, sessions (logic)"
milestone = "M8"
tests = ["cargo:lumen-proc"]

[[feature]]
name = "Processes and threads: Process/UserThread split, PROCS lookup by pid and tid, pid 1, tids from the pid space"
milestone = "M8"
tests = [
    "ktest:lumen_kernel::linux::process::procs_lookup_and_lifetime",
    "ktest:lumen_kernel::linux::process::procs_leave_no_heap_behind",
    "ktest:lumen_kernel::linux::process::exit_status_follows_traps_c",
    "ktest:lumen_kernel::linux::process::takedown_warns_at_most_once_a_second",
    "ktest:lumen_kernel::linux::process::signal_state_refuses_kill_and_stop",
    "ktest:lumen_kernel::linux::process::process_state_owner_methods",
    "ktest:lumen_kernel::linux::syscall::task::identity_syscalls_name_the_process_and_thread",
    "ktest:lumen_kernel::linux::syscall::signal::sigaction_and_sigprocmask_round_trip",
    "cargo:lumen-proc",
]

[[feature]]
name = "Process lifecycle: fork, vfork, process clone, exit, zombies, wait4/waitid and reparenting to pid 1"
milestone = "M8"
tests = [
    "scenario:test_linux_proc::test_fork_wait_and_exit_status",
    "ktest:lumen_kernel::linux::process::fork_refusal_releases_unlinked_resources",
    "ktest:lumen_kernel::linux::process::fork_files_count_slots_and_skip_reservations",
    "ktest:lumen_kernel::linux::process::files_unshare_waits_for_open_reservations",
    "ktest:lumen_kernel::linux::process::replace_mm_keeps_process_and_thread_in_agreement",
    "ktest:lumen_kernel::linux::process::wait_child_interrupts_and_wakes_on_exit",
]

[[feature]]
name = "CLONE_FILES exit releases the departing pid's POSIX record locks"
milestone = "M8"
tests = ["ktest:lumen_kernel::linux::process::shared_files_exit_releases_its_posix_locks"]

[[feature]]
name = "Shared Files close releases every member's POSIX record locks"
milestone = "M8"
tests = ["ktest:lumen_kernel::linux::process::shared_files_close_releases_all_members_posix_locks"]

[[feature]]
name = "Shared Files leave waits for in-flight close lock cleanup"
milestone = "M8"
tests = ["ktest:lumen_kernel::linux::process::shared_files_leave_waits_for_inflight_close"]

[[feature]]
name = "Single-threaded execve: fork CoW, shebang chains, CLOEXEC, signal inheritance, argument limits, vfork release and executables over 16 MiB"
milestone = "M8"
tests = ["scenario:test_linux_proc::test_fork_cow_and_exec_shebang", "cargo:lumen-elf"]

[[feature]]
name = "Exec commit rewrites registers and comm, synthesizes argv[0], preserves failed-call state, and resets signals without losing pending entries"
milestone = "M8"
tests = [
    "ktest:lumen_kernel::linux::syscall::task::execve_replaces_frame_and_preserves_failed_call",
    "ktest:lumen_kernel::linux::process::signal::exec_signal_reset_preserves_pending_and_refuses_threads",
    "cargo:lumen-vfs",
]

[[feature]]
name = "Exec counts argument pointers without heap growth before enforcing its budget"
milestone = "M8"
tests = ["ktest:lumen_kernel::linux::syscall::task::exec_pointer_count_is_bounded_before_allocation"]

[[feature]]
name = "Exec task name has one owner and a nonblocking crash snapshot"
milestone = "M8"
tests = ["ktest:lumen_kernel::sched::exec_name_reaches_crash_snapshot_without_blocking"]

[[feature]]
name = "RLIMIT_STACK reservation rounding and exec argument budget"
milestone = "M8"
tests = ["cargo:lumen-vm"]

[[feature]]
name = "Exec records the reached file identity; procfs executable cycles return ELOOP"
milestone = "M8"
tests = [
    "cargo:lumen-vfs",
    "ktest:lumen_kernel::vfs::procfs::procfs_exe_cycles_share_the_symlink_limit",
    "scenario:test_linux_proc::test_fork_cow_and_exec_shebang",
]

[[feature]]
name = "Exec checks ordered envp, absolute and raw-byte /proc/self/exe, exact script argv, nesting 5/6, MAX_ARG_STRLEN, reexec through exe and fd aliases, renamed fd exec and fresh AT_RANDOM"
milestone = "M8"
tests = ["scenario:test_linux_proc::test_fork_cow_and_exec_shebang", "scenario:test_linux_proc::test_exec_uses_unseeded_random_fallback", "cargo:lumen-vfs"]

[[feature]]
name = "Fatal signals interrupt exec while walking user argument pointers"
milestone = "M8"
tests = ["ktest:lumen_kernel::linux::syscall::task::exec_argument_walk_observes_fatal_signal"]

[[feature]]
name = "Small syscalls: affinity, priorities, rusage, comm, statfs, clocks, sysinfo, getcpu and writable RLIMIT_STACK across exec"
milestone = "M8"
tests = [
    "scenario:test_linux_proc::test_small_syscalls",
    "ktest:lumen_kernel::linux::syscall::sys::tests::small_syscalls_copyout_and_errors",
    "ktest:lumen_kernel::linux::syscall::sys::tests::small_syscalls_names_and_stack_limits",
    "cargo:lumen-vfs",
]

[[feature]]
name = "Timer accounting distinguishes interrupted user and kernel execution"
milestone = "M8"
tests = ["ktest:lumen_kernel::sched::cpu_ticks_distinguish_user_and_system"]

[[feature]]
name = "Priority target selection and CPU accounting include live and exited non-leaders; tmpfs statistics follow quota use"
milestone = "M8"
tests = [
    "ktest:lumen_kernel::linux::syscall::sys::tests::priority_and_usage_include_nonleader_threads",
    "ktest:lumen_kernel::linux::syscall::sys::tests::statfs_tmpfs_tracks_quota_consumption",
]

[[feature]]
name = "Reaping transfers own and descendant CPU usage once; WNOWAIT never transfers it"
milestone = "M8"
tests = [
    "ktest:lumen_kernel::linux::process::table::reaped_usage_includes_descendants_once",
    "scenario:test_linux_proc::test_fork_wait_and_exit_status",
]

[[feature]]
name = "C12 review: raw comm fork inheritance, page-boundary names, Linux error precedence, CPU 1 affinity, reduced exec stacks and exact filesystem/cache statistics"
milestone = "M8"
tests = [
    "scenario:test_linux_proc::test_small_syscalls",
    "ktest:lumen_kernel::vfs::ext4::ext4_statfs_matches_superblock_counts",
    "ktest:lumen_kernel::linux::syscall::sys::tests::sysinfo_reports_populated_page_cache",
]

[[feature]]
name = "C12 round 2: raw exec comm, zombie priorities, rounded uptime, exact sysinfo counters and validated stack limits"
milestone = "M8"
tests = [
    "scenario:test_linux_proc::test_small_syscalls",
    "ktest:lumen_kernel::sched::task_name_normalizes_raw_comm",
    "ktest:lumen_kernel::linux::syscall::sys::tests::sysinfo_uptime_rounds_up",
    "ktest:lumen_kernel::linux::syscall::sys::tests::sysinfo_reports_free_frames_and_live_processes",
    "cargo:lumen-vm",
]

[[feature]]
name = "Task comm display handles invalid UTF-8 without heap allocation"
milestone = "M8"
tests = ["ktest:lumen_kernel::sched::task_name_display_needs_no_heap"]
