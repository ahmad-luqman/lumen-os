# Features: harness. See tests/features/README.md for the format.

[[feature]]
name = "In-kernel test runner (TAP over serial, isa-debug-exit); `lumen.ktest=<prefix>[,<prefix>...]` runs only the tests whose names start with one of the prefixes (said in a TAP comment; none selected fails the run), as the stalled-calibration runs do"
milestone = "M0"
tests = [
    "scenario:test_ktest::test_in_kernel_tests_pass",
    "scenario:test_ktest::test_in_kernel_tests_pass_with_calibrations_stalled_within_tolerance[*]",
    "ktest:lumen_kernel::ktest::ktest_registry_is_populated",
    "ktest:lumen_kernel::ktest::a_filter_selects_tests_by_name_prefix",
    "scenario:test_ktest::test_a_ktest_filter_that_selects_nothing_fails",
    "harness:test_tap::*",
]

[[feature]]
name = "A ktest's repeated warnings and errors held back from serial while it runs (`klog::hold_repeats`, #347; the ext4 fault sweeps): a line when it starts and when it ends, each call site's first line printed, the rest kept in the `dmesg` ring and summarized at the guard's drop as a count and a copy of the newest, other tags and `info` lines printed as always, a full table printing every line; test_ktest counts every vfs family from the printed lines and the summaries, each line fitting one family, and fails on a sweep line or summary outside a guard, a guard count other than the kernel source's, more than one printed line per sweep family in a guard, a summary of a family its guard didn't print (or of an exact family, or not a vfs line), or a guard's total other than its summaries' sum"
milestone = "M7"
tests = [
    "scenario:test_ktest::test_in_kernel_tests_pass",
    "ktest:lumen_kernel::klog::repeats_held_back_from_serial_are_summarized_when_the_guard_drops",
    "harness:test_klog::test_held_back_lines_are_read_and_a_summarys_copy_is_no_log_line",
    "cargo:lumen-trace",
]

[[feature]]
name = "A re-run with LUMEN_ARTIFACTS_DIR (CI's TCG re-run) keeps its artifacts and ktest.tap apart from the first run's (never in build/test-results or build/test-artifacts; status says why ktest results are missing)"
milestone = "M1"
tests = [
    "harness:test_artifacts::test_a_rerun_keeps_the_first_runs_ktest_tap",
    "harness:test_artifacts::test_a_rerun_on_a_fresh_tree_writes_no_first_run_tap",
    "harness:test_artifacts::test_a_rerun_dir_may_not_be_the_first_runs[*]",
    "harness:test_artifacts::test_artifacts_root_follows_lumen_artifacts_dir",
    "harness:test_artifacts::test_the_artifacts_fixture_follows_a_rerun_dir",
    "harness:test_artifacts::test_the_ktest_scenario_saves_through_save_ktest_tap",
    "harness:test_status::test_a_missing_ktest_tap_is_explained",
    "harness:test_status::test_a_ktest_tap_saved_in_a_rerun_dir_is_named",
    "harness:test_status::test_the_hint_survives_an_invalid_rerun_dir",
    "harness:test_status::test_no_hint_with_a_ktest_tap_or_no_failing_ktest_feature",
]

