[[feature]]
name = "Input steps that confirm each effect (lumen_harness.gui): pointer_move, pointer_down/pointer_up and drag wait until `mouse` counts exactly each step's frame and the mouse thread's state shows its effect (position, button held or released), else fail naming the step and the counts seen; a held or failed tablet fails the step at once, sending nothing; keys typed through confirmed_keys/type_confirmed wait until `kbd` counts exactly each key's presses and bytes (KEY_BYTES, a closed table pinned by sending every key in it, Print Screen and Pause included, through QEMU; any other key refused before typing), still exactly once QEMU sent everything, with no key held and nothing dropped, undecoded or flagged, else fail naming it (\"key N of M ... never reached the guest\", a prefix or release lost, a key still held, a byte dropped); counts past a step's target fail (input sent earlier still arriving), and each call first waits for earlier input to be sent and settle with no key held (a key held across the call, or an unconfirmed burst, doesn't confirm the next); a failed reading names its step and every reading waits only the time the step has left; host-tested on a fake machine and clock incl. the scaled timeout and polling. `kbd` counts the keys pressed and held among the keyboard's bytes as they arrive, a dropped byte's too (set 1 make codes, prefixes, fake shifts and Pause each one key or none; host-tested; a ktest drives the producer's step with a full queue); test_history_and_line_editing types through confirmed_keys"
milestone = "M4"
tests = [
    "harness:test_input_steps::*",
    "cargo:lumen-input",
    "scenario:test_input::test_drag_steps_are_confirmed",
    "scenario:test_input::test_keys_via_qmp_send_key",
    "scenario:test_input::test_every_modelled_key_is_confirmed",
    "scenario:test_shell::test_history_and_line_editing",
    "ktest:lumen_kernel::keyboard::a_key_counts_as_it_arrives_even_when_dropped",
]

[[feature]]
name = "The flake census: how often CI's first attempt went red (cancelled, skipped, unapproved and job-less runs left out), per day and in all, how many of those passed on a re-run (a floor on the flakes), and which pytest tests, ktests and host tests (should-panic tests and doctests too) failed them, read from every job of theirs that didn't pass (the TCG re-run's part left out; a step cut short read from its progress lines; a log that can't be read said as such; GitHub's cap on a listing said) (`make census`, with the GitHub API faked in its tests; weekly into the `flake-census` workflow's summary, its run not itself tested)"
milestone = "M4"
tests = [
    "harness:test_census::*",
]

[[feature]]
name = "Scenario typing is confirmed or says why (#128): each statement in tests/scenarios that calls or names `.press`, `.type_text` or `.send_key`, or names QMP's `send-key`, has its own `# unconfirmed: <why>` comment (on its line or in the comment-only block directly above; a code line's trailing mark is only its own), found with ast/tokenize, not in strings; in lumen_harness and tests/conftest.py exactly the functions implementing those paths (and confirmed_keys) use them; `send_input` refuses key events; the scans fail if they find no files"
milestone = "M4"
