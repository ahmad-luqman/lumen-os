    "harness:test_qemu::test_a_bad_timeout_scale_fails_before_qemu_starts",
    "harness:test_qemu::test_expect_timeout_shows_the_scaled_wait[*]",
    "harness:test_qemu::test_wait_exit_timeout_shows_the_scaled_wait[*]",
