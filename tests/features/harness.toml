# Features: harness. See tests/features/README.md for the format.

[[feature]]
name = "In-kernel test runner (TAP over serial, isa-debug-exit)"
milestone = "M0"
tests = [
    "scenario:test_ktest::test_in_kernel_tests_pass",
    "ktest:lumen_kernel::ktest::ktest_registry_is_populated",
    "harness:test_tap::*",
]

[[feature]]
name = "A re-run with LUMEN_ARTIFACTS_DIR (CI's TCG re-run) keeps its artifacts and ktest.tap apart from the first run's (never in build/test-results; status says why ktest results are missing)"
milestone = "M1"
tests = [
    "harness:test_artifacts::test_a_rerun_keeps_the_first_runs_ktest_tap",
    "harness:test_artifacts::test_a_rerun_on_a_fresh_tree_writes_no_first_run_tap",
    "harness:test_artifacts::test_a_rerun_dir_may_not_be_the_results_dir",
    "harness:test_artifacts::test_artifacts_root_follows_lumen_artifacts_dir",
    "harness:test_artifacts::test_the_artifacts_fixture_follows_a_rerun_dir",
    "harness:test_artifacts::test_the_ktest_scenario_saves_through_save_ktest_tap",
    "harness:test_status::test_a_missing_ktest_tap_under_a_rerun_dir_is_explained",
]

[[feature]]
name = "Codegen audit: no SSE/AVX, no red zone, kernel code model, frame pointers, every section inside the kernel image"
milestone = "M0"
tests = [
    "audit:flags",
    "harness:test_audit::*",
]

[[feature]]
name = "Golden-image comparison for screendumps"
milestone = "M0"
tests = [
    "harness:test_image::*",
]

[[feature]]
name = "STATUS.md generated from test results"
milestone = "M0"
tests = [
    "harness:test_status::*",
]

[[feature]]
name = "Scenario machines take extra QEMU arguments (-smp, machine options)"
milestone = "M1"
tests = [
    "harness:test_qemu::test_args_include_extra",
    "harness:test_qemu::test_machine_appends_extra_args_last",
    "scenario:test_acpi::test_cpu_count_matches_qemu[*]",
    "scenario:test_acpi::test_no_hpet_is_a_warning",
    "scenario:test_acpi::test_no_madt_boots_without_acpi",
]

[[feature]]
name = "make test-scenarios passes -n auto to pytest-xdist by default (SCENARIO_JOBS=0: serial); QMP sockets per machine, artifact directories per module and test"
milestone = "M1"
tests = [
    "harness:test_ci_config::test_scenarios_run_in_parallel_by_default",
    "harness:test_qemu::test_live_machines_never_share_a_qmp_socket",
    "harness:test_artifacts::test_artifacts_are_keyed_by_module_and_test",
    "harness:test_artifacts::test_the_artifacts_fixture_uses_artifact_dir",
]

[[feature]]
name = "Each scenario machine records the QEMU version, accelerator and OVMF version with its artifacts"
milestone = "M1"
tests = [
    "harness:test_qemu::test_each_run_records_its_environment[*]",
    "harness:test_qemu::test_qemu_version_is_the_first_non_blank_line",
    "harness:test_qemu::test_qemu_version_says_why_it_is_unknown",
    "harness:test_qemu::test_qemu_version_retries_after_a_failure",
    "harness:test_qemu::test_qemu_version_survives_a_timeout",
    "harness:test_qemu::test_ovmf_version_comes_from_the_fetch_stamp",
]

[[feature]]
name = "Harness overrides (LUMEN_QEMU, LUMEN_OVMF_VARS, LUMEN_SOCK_DIR, LUMEN_TIMEOUT_SCALE, LUMEN_GDB): an empty value means unset, a set one is used"
milestone = "M1"
tests = [
    "harness:test_qemu::test_empty_overrides_mean_unset",
    "harness:test_qemu::test_empty_sock_dir_means_unset",
    "harness:test_qemu::test_empty_timeout_scale_means_unset",
    "harness:test_qemu::test_empty_gdb_means_unset",
]

[[feature]]
name = "The feature gate writes the feature table, failing rows included, to the CI job summary; its CI step runs after failed scenarios too"
milestone = "M1"
tests = [
    "harness:test_status::test_ci_job_summary_gets_the_table[*]",
    "harness:test_ci_config::test_feature_gate_runs_after_failed_scenarios",
]
