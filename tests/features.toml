# Feature -> test mapping. docs/STATUS.md is generated from this file plus the
# latest test results (`make status`); nothing is "working" unless a test here
# checks it (hard rule 1).
#
# Test IDs:
#   scenario:<file>::<test>   tests/scenarios (QEMU); `*` globs parametrized cases
#   harness:<file>::<test>    tests/harness (host-side harness self-tests)
#   ktest:<path>              in-kernel test (TAP name)
#   audit:flags               `make audit`
#   cargo:<crate>             host unit tests of a Rust crate (`cargo test`)
#
# Add a feature here in the same PR that adds its tests.

[[feature]]
name = "Boots via Limine (UEFI, q35) and reaches the structured logger"
milestone = "M0"
tests = ["scenario:test_boot::test_boot_reaches_logger", "scenario:test_boot::test_log_lines_are_structured"]

[[feature]]
name = "GDT/TSS and IDT installed by the kernel"
milestone = "M0"
tests = ["ktest:lumen_kernel::gdt_and_idt_are_ours"]

[[feature]]
name = "Exception entry path saves and restores all registers (#BP resumes)"
milestone = "M0"
tests = ["ktest:lumen_kernel::breakpoint_exception_returns", "scenario:test_boot::test_breakpoint_is_survivable"]

[[feature]]
name = "Crash report for CPU exceptions: symbolized rip, registers, backtrace (#PF #UD #DE #GP #DF)"
milestone = "M0"
tests = ["scenario:test_crash::test_fault_produces_symbolized_report[*]", "scenario:test_crash::test_page_fault_report_names_address_and_cause", "ktest:lumen_kernel::crash::page_fault_cause_is_decoded"]

[[feature]]
name = "Double fault runs on its own IST stack"
milestone = "M0"
tests = ["scenario:test_crash::test_fault_produces_symbolized_report[df]"]

[[feature]]
name = "Crash report for Rust panics"
milestone = "M0"
tests = ["scenario:test_crash::test_panic_produces_report"]

[[feature]]
name = "Crash report shown on the framebuffer"
milestone = "M0"
tests = ["scenario:test_crash::test_crash_screen_golden"]

[[feature]]
name = "Kernel symbol table from Limine's executable file"
milestone = "M0"
tests = ["ktest:lumen_kernel::symbols::symbols_resolve_kernel_functions", "cargo:lumen-elf"]

[[feature]]
name = "Framebuffer hello screen (golden image)"
milestone = "M0"
tests = ["scenario:test_screen::test_boot_hello_golden"]

[[feature]]
name = "Serial input from the harness (kernel monitor)"
milestone = "M0"
tests = ["scenario:test_boot::test_serial_input_round_trip"]

[[feature]]
name = "Kernel command line parsing; log level and tags"
milestone = "M0"
tests = ["ktest:lumen_kernel::cmdline::cmdline_parses_flags_and_values", "ktest:lumen_kernel::klog::log_tags_strip_crate_and_arch_prefixes"]

[[feature]]
name = "In-kernel test runner (TAP over serial, isa-debug-exit)"
milestone = "M0"
tests = ["scenario:test_ktest::test_in_kernel_tests_pass", "ktest:lumen_kernel::ktest::ktest_registry_is_populated", "harness:test_tap::*"]

[[feature]]
name = "Codegen audit: no SSE/AVX, no red zone, kernel code model, frame pointers"
milestone = "M0"
tests = ["audit:flags", "harness:test_audit::*"]

[[feature]]
name = "Golden-image comparison for screendumps"
milestone = "M0"
tests = ["harness:test_image::*"]

[[feature]]
name = "STATUS.md generated from test results"
milestone = "M0"
tests = ["harness:test_status::*"]
